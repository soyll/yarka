<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Курс JavaScript</title>

	<script>
		let person = new Object();
		
		person.surname = "Довлатов";
		person.name = "Сергей";
		person.patronymic = "Донатович";
		person.post = "Преподаватель";
		person.ocupation = "Санкт-Петербургский государственный университет (филологический факультет)";
		person.degree = "Высшее";
		person.category = "Первая";
		person.site = "suitcase.wordpress.com";
		person.email = "suitcase@mail.ru";
		person.note = "Я оглядел пустой чемодан. На дне – Карл Маркс. На крышке – Бродский. А между ними – пропащая, бесценная, единственная жизнь.";

		person.discipline = [];
		const count = Number(prompt('Сколько дисциплин ведёт преподаватель?', '3'));
		for (let i = 0; i < count; i++) {
			person.discipline.push(prompt(`Введите дисциплину ${i + 1}`, 'Информатика'));
		}
	</script>

</head>

<body>
	
	<header>
		<h1 align = "center">Введение в JavaScript</h1>
	</header>	
	
	<div class="content">
		
		<script>
			const line = `
				<h2>${person.surname} ${person.name} ${person.patronymic}</h2>
				<p><i>Должность:</i> ${person.post}</p>
				<p><i>Образование:</i> ${person.ocupation}</p>
				<p><i>Уровень образования:</i> ${person.degree}</p>
				<p><i>Категория:</i> ${person.category}</p>
				<p><i>Сайт:</i> ${person.site}</p>
				<p><i>E-mail:</i> ${person.email}</p>
				<p><i>Примечание:</i> ${person.note}</p>
				<p><i>Дисциплины:</i></p>
				<ul>
					${person.discipline.map(item => `<li>${item}</li>`).join('')}
				</ul>
			`;

			document.write(line);
		</script>		

	</div>
		
	<footer align = "center">
		<h3>Добро пожаловать на pechora_PROger</h3>
		<a href="https://vk.com/pechora_proger" target="__blank">pechora_PROger</a>
	</footer>

</body>
</html>
