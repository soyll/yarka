<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Курс JavaScript</title>
	<script>
		const person = {
			category: 'Высшая',
			site: 'master.sweb.ru',
			email: 'master@mail.ru',
			note: 'Нет данных'
		};

		person.surname = prompt('Введите фамилию', 'Баранов');
		person.name = prompt('Введите имя', 'Виктор');
		person.patronymic = prompt('Введите отчество', 'Александрович');
		person.ocupation = prompt('Введите должность', 'Преподаватель специальных дисциплин');
		person.degree = prompt('Введите уровень образования', 'Высшее');
	</script>
</head>

<body>
	<header>
		<h1 align = "center">Введение в JavaScript</h1>
	</header>	
	
	<div class="content">
		<script>
			const line = `
				<h2>${person.surname} ${person.name} ${person.patronymic}</h2>
				<p><i>Должность:</i> ${person.ocupation}</p>
				<p><i>Уровень образования:</i> ${person.degree}</p>
				<p><i>Категория:</i> ${person.category}</p>
				<p><i>Сайт:</i> ${person.site}</p>
				<p><i>E-mail:</i> ${person.email}</p>
				<p><i>Примечание:</i> ${person.note}</p>
			`;

			document.write(line);
		</script>		
	</div>
		
	<footer align = "center">
		<h3>Добро пожаловать на pechora_PROger</h3>
		<a href="https://vk.com/pechora_proger" target="__blank">pechora_PROger</a>
	</footer>
</body>
</html>
