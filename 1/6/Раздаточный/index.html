<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style/style.css" />
        <title>Преподаватель</title>
        <script>
            const ask = (label, defaultValue) => {
                if (typeof window.prompt === 'function') {
                    return window.prompt(label, defaultValue);
                }
                return defaultValue;
            };

            let person = {
                surname: "Михеева",
                name: "Татьяна",
                patronymic: "Александровна",
                occupation: "Преподаватель специальных дисциплин",
                degree: "Высшее",
                education: "Московский государственный институт электронной техники (технический университет)",
                qualification: "Инженер-программист инфокоммуникационных систем",
                specialty: "Программное обеспечение радиоэлектронных систем",
                discipline: ["Основы алгоритмизации и программирования", "Компьютерная графика"],
                category: "",
                experience: "",
                email: "",
                site: ""
            };

            person.category = ask("Введите категорию педагога:", "Высшая");
            person.experience = ask("Введите стаж работы:", "10 лет");
            person.email = ask("Введите адрес электронной почты:", "teacher@example.com");
            person.site = ask("Введите персональный сайт:", "https://example.com");

            window.addEventListener("DOMContentLoaded", () => {
                const section = document.querySelector(".info");
                const disciplines = person.discipline
                    .map((item) => `<li>${item}</li>`)
                    .join("");

                section.innerHTML = `
                    <h1>${person.surname} ${person.name} ${person.patronymic}</h1>
                    <h2>${person.occupation}</h2>
                    <hr class="info__hr" />
                    <h3>Основная информация:</h3>
                    <ul class="info__list">
                        <li><span class="info__item">Уровень образования: </span>${person.degree}</li>
                        <li><span class="info__item">Образование: </span>${person.education}</li>
                        <li><span class="info__item">Квалификация: </span>${person.qualification}</li>
                        <li><span class="info__item">Специализация: </span>${person.specialty}</li>
                        <li>
                            <span class="info__item">Преподаваемые дисциплины:</span>
                            <ul>
                                ${disciplines}
                            </ul>
                        </li>
                    </ul>
                    <h3>Дополнительная информация:</h3>
                    <ul class="info__list">
                        <li><span class="info__item">Категория: </span>${person.category}</li>
                        <li><span class="info__item">Стаж: </span>${person.experience}</li>
                        <li><span class="info__item">E-mail: </span>${person.email}</li>
                        <li><span class="info__item">Персональный сайт: </span>${person.site}</li>
                    </ul>
                `;
            });
        </script>
    </head>
    <body>
    <header class="header">
        <nav class="header__nav">
            <ul class="header__list">
                <li class="header__item">
                    <a href="#" class="header__link">О проекте</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Курсы</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Преподаватели</a>
                </li>
                <li class="header__item">
                    <a href="#" class="header__link">Контакты</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="container">
    
    <section class="foto">
        <img src="img/no-image.jpg" class="foto_pic" alt="упс..." />
    </section>
    
    <section class="info">
        <h1>Загрузка данных...</h1>
    </section>
    </main>

    <footer class="footer">
        <nav class="footer__nav">
            <ul class="footer__list">
                <li class="footer__item">
                    <a href="#" class="footer__link">О проекте</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link">Курсы</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link">Преподаватели</a>
                </li>
                <li class="footer__item">
                    <a href="#" class="footer__link">Контакты</a>
                </li>
            </ul>
        </nav>
        <div class="footer__info">
            Страница создана по заявке ЕВ. Все права защищены. 2022
        </div>
    </footer>

    </body>
</html>
