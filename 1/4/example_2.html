<body>
	<header>
		<h1 align = "center">Введение в JavaScript</h1>
	</header>
	
	<script>
		// неявное преобразование

		// 2 преобразуется в "2"
		console.log("5" + 2);  // 52 

		// но,
		// "5" преобразуется в 5
		console.log("5" - 2);  // 3 

		// "5" и "2" преобразуется в 5 и 2 
		console.log("5" * "2");   // 10 

		// null преобразуется в 0
		console.log(5 + null);    // 5 

		// но,
		// null преобразуется в "null"
		console.log("5" + null);  // 5null 
	</script>
