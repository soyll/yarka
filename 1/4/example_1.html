	<script>
		// преобразование типов способно преподносить сюрпризы
		console.log ("2 + 2 не равно '2' + '2'"); 
		
		// здесь логично
		console.log ("2 + 2 = ", 2 + 2 );  // 4
		
		// здесь вроде бы тоже
		console.log ("'2' + '2' = ", '2' + '2');  // 22
		
		// но, что будет здесь?
		console.log ("'2' + 2 = ", '2' + 2);  // 22
		
		// а здесь?
		console.log ("('2' + 2) / 10 = ", ('2' + 2) / 10);  // 2.2
		
		// всегда задавайте себе вопросы
	</script>
