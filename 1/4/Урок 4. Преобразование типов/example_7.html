<body>
	<header>
		<h1 align = "center">Введение в JavaScript</h1>
	</header>
	
	<script>
		// Number не приводит тип
		console.log(Number("123qwerty")); // NaN
		
		// parseInt справляется
		console.log(parseInt("123qwerty")); // 123
		
		console.log(parseInt("123qwerty") + 3); // 126
		
		// но тоже не всегда
		console.log(parseInt("qwerty123")); // NaN
	</script>
