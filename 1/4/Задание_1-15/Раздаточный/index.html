<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Курс JavaScript</title>
	<script src="person.js"></script>
</head>

<body>
	<header>
		<h1 align = "center">Введение в JavaScript</h1>
	</header>
	
	<script>
		const person = {
			surname: String(surname),
			name: String(name),
			patronymic: String(patronymic),
			generalExperience: parseFloat(String(generalExperience).replace(/\D+/g, '')),
			collegeExperience: parseFloat(String(collegeExperience).replace(/\D+/g, '')),
			actual: Boolean(actual),
			date: String(date),
			discipline: String(discipline),
			education: String(education),
			site: 'master.sweb.ru',
			email: 'master@mail.ru'
		};

		console.log(person);

		const line = `
			<h2>${person.surname} ${person.name} ${person.patronymic}</h2>
			<p><b>Общий стаж:</b> ${person.generalExperience} лет</p>
			<p><b>Стаж в техникуме:</b> ${person.collegeExperience} лет</p>
			<p><b>Актуальность:</b> ${person.actual}</p>
			<p><b>Дата:</b> ${person.date}</p>
			<p><b>Дисциплина:</b> ${person.discipline}</p>
			<p><b>Образование:</b> ${person.education}</p>
			<p><b>Сайт:</b> ${person.site}</p>
			<p><b>E-mail:</b> ${person.email}</p>
		`;
		document.write(line);
	</script>	
	
	<footer align = "center">
		<h3>Добро пожаловать на pechora_PROger</h3>
		<a href="https://vk.com/pechora_proger" target="__blank">pechora_PROger</a>
	</footer>
</body>
</html>
