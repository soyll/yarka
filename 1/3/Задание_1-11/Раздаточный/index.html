<!doctype html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Курс JavaScript</title>
</head>
<body>
    <header>
        <h1 align="center">Введение в JavaScript</h1>
    </header>

    <div class="content">
        <script>
            const person = {
                surname: 'Карамзин',
                name: 'Виктор',
                patronymic: 'Геннадьевич',
                ocupation: 'Преподаватель специальных дисциплин',
                degree: 'Высшее',
                category: 'Первая',
                education: 'Московский государственный институт электронной техники (технический университет)',
                discipline: 'Информатика',
                note: 'Педагогический опыт и высокий профессиональный уровень.'
            };

            const line = `
                <h2>${person.surname} ${person.name} ${person.patronymic}</h2>
                <p><i>Должность:</i> ${person.ocupation}</p>
                <p><i>Уровень образования:</i> ${person.degree}</p>
                <p><i>Категория:</i> ${person.category}</p>
                <p><i>Образование:</i> ${person.education}</p>
                <p><i>Дисциплина:</i> ${person.discipline}</p>
                <p><i>Примечание:</i> ${person.note}</p>
            `;

            document.write(line);
        </script>
    </div>

    <footer align="center">
        <h3>Добро пожаловать на pechora_PROger</h3>
        <a href="https://vk.com/pechora_proger" target="__blank">pechora_PROger</a>
    </footer>
</body>
</html>
