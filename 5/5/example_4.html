<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>	
		// создание и инициализация коллекции объектами
		let set = new Set(
			[
				// первый и третий элементы похожи, но не одинаковы
				{ name: "John" },
				{ name: "Pete" },
				{ name: "John" }
			]	
		);

		// размер коллекции
		console.log(set.size); 
		
		// вывод коллекции в консоль
		console.log(set);  			
	</script>

</head>
