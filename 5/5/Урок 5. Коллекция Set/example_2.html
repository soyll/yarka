<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>	
		// исходный массив
		let res = ["php", "js", 0];

		// набор новых элементов для тестирования
		var newel = "php"; // не будет добавлен
		// var newel = "js"; // не будет добавлен
		// var newel = 20; // будет добавлен

		// добавим только уникальные значения				
		for (let elem of res) {
		    // выражение в скобках вернет true или false
		    // обратите внимание на инверсию в условии
			if (!res.includes(newel)) {
		      res.push(newel);
		    }
		}	
		
		// проверим массив
		console.log(res);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	</footer>
</body>
</html>
