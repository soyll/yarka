<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>	
		// инициируем коллекцию строковыми значениями
		let set = new Set(
			[
				"JavaScript разработчик с нуля",
				"Python-рузработчик", 
				"Data Scientist", 
				"Фронтенд-разработчик на JavaScript", 
				"Тестирование веб-приложений на Python", 
				"Разработчик C++"
			]	
		);

		console.log("Это объект keys:", set.keys());

		console.log("Это объект values:", set.values());
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
