<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>	
		// инициируем коллекцию строковыми значениями
		let set = new Set(
			[
				"JavaScript разработчик с нуля",
				"Python-рузработчик", 
				"Data Scientist"
			]	
		);
		
		// добавим в коллекцию массив 
		set.add( [4, "Фронтенд-разработчик на JavaScript", 3] );
		
		// добавим в коллекцию объект
		set.add( { id: 6, name: "Разработчик C++", leader: 2} );
		
		// вывод коллекции в консоль
		console.log(set);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
