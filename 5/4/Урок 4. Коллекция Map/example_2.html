<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// создание объекта коллекции
		let map = new Map();

		// записываем в коллекцию данные ноутбука
		// используем классические строковые ключи
		map.set("id", 1);
		map.set("title", "Ноутбук HUAWEI MateBook D16 RLEF-X");
		map.set("gpu", "Intel Iris Xe Graphics");
		map.set("cpu", "Intel Core i5-12500H");
		map.set("cpu_cores", 12);
		map.set("ram", "16 ГБ");
		map.set("diagonal", "16'");
		map.set("price", 76.299);
		map.set("img", "huawei-matebook-d16-rlef-x.jpg");
		
		console.log("Коллекция Map:");
		
		// вывод коллекции в консоль
		console.log(map);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
