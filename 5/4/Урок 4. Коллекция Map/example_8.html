<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// создание объекта коллекции
		let note = new Map();

		// цепочка вызовов метода set
		note
		.set("id", 1)
		.set("title", "Ноутбук HUAWEI MateBook D16 RLEF-X")
		.set("gpu", "Intel Iris Xe Graphics")
		.set("cpu", "Intel Core i5-12500H")
		.set("cpu_cores", 12)
		.set("ram", "16 ГБ")
		.set("diagonal", "16'")
		.set("price", 76.299)
		.set("img", "huawei-matebook-d16-rlef-x.jpg");

		// вывод коллекции в консоль
		console.log(note);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
