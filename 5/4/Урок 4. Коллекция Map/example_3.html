	<title>Программирование в среде JavaScript</title>

	<script>
		// ручное создание объекта коллекции
		// инициируем коллекцию через создание двумерного массива

			["id", 1],
			["title", "Ноутбук HUAWEI MateBook D16 RLEF-X"],
			["gpu", "Intel Iris Xe Graphics"],
			["cpu", "Intel Core i5-12500H"],
			["cpu_cores", 12],
			["ram", "16 ГБ"],
			["diagonal", "16'"],
			["price", 76.299],
			["img", "huawei-matebook-d16-rlef-x.jpg"]
		]);

		console.log("Коллекция Map:");
		
		// вывод коллекции в консоль
		console.log(map);
	</script>
