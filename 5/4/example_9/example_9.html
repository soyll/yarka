<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="courses_map.js"></script>

	<script>
		// перебор коллекции Map специальным циклом of
		// каждый элемент коллекции - массив
		for ( item of courses_map ) {
			console.log("key: " + item[0], item[1]);
		};

		console.log("===============");

		// или так ...
		// альтернативная форма записи 
		for ( [key, elem] of courses_map ) {
			console.log("key: " + key, elem);
		};
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	</footer>
</body>
</html>
