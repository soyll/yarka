<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<h2>Я не изменился, я просто повзрослел (Джокер)</h2>
	
	<h2>JSON-объект создан на странице example_7-1.html</h2>
	
	<script>	
		// получаем информацию из localStorage 
		let userJSON = localStorage.getItem('user'); 
		
		// объект JSON
		document.write("<b>строка JSON:</b> ", userJSON, "<p>"); // {"name":"Евгений","surname": ...

		// объект JS
		document.write("<b>объект JS:</b> ", JSON.parse(userJSON)); // [object Object]
	</script>

</body>
