<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>	
		// JS-объект данных
		let user = {
		   name: "Евгений",
		   surname: "Лукашин",
		   address: {
		       street: "3-я улица Строителей, дом 25",
		       city: "Ленинград",
		       post: 101101
		   },
		   phone: [
		       "(912)552-92-25",
		       "(904)104-17-06"
		   ]
		}
		
		// преобразуем JS в JSON
		userJSON = JSON.stringify(user);

		// сохраняем JSON в sessionStorage
		window.sessionStorage.setItem("user", userJSON);

		// JSON-объект, который получим на странице example_10-2.html
		console.log("Предварительный вывод объекта:");
		console.log(sessionStorage.getItem("user"));
	</script>

</head>

	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
