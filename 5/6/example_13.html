<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<h2>Иногда ты должен сыграть роль дурачка, чтобы одурачить того, кто думает, что он дурачит тебя... (Джокер)</h2>

	<script>	
		// JS-объект
		let user = {
		   name: "Евгений",
		   surname: "Лукашин",
		   address: {
		       street: "3-я улица Строителей, дом 25",
		       city: "Печора",
		       post: 101101
		   },
		   phone: [
		       "(912)552-92-25",
		       "(904)104-17-06"
		   ],
		   edu: [
		   		"Даугавпилсское высшее военное авиационное инженерное училище",
		   		"Ивановский энергетический университет"
		   ]
		}

		// очистим хранилище
		localStorage.clear();

		// сохраним ключи JS объекта в объект хранилища
		localStorage.setItem("name", user.name);
		localStorage.setItem("surname", user.surname);
		localStorage.setItem("address", JSON.stringify(user.address));
		localStorage.setItem("phone", JSON.stringify(user.phone));
		localStorage.setItem("edu", JSON.stringify(user.edu));

		// пройдем циклом по ключам хранилища
		for(let i=0; i<localStorage.length; i++) {
			// метод key – получим ключ на заданной позиции
			let key = localStorage.key(i);
			
			// значения ключей выводятся в виде строк
			console.log(key, " -> ", localStorage.getItem(key));
		}
	</script>

	</footer>
</body>
</html>
