<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<h2>Вы никогда не добьетесь успеха, если будете заботиться о том, что думают другие (Джокер)</h2>

	<script>	
		// сложная структура данных для хранения
		let user = {
		   name: "Евгений",
		   surname: "Лукашин",
		   address: {
		       street: "3-я улица Строителей, дом 25",
		       city: "Ленинград",
		       post: 101101
		   },
		   phone: [
		       "(912)552-92-25",
		       "(904)104-17-06"
		   ]
		};

		// предварительно очистим объект
		localStorage.clear();

		// доступ как к обычному объекту
		localStorage.num = 100;

		localStorage.str = "Добро пожаловать!";		

		localStorage.bool = true;

		localStorage.arr = ["js", "шпрехшталмейстер", "балалайка"];		

		localStorage.obj = user;

		// вывод свойств объекта в консоль
		console.log(localStorage.num);

		console.log(localStorage.str);
		
		console.log(localStorage.bool);
		
		console.log(localStorage.arr);
		
		console.log(localStorage.obj);								
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
