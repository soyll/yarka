<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
	
	<h2>Лучшие ноутбуки для работы по цене и качеству в 20XX году</h2>

	<script>
		// инициируем двумерный массив
		let note = [
			["Acer", "14'", "1920x1080", "Swift 3"],
			["Asus", "16'", "3840х2400", "VivoBook Pro"],
			["HUAWEI", "15.6'", "1920x1080", "MagicBook"],
			["Apple", "13.3'", "2560x1600", "MacBook Air"]	
		];
		
		// поиск в двумерном массиве
		console.log(note.includes("Apple")); // false
		console.log(note.indexOf("Apple")); // -1

		// поиск в одномерном массиве
		//console.log(note[3].includes("Apple")); 
		//console.log(note[3].indexOf("Apple")); 
	</script>
