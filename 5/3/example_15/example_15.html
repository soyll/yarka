<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<script>	
		// установим скидку в размере 10% на каждый телевизор 
		results = televisions.map ((item, index, televisions) => { 
			// сделаем срез массива item
			newArr = item.slice(0,);
			// меняем цену для телевизора нового массива
			newArr[6] = item[6] - (item[6] * 0.1);
			// возвращаем новый массив
			return newArr;
		});
			
		// исходный массив
		console.log(televisions);

		// измененный массив
		console.log(results);
	</script>
