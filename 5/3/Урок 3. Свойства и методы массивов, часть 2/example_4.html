<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
	
	<h2>Лучшие ноутбуки для работы по цене и качеству в 20XX году</h2>

	<script>
		// инициируем одномерный массив строк
		let note1 = ["Acer", "Asus", "HUAWEI", "Apple"];

		// проверяем наличие элементов в массиве note1 
		// выполняем Array.indexOf()
		console.log(note1.indexOf("Asus")); // 1
		console.log(note1.indexOf("Apple")); // 3
		console.log(note1.indexOf("Samsung")); // -1

		// инициируем одномерный массив строк
		let note2 = [
			"Acer Extensa 15 EX215-22-R8E3",
			"Asus VivoBook 15 OLED K513EA",
			"HUAWEI MateBook D 15",
			"Apple MacBook Air 13 2022"	
		];

		// проверяем наличие элемента в массиве note2 
		// выполняем Array.indexOf()
		console.log(note2.indexOf("VivoBook")); // -1
	</script>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
