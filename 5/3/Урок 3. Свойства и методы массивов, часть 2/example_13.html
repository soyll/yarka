<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<script>
		// инициируем массив массивов   
		let teams = new Array(
			[1, "Aerosmith", "США", "1970", ["хард-рок", "блюз-рок", "рок-н-ролл", "глэм-метал"]],
			[2, "Pink Floyd", "Великобритания", "1965", ["психоделический-рок", "арт-рок", "эйсид-рок", "прогрессивный-рок"]],
			[3, "The Beatles", "Великобритания", "1960", ["рок", "рок-н-ролл", "поп", "хард-рок"]],
			[4, "AC/DC", "Австралия", "1973", ["хард-рок", "блюз-рок", "рок-н-ролл"]],
			[5, "Scorpions", "ФРГ", "1965", ["хард-рок", "глэм-метал", "хеви-метал"]],
			[6, "Ленинград", "Россия", "1997", ["рок", "ска", "фолк", "панк", "панк-рок"]]
		);
		
		// создадим копию массива, в которой
		// вложенные массивы заменим на вложенные объекты
		res = teams.map ( item => {
			// вернем объект
			return {
			"id" : 10 + item[0],
			"name" : item[1],
			"country" : item[2],
			"year" : item[3],
			// приведем массив третьего уровня к строке
			"style" : item[4].join()
			}
		});
		
		// исходный массив
		console.log(teams);
		
		// результирующий массив
		console.log(res);       
	</script>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
