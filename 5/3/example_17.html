</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<script>
		// одномерный массив для сортировки
		let note = [
			"The Lady of the Lake",
			"451' по Фаренгейту",
			"Москва - Петушки",
			"A Midsummer Night's Dream",
			"Чемодан",
			"1984"
		];

		// исходный массив
		console.log(note);
		
		// сортируем массив
		note.sort();
			
		// отсортированный массив
		console.log(note);		
	</script>
