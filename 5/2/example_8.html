	<script>
		// инициируем строку
		let strTags = " #PHP #JavaScript #CSS #MySQL";

		// разобьем строку в массив 
		arr = strTags.split(" #");

		// отбросим первый элемент из массива
		arrTags = arr.slice(1, );

		// конечный массив выведем в консоль
		console.log (arrTags);
	</script>
