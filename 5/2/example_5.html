<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициируем исходный массив
		var arr = new Array("php", "mysql", "laravel", "javaScript", ["css", "bootstrap"]);
		
		// создаем подмассивы из исходного массива
		let serv = arr.slice(0,3);

		let client = arr.slice(3,);

		// выводим полученные массивы
		console.log ("Изучаем серверные технологии: ", serv); // php, mysql, laravel
		
		console.log ("Изучаем клиентские технологии: ", client); // javaScript, [css, bootstrap]
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
