<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициируем первый массив
		let rus = ["Толстой", "Достоевский", "Набоков", "Чехов"];
		console.log ("Русская литература: ", rus);

		// инициируем второй массив
		let  west = ["Шекспир", "Фолкнер", "Диккенс", "Флобер", "Остин"];
		console.log ("Западная литература: ", west);

		// складываем массивы
		let world = rus.concat(west, "Булгаков");
		console.log ("Мировое литературное наследие: ", world);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<h2>А русская литература мне нравится больше!...</h2>

</body>
</html>
