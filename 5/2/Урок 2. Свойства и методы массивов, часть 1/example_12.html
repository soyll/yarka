<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<h2>После общения с некоторыми людьми у меня появляется ярко выраженный комплекс полноценности</h2>
	
	<script>
		// инициируем двумерный массив	
		let teams = new Array(
			[1, "Aerosmith", "США", "1970", ["хард-рок", "блюз-рок", "рок-н-ролл", "глэм-метал"]],

			[2, "Pink Floyd", "Великобритания", "1965", ["психоделический-рок", "арт-рок", "эйсид-рок", "прогрессивный-рок"]],

			[3, "The Beatles", "Великобритания", "1960", ["рок", "рок-н-ролл", "поп", "хард-рок"]],

			[4, "AC/DC", "Австралия", "1973", ["хард-рок", "блюз-рок", "рок-н-ролл"]],

			[5, "Scorpions", "ФРГ", "1965", ["хард-рок", "глэм-метал", "хеви-метал"]],

			[6, "Ленинград", "Россия", "1997", ["рок", "ска", "фолк", "панк", "панк-рок"]]
		);

		let line = "";
		
		// выполняем перебор элементов массива teams 
		teams.forEach ((item, index, teams) => {
			
			line += `<li>${item[1]}</li>`;
		})
			
		// исходный массив
		console.log(teams);

		// вывод в браузер сформированного списка 
		document.write ("<ul>", line, "</ul>");
	</script>

	<footer align="center">
		<h3>Веб-разработка с профессиональными педагогами</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
