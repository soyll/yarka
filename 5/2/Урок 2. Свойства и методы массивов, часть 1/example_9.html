	<title>Программирование в среде JavaScript</title>

	<script>
		// инициируем строку разделенную символом переноса строки: \n
		let albums = `2; Meddle; 30 октября 1971; EMI, Harvest, Capitol; Vinyl, Кассета, CD; Платиновый (USA), 
3; Obscured by Clouds; 3 июня 1972; EMI, Harvest, Capitol; LP, Кассета, CD; Золотой (USA), Серебряный (GBR),
4; The Dark Side of the Moon; 17 марта 1973; Harvest, Capitol, EMI; LP, Кассета, CD, SACD; Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)`;

		// разобьем строку в массив 
		arr = albums.split("\n");

		// вывод элементов массива
		console.log ("Элемент 0:", arr[0]);
		console.log ("Элемент 1:", arr[1]);
		console.log ("Элемент 2:", arr[2]);
	</script>
