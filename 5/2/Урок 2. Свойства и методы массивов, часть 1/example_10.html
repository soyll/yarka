<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициируем массив
		let tags = new Array("PHP", "JavaScript", "CSS", "MySQL");

		// преобразуем массив к строке
		// 1.
		console.log ("-> ", tags.join(", ")); // PHP, JavaScript, CSS, MySQL 

		// 2.
		console.log ("-> ", tags.join(" ")); // PHP JavaScript CSS MySQL

		// 3.
		console.log ("-> ", tags.join("\n")); // PHP\nJavaScript\nCSS\nMySQL

		// 4.
		let line = "#" + tags.join(" #");
		console.log ("-> ", line) // #PHP #JavaScript #CSS #MySQL
	</script>

</head>
