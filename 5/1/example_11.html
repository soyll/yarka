<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициировали массив альбомов группы Pink Floyd
		var albums = [
			[
				2,
				"Meddle",
				"30 октября 1971",
				"EMI, Harvest, Capitol",
				"Vinyl, кассета, CD",
				"Платиновый (USA)"
			],
			[
				3,
				"Obscured by Clouds",
				"3 июня 1972",
				"EMI, Harvest, Capitol",
				"LP, кассета, CD",
				"Золотой (USA), Серебряный (GBR)"
			],
			[
				4,
				"The Dark Side",
				"17 марта 1973",
				"Harvest, Capitol, EMI",
				"LP, кассета, CD, SACD",
				"Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)"
			]
		];		

		var newAlbum = [
			6,
			"Animals",
			"23 января 1977",
			"Harvest, EMI, Columbia, Capitol",
			"LP, 8-track, кассета, CD",
			"Платиновый (USA), Золотой (GBR), Платиновый (CAN)"
		];

		// выведем исходный массив
		console.log("Исходный массив: ", albums);			

		// добавим в начало массива новый элемент
		albums.unshift([
			1,
			"Atom Heart Mother",
			"10 октября 1970", 
			"EMI, Harvest, Capitol",
			"LP, CD",
			"Золотой (USA)"
		]);
		
		// добавили в массив элемент 
		console.log("Исходный массив + новый элемент: ", albums);	

		// добавим еще один элемент
		albums.unshift(newAlbum);
		
		// удалим первый элемент и сохраним его в переменной
		let el = albums.shift();

		// выведем результирующий массив 
		console.log("Результирующий массив: ", albums);		
		console.log("Удаленный массив: ", el);	
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">

	</footer>
</body>
</html>
