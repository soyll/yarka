<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявляем массив
		// инициализируем массив начальными значениями
		var film = ["Зеленая миля", "Криминальное чтиво", "Форрест Гамп"];	
		
		// обновляем элемент массива
		film[2] = "Общество мертвых поэтов";

		// добавляем элементы в массив
		film[3] = "Бойцовский клуб";
		film[4] = "Умница Уилл Хантинг";
		film[5] = "Побег из Шоушенка";

		// выводим обновленные данные массива
		console.log(film);
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>
