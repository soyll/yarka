	<script>
		// объявляем массив

		// литерал
		var film = ["Зеленая миля", "Криминальное чтиво", "Форрест Гамп"];

		let books = new Array("Чемодан", "Зона", "Соло на IBM")
		
		// выводим данные массивов
		console.log(film);
		console.log(books);
	</script>
