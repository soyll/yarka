<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		let albums = 
		[
			["2; Meddle; 30 октября 1971; EMI, Harvest, Capitol; Vinyl, Кассета, CD; Платиновый (USA)"],
			
			["3; Obscured by Clouds; 3 июня 1972; EMI, Harvest, Capitol; LP, Кассета, CD; Золотой (USA), Серебряный (GBR)"],
			
			["4; The Dark Side of the Moon; 17 марта 1973; Harvest, Capitol, EMI; LP, Кассета, CD, SACD; Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)"]
		];

		// исходный массив albums
		console.log("Исходный массив: ");
		console.log(albums);

		// второй вложенный массив
		console.log("Второй вложенный массив: ");
		console.log(albums[1]);

		// первый элемент второго вложенного массива
		console.log("Первый элемент второго вложенного массива: ");
		console.log(albums[1][0]);  // пример неатомарных данных
	</script>
	
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">

	</footer>
</body>
</html>
