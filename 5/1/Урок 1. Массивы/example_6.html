<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<script>
		let albums = 
		[
			{
				id: 2,
				name: "Meddle",
				date: "30 октября 1971",
				label: "EMI, Harvest, Capitol",
				format: "Vinyl, Кассета, CD",
				status: "Платиновый (USA)"
			},
			{
				id: 3,
				name: "Obscured by Clouds",
				date: "3 июня 1972",
				label: "EMI, Harvest, Capitol",
				format: "LP, Кассета, CD",
				status: "Золотой (USA), Серебряный (GBR)"
			},
			{
				id: 4,
				name: "The Dark Side",
				date: "17 марта 1973",
				label: "Harvest, Capitol, EMI",
				format: "LP, Кассета, CD, SACD",
				status: "Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)"
			}	
		];

		with(albums[1]) {
			document.write(`
				<pre>
				id: ${id},
				Название: ${name},
				Дата выхода: ${date},
				Лейбл: ${label},
				Формат: ${format},
				Статус: ${status}
				</pre>
			`);
		}
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
