<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// массив может хранить значения разного типа
		// 0 – строка
		// 1 – объект
		// 2 – boolean
		// 3 - функция
		// 4 - другой массив
		let arr = [ 'Яблоко', {name: 'Джон'}, true, function() {return('Привет');}, ['PHP', 'JavaScript'] ];
		
		// получить элемент с индексом 1 (объект), 
		// затем показать его свойство
		alert( arr[1].name ); // Джон
		
		// получить элемент с индексом 3 (функция) и выполнить её
		alert(arr[3]()); // Привет 
		
		// получить элемент с индексом 4 (массив) 
		// затем вывести его второй элемент
		alert(arr[4][1]); // JavaScript	
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
