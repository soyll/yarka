<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициировали массив альбомов группы Pink Floyd
		let albums = ["Atom Heart Mother", "Meddle"];
		
		// добавим в конец массива новый элемент
		albums.push("Obscured by Clouds");
		
		// добавим два элемента
		albums.push("The Dark Side of the Moon", "Animals");
		
		// последний элемент удалим и сохраним в переменной
		let el = albums.pop();

		// выведем результат 
		console.log("Массив: ", albums);		
		console.log("Удаленный элемент: ", el);	
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	</footer>
</body>
</html>
