<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// инициируем массив
		let albums = ["Меркурий", "Венера"];
		
		// добавим в начало массива новый элемент
		albums.unshift("Земля");
		
		// добавим в начало еще три элемента
		albums.unshift("Плутон", "Юпитер", "Сатурн");
		
		// первый элемент удалим и сохраним в переменной
		let el = albums.shift();

		// выведем результат 
		console.log("Массив: ", albums);		
		console.log("Удаленный элемент: ", el);	
	</script>

</head>
<body>
	<header>
		<h1 align="center">Массивы и коллекции</h1>
	</header>

	<footer align="center">

	</footer>
</body>
</html>
