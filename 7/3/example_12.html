<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<a id="link" href="target.html">Ссылка на файл target.html</a>
		
	<script>
		// навесим на ссылку событие и его обработчик
		link.onclick = () => {
			// отменим действие по умолчанию (переход по ссылке)	
			event.preventDefault();
			alert("Целевой файл временно недоступен!");
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
