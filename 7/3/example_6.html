<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.elem{
			border:1px solid #c0c0c0;
			padding:15px;
			margin:20px;
		}
	</style>
</head>

<body class="elem">body
	<section class="elem">section
		<div class="elem">div
			<p class="elem">p
				<!-- старт событиям onclick -->
				<button class="elem">Погнали :((</button>			
			</p>
		</div>	
	</section>

	<script>
		// пример неправильного кода
		for(elem of document.querySelectorAll('.elem')){
			// вывод имени тега узла на каждой итерации
			console.log(elem.tagName);
			// каждому элементу коллекции навесим обработчик
			elem.addEventListener ("click", () => alert(elem.tagName));
		}
		
		// обратите внимание на содержание elem в последней итерации (BUTTON)
		console.log("----------");
		console.log(elem); 
	</script>
	
</body>
</html>
