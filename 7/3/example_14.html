<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
    <p>Пожалуйста, введите логин, используя буквы нижнего регистра латиницы:</p>
    <form>
        <input type="text" id="login">
    </form>	
	
    <script>
		// навесим на текстовое поле событие  и его обработчик
		login.addEventListener("keypress", checkInput);

		function checkInput(e) {
			// получим код введенного символа
			var chrCode = e.charCode;

			if (chrCode < 97 || chrCode > 122) {
				// отменим действие по умолчанию (ввод символа)
				e.preventDefault();
				// выведем предупреждение пользователю
				alert("Используйте буквы нижнего регистра латиницы");
				// служебное сообщение
				console.log("Недопустимый символ: " + chrCode);
			}
		}
	</script>
  
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
