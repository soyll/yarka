<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.elem{
			border:1px solid #c0c0c0;
			padding:15px;
			margin:20px;
		}
	</style>
</head>

<body class="elem">body
	<section class="elem">section
		<div class="elem">div
			<p class="elem">p
				<!-- старт событиям onclick -->
				<button class="elem">Погнали ;)</button>			
			</p>
		</div>	
	</section>

	<script>
		// обратите внимание на let в объявлении elem
		for(let elem of document.querySelectorAll('.elem')){
			// вывод имени тега узла на каждой итерации
			console.log(elem.tagName);
			// каждому элементу коллекции навесим обработчик
			// в качестве обработчика - объект с методом handleEvent 
			elem.addEventListener ("click", {handleEvent:userClick, el:elem});
		}	
		
		function userClick(){
			alert(this.el.tagName)
		}	
	</script>
	
</body>
</html>
