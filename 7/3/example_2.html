<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<input class="testEvent" type="button" value="Узнай 10 принципов успеха!">

	<p><a class="testEvent" href="#">Нажми и забирай приз!</a></p>

	<p class="testEvent">Просто сделай это...</p>

	<div class="testEvent">Жми. Невозможного не существует!</div>

	<p><button class="testEvent">Хотите, я вам на рояле поиграю?</button></p>

	<script>
		// коллекция элементов .testEvent
		elems = document.getElementsByClassName("testEvent");

		// назначим событие каждому элементу коллекции
		for(el of elems) {
			el.onclick = function() {
				// вывод тип события
				alert("Тип события: " + event.type + " на элементе: " + event.target);
				
				// вывод названия и координат элемента коллекции
				console.log("Элемент: " + event.target.tagName);
				console.log("Координаты: " + event.clientX + ":" + event.clientY);
				console.log("----------");
			}
		};
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
