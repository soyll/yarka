<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
    <form>
      Сделайте одолжение, кликните по флажку:
	  <input type="checkbox" id="chk" />
    </form>	
	
    <script>
		function stopClick(e) {
			// отменим действие по умолчанию (изменение состояния флажка)
			e.preventDefault();
			alert("Нечего тут... Дома у себя будете кликать!");
		}

		// навесим на флажок событие и его обработчик
		document
			.getElementById("chk")
			.addEventListener("click", stopClick, false);
    </script>
 
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
