<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.elem{
			border:1px solid #c0c0c0;
			padding:15px;
			margin:20px;
		}
	</style>
</head>

<body class="elem">body
	<section class="elem">section
		<div class="elem">div
			<p class="elem">p
				<!-- старт событиям onclick -->
				<button class="elem">Погнали...</button>			
			</p>
		</div>	
	</section>

	<script>
		// регистрируем обработчик на click по body 
		document.body.onclick = function handlerClick(){
			alert(event.target.tagName); // целевой элемент
			alert(this.tagName); // всегда body
			console.log(event.currentTarget.tagName); // всегда body
		}		
	</script>
	
</body>
</html>
