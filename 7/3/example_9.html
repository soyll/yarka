<!doctype html>
<html lang="ru" onclick="alert(this.tagName)">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.elem{
			border:1px solid #c0c0c0;
			padding:15px;
			margin:20px;
		}
	</style>	
</head>

<body class="elem" onclick="alert(this.tagName)">body
	<section class="elem" onclick="alert(this.tagName); event.stopPropagation();">section
		<div class="elem" onclick="alert(this.tagName)">div
			<p class="elem" onclick="alert(this.tagName)">p
				<!-- старт событиям onclick -->
				<button class="elem" onclick="outMessage()">Погнали (чуть-чуть)</button>			
			</p>
		</div>	
	</section>

	<script>
		function outMessage() {
			alert ("Ой... Здравствуйте!");
			// event.stopPropagation();
		}
	</script>
		
</body>
</html>
