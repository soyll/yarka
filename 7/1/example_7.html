 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- ! для навешивания события используем свойство DOM-объекта -->

	<button class="btn">Нажмите, пожалуйста</button><p>
	
	<button class="btn">И здесь тоже...</button>
		
	<script>
		// получим коллекцию элементов button
		let buttons = document.body.getElementsByClassName("btn");
		
		// используем анонимную и стрелочную функции
		// навесим на элементы button обработчик события onclick
		buttons[0].onclick = function() {
			alert ("И снова здравствуйте!");
		}

		buttons[1].onclick = () => {
			alert ("Вы мне надоели!");
		};
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
