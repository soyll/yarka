<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- будьте внимательны -->
	Инлайн обработчик: <button onclick="alert(this)">Нажмите, пожалуйста</button><p>

	<!-- будьте внимательны -->
	Функция (инструкция) как HTML-атрибут: <button onclick="fun_1()">Нажмите, пожалуйста</button><p>

	<!-- будьте внимательны -->
	Функция (стрелка) как HTML-атрибут: <button onclick="fun_2()">Нажмите, пожалуйста</button><p>		

	<!-- будьте внимательны -->
	Функция как свойство: <button id="btn1">Нажмите, пожалуйста</button><p>	

	<!-- будьте внимательны -->
	Функция через addEventListener: <button id="btn2">Нажмите, пожалуйста</button><p>	

	<script>
		// функция инструкция
		function fun_1 () {
			alert (this);
		}
		
		// функция стрелка
		fun_2 = () => {
			alert (this);
		}
		
		// функция-стрелка для свойства 
		btn1.onclick = () => {
			alert (this);
		}
		
		// функция через addEventListener
		btn2.addEventListener("click", () => {
			alert (this);
		})
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
