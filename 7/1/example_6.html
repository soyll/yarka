 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- ! для навешивания события используем свойство DOM-объекта -->
	
	<button id="btn">Нажмите, пожалуйста</button>
	
	<script>
		// определим функцию
		function fnNewProperty() {
			alert ("Функция - это тоже свойство DOM-объекта!");
		}

		// функция по умолчанию возвращает - undefined
		// console.log(fnNewProperty()); // undefined
		
		/*
			такой способ неверный: 
			-> btn.onclick = fnNewProperty();
			получим:
			1. fnNewProperty(); - немедленный вызов alert(...)
			2. btn.onclick = undefined;
		*/
		
		// выводим в консоль определение функции 
		console.log(fnNewProperty);

		// навесим обработчику onclick определение функции 
		btn.onclick = fnNewProperty;
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
