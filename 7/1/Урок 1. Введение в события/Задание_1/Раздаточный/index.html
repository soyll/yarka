<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<button onclick="alert(this.login)">Нажмите, пожалуйста</button><p>

	<button onclick="obj.mtd1('master')">Нажмите, пожалуйста</button><p>

	<button onclick="obj.mtd2('master')">Нажмите, пожалуйста</button><p>
	
	<script>
		// глобальная переменная login
		login = "user";
		
		// объект
		let obj = {
			login: "superAdmin",

			mtd1: function (login) {
				var login = "no-name";
				alert (this.login); // ?
			},

			mtd2: (login) => {
				login = "no-name";
				alert (this.login); // ?
			}	
		}
	</script>

    </footer>
