<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>

<!-- событие документа -->
<body  onload="alert('DOM загружен!')">
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- ! для навешивания события используем атрибут HTML -->

	<!-- событие мыши -->
	<input value="Нажми меня нежно" onclick="let name='Max'; alert('Hello, ' + name + '!')" type="button"><p>

	<!-- клавиатурное событие -->
	<input 
		id="inp" 
		type="text"
		onkeyup="document.getElementById('console').innerText=document.getElementById('inp').value"
		placeholder="Введите текст"
	>
	<div id="console"></div><p>

	<!-- событие на элементе управления -->
	<form onsubmit="alert('Сейчас будет перезагрузка страницы!')">
		<button>Отправить форму</button>
	</form>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
