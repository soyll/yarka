 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- ! для навешивания события используем свойство DOM-объекта -->
	
	<button id="btn1">Нажмите, пожалуйста</button><p>

	<button id="btn2">Нажмите, пожалуйста</button><p>

	<button id="btn3">Нажмите, пожалуйста</button>
	
	<script>
		let btn1 = document.getElementById("btn1");
		
		// навеcим обработчики события onclick на элементы button
		btn1.onclick = function() {
			alert ("Здравствуй ТоварищЪ!");
		}

		// прямой доступ по id элемента (не рекомендуется)
		btn2.onclick = function fnHandlerClick() {
			alert ("Как поживаете??");
		}
		
		btn3.onclick = () => alert("Ну может хватит уже кликать без дела?")
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
