<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<script>
		// повесим на document обработчик пользовательского события
		document.addEventListener("myevent", function() {
			alert(this); // document
		});		
		
		// создадим событие
		let myevent = new CustomEvent("myevent");
		
		// вызов события
		document.dispatchEvent(myevent);	
	</script>

    </footer>	
</body>
