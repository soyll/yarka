<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>

	<h1 id="elemH" data-login="DatasetLogin" data-pwd="DatasetPwd" data-email="dataset-email@mail.ru">Привет всем!</h1>

	<script>
		// назначаем элементу h1#elemH пользовательское событие и обработчик
		elemH.addEventListener("getdata", function(e) {
			// вывод в браузер 
			document.write (
				`
					Контекст <b>${this}</b><br>
					<b>Свойства элемента H1:</b><br>
					Логин: ${this.dataset.login}<br>
					Пароль: ${this.dataset.pwd}<br>
					e-mail: ${this.dataset.email}<br>
					---------- <p>
					<b>Свойства пользовательского события:</b><br>
					Логин: ${e.detail.login}<br>
					Пароль: ${e.detail.pwd}<br>
					e-mail: ${e.detail.email}<br>
				`
			);
		});		

		// инициируем пользовательское событие на элементе h1#elemH
		elemH.dispatchEvent(new CustomEvent("getdata", {
			detail: { 
				// пытаемся взять свойства из контекста h1#elemH,
				// но так работать не будет !
				login: this.dataset.login,
				pwd:  this.elemH.dataset.pwd,
				email:  this.dataset.email
			}
		}));
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
