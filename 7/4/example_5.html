<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>
	
	<!-- элемент скрыт -->
	<div id="myDiv" hidden></div>

	<script>
		// повесим на скрытый div обработчик пользовательского события
		// дополнительная информация приходит в обработчик вместе с событием
		myDiv.addEventListener("myevent", function(e) {
			alert(this); // div
			// дополнительная информация пользовательского события
			alert(e.detail.msg);
			// объект пользовательского события
			console.log(e);
		});		
		
		// создадим объект пользовательского события
		// объект содержит дополнительное свойство detail
		let myevent = new CustomEvent("myevent", {detail:{msg:"Инициируем событие на элементе div" }});
		
		// вызов события
		myDiv.dispatchEvent(myevent);
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
