<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>

	<div id="codecs"></div>

	<script>
		// извлекаем JSON-объект из localStorage
		let json = window.localStorage.getItem("json");
		// парсим JSON в JS-объект
		arr = JSON.parse(json);
		
		document.write('<ol>');
		
		// вывод в браузер списка
		arr.forEach( elem => {
			document.write(`
				<li>${elem}</li>
			`)
		})
		
		document.write('</ol>');
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
