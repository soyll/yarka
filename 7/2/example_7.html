<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>События и обработка событий</h1>
	</header>

	<!-- контейнер для вставки контента -->
	<select id="albums">

	</select>

	<script>
		albums = [
			[1, "Atom Heart Mother", "10 октября 1970", "EMI, Harvest, Capitol", "LP, CD", "Золотой (USA)"], 
			[2, "Meddle", "30 октября 1971", "EMI, Harvest, Capitol", "Vinyl, кассета, CD", "Платиновый (USA)"], 
			[3, "Obscured by Clouds", "3 июня 1972", "EMI, Harvest, Capitol", "LP, кассета, CD", "Золотой (USA), Серебряный (GBR)"], 
			[4, "The Dark Side of the Moon", "17 марта 1973", "Harvest, Capitol, EMI", "LP, кассета, CD, SACD", "Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)"], 
			[5, "Wish You Were Here", "15 сентября 1975", "Harvest, EMI, Columbia, Capitol", "LP, 8-track, кассета, CD, SACD", "Платиновый (USA), Золотой (GBR), Платиновый (CAN)"], 
			[6, "Animals", "23 января 1977", "Harvest, EMI Columbia, Capitol", "LP, 8-track, кассета, CD", "Платиновый (USA), Золотой (GBR), Платиновый (CAN)"], 
			[7, "The Wall", "30 ноября 1979", "Harvest, EMI, Columbia, Capitol", "LP, 8-track, кассета, CD", "Платиновый (USA), Платиновый (GBR), Бриллиантовый (CAN)"], 
			[8, "The Final Cut", "21 марта 1983", "Harvest, EMI, Columbia, Capitol", "LP, 8-track, кассета, CD", "Платиновый (USA), Золотой (GBR)"], 
			[9, "A Momentary Lapse of Reason", "8 сентября 1987", "EMI, Columbia", "LP, кассета, CD", "Платиновый (USA), Золотой (GBR), Платиновый (CAN)"], 
			[10, "The Division Bell", "30 марта 1994", "EMI, Columbia", "LP, кассета, CD", "Платиновый (USA), Платиновый (GBR), Платиновый (CAN)"]
		];	
		
		// загрузке DOM назначаем функцию-обработчик loadData
		// функции привязываем массив данных
		document.addEventListener("DOMContentLoaded", loadData.bind(null, albums));		
		
		// определение функции-обработчика
		function loadData(arr) {
			// перебираем элементы массива
			arr.forEach( elem => {
				console.log(document.getElementById("albums"));
				document.getElementById("albums").insertAdjacentHTML("beforeend", '<option>' + elem[1] + '</option>');
			} )
		}		
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
