<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
		
	<script>
		// получаем данные пользователя
		let questions = JSON.parse(window.localStorage.getItem('questions'));

		// выводим данные пользователя в браузер
		for (key in questions) {
			document.write (key, ' = ', questions[key], '<br>');
		}
	</script>
    
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
