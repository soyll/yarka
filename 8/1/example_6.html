<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<button id="btn">Показать свойства объекта Screen</button><p>
		
	<div id="con"></div>
	
	<script>
		btn.addEventListener("click", ()=>{
			str = `
				availLeft:  ${screen.availLeft} <br>
				availTop: ${screen.availTop} <br>
				availHeight: ${screen.availHeight} <br>
				availWidth: ${screen.availWidth} <br>
				colorDepth: ${screen.colorDepth} <br>
				height: ${screen.height} <br>
				orientation: ${screen.orientation} <br> <!--объект ScreenOrientation-->
				pixelDepth: ${screen.pixelDepth} <br>
				width: ${screen.width} 
			`;
		
			// объект Screen
			console.log(window.screen);

			// объект ScreenOrientation
			console.log(screen.orientation);

			document.getElementById('con').innerHTML = str;
		});

	</script>
	
    <footer align="center">
        <h3>Образование | Веб-технологии | Программирование</h3>
    	<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
