<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<script>
		// стандартный метод и стандартное действие
		window.alert("Привет мир!");

		// переопределим стандартный метод
		var alert = function(message){
		     document.write ("<h1>", message, "</h1>");
		};
		
		// стандартный метод и нестандартное действие
		window.alert("Привет мир!");
	</script>
	
    <footer align="center">
        <h3>Образование | Веб-технологии | Программирование</h3>
    	<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
