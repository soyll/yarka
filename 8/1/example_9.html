<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<h3>Этот контент не для слабонервных ...</h3>
	<div style="display:none" id="block">
		<h2>Все, кого ты любил, или бросят тебя или умрут. Все, что ты создал, будет забыто. Все, чем ты гордился, будет со временем выброшено на помойку (Чак Паланик).</h2>
	</div>
		
	<button id="btn">Все равно показать</button>
		
	<script>
		const btn = document.getElementById("btn");
		
		btn.addEventListener("click", ()=>{
			
			if (confirm("Вы уверены?")) {
				
				document.getElementById('block').style.display = 'block';
				event.target.style.display = 'none';
			}
		});
	</script>

    <footer align="center">
        <h3>Образование | Веб-технологии | Программирование</h3>
    	<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
