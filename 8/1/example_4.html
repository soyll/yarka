<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<div>
		<h2>«Дело не в том, что у нас мало времени, а в том, что мы тратим его впустую». — Сенека</h2>
		... и тем не менее: <b><span id="timer"></span></b>
	</div>

	<script>
		let timer = document.getElementById("timer");
		let i=0;

		const intervalId = setInterval(function() {
					  
			timer.innerText = i;
			if (i==10) {
				if(confirm('Прекратить тратить время впустую?')) clearInterval(intervalId);
			}
			console.log('Время утекает каждую секунду -> ' + i++)
		}, 1000)
	</script>
	
    <footer align="center">
        <h3>Образование | Веб-технологии | Программирование</h3>
    		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
