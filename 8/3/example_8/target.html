<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	<h2>Извлекаем параметры строки запроса</h2>
		
	<script>
		// извлекаем строку запроса
		raw_search = location.search;

		// удаляем символ ?
		search = raw_search.substr(1); 

		// извлекаем параметры строки запроса
		[topic, lesson, section] = search.split("&");
		
		// выводим параметры в браузер 
		document.write(topic, '<br>');
		document.write(lesson, '<br>');
		document.write(section, '<br>');
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
