<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="courses.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<script>
		// начальное значение переменной
		menu = '';
		// в цикле формируем меню
		courses.forEach( course => {
			menu += `
				<a href="target.php?topic=${course.topic}">
					${course.topic}
				</a><br>
			`;
		} );

		// вывод меню в браузер
		document.write('<div id="menu">' + menu + '</div><hr>')
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
