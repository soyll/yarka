<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="courses.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
		
	<script>
		// начальное значение переменной
		let menu = '';

		// во внешнем цикле формируем меню первого уровня
		for(course of courses) {
			menu += `
				<li id="topic-${course.id}">
					<a href="#">Тема: <span class="topic">${course.topic}</span></a>
				`;
			
			// во вложенном цикле формируем меню второго уровня
			submenu = '';	
			for (lesson of course.lesson) {
				submenu += `<li><a href="#"">Урок: <span class="lesson">${lesson}</span></a></li>`;
			}

			menu += `<ul>${submenu}</ul></li>`;		
		} 

		// вывод меню в браузер
		document.write('<ol>' + menu + '</ol>');

		// выбор пунктов меню
		lis = document.querySelectorAll("ol > li");

		for (let li of lis) {
			// навешиваем обработчик события click
			li.addEventListener("click", function() {			
				let topic = li.querySelector(".topic").innerText;

				// если клик по меню первого уровня
				if (event.target.className == "topic"){
					link = `topic=${topic}`;	
				}

				// если клик по меню второго уровня
				if (event.target.className == "lesson"){

					lesson = event.target.innerText;

					link = `topic=${topic}&lesson=${lesson}`;
				}			

				// выполняем переход на ресурс target.php
				location.href = "target.php?" + link;	
			})
		}
	</script>	
		
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
