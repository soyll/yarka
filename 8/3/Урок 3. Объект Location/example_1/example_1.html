<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	<h2>Тестируем свойства объекта Location</h2>

	<a href="http://js/example_1.html?course=javascript&topic=bom&lesson=location#encode-search">
		Переход на страницу с передачей дополнительных параметров
	</a>
	<hr>
	
	<script>
		// важные свойства объекта location
		document.write ("protocol: ", location.protocol, "<br>");
		document.write ("host: ", location.host, "<br>");
		document.write ("origin: ", location.origin, "<br>");		
		document.write ("hostname: ", location.hostname, "<br>");		
		document.write ("href: ", location.href, "<br>");
		document.write ("pathname: ", location.pathname, "<br>");
		document.write ("search: ", location.search, "<br>");
		document.write ("hash: ", location.hash, "<br>");
	</script>	
		
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
