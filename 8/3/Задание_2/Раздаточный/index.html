<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="menu.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<script>
		// строка навигационного меню
		nav = '';

		// формируем меню
		menu.forEach( item => {
			nav += `<li><a href="#" data-page="${item.page}">${item.title}</a>`;

			submenu = ''
			
			// если существует подменю
			if (item.submenu) {
				
				for(itemsub of item.submenu) {
					submenu += `<li><a href="#" data-page="${item.page}" data-subpage="${itemsub.page}">${itemsub.title}</a></li>`
				}

				submenu = '<ul>' + submenu + '</ul>';		
			}

			nav += submenu + '</li>';
		} )

		// вывод меню в браузер
		document.write('<ul>' + nav + '</ul>');

		// ...

	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
