<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="articles.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<div id="menu"><hr></div>

	<div id="content" style="width:75%; margin:0 auto"></div> 

	<script>
		// начальная инициализация переменных
		let menu = ''; 
		let content = ''; 
		
		for (article of articles) {
			// контент меню
			menu += `
				<a href="#article-${article.id}">${article.title}</a><br>
			`;

			// контент страницы
			content += `
				<div id="article-${article.id}">
					<h2>${article.title}</h2>
					${article.content}
					<img src="images/${article.img}" width="500px">
				</div>
			`
		}	

		// вставляем контент в браузер
		document.getElementById("menu").insertAdjacentHTML("afterbegin", menu);
		document.getElementById("content").innerHTML = content;
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
