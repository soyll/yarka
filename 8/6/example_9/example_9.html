<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<!-- форма выбора файла -->
	<form id="frm-file">
		<input id="file" type="file" name="file">		
	</form><p>

	<!-- форма для отправки на сервер -->
	<form id="frm-data" onsubmit="return fnSubmit()">
		Логин:<input type="text" name="login" value="DenisDream"><p>
		E-mail:<input type="text" name="email" value="denis-dream@gmail.com"><p>				
		Пароль:<input type="text" name="pwd" value="qwerty@"><p>

		<input type="submit" value="Отправить">
	</form>

	<script>
		// обработчик отправки формы
		function fnSubmit() {
			// создаем объект FormData
			let form = document.getElementById('frm-data');
			let data = new FormData(form);

			// получаем ссылку на элемент выбора файла
			let file = document.getElementById('file');

			// добавляем к объекту файл
			data.append('file', file.files[0]);

			// вывод содержимого объекта
			for(let [key, val] of data.entries()){
				console.log(key, '->', val);	
			}
			
			return false;
		}	
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
