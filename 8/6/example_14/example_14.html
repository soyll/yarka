<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">			
		<span>Логин:</span>
		<input type="text" name="login" value="DenisDream"><p>
		<span>E-mail:</span>
		<input type="text" name="email" value="denis-dream@gmail.com"><p>				
		<span>Пароль:</span>
		<input type="text" name="pwd" value="qwerty@"></span><p>
	</form>
	
	<a id="link" href="target.html" onclick="fnSubmit()">Переход</a>

	<script>
		// обработчик клика по ссылке
		function fnSubmit() {
			let data = new FormData(document.getElementById("frm"));

			let params = new URLSearchParams();

			for ([key, val] of data.entries()) {
				params.append(key, val);
			}

			// добавим к ссылке параметры
			let link = document.getElementById("link");
			let href = link.getAttribute("href");
			let new_href = href + "?" + params.toString();
			link.setAttribute("href", new_href);			
		}
	</script>
    
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
