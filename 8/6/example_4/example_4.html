<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">
		Логин: <input type="text" name="login" value="DenisDream"><p>
		E-mail: <input type="email" name="email" value="denis-dream@gmail.com"><p>
		Пароль: <input type="password" name="pwd" value="qwerty@"><p>
		<label for="file"><img src="file.jpg" width="150px"></label>
		
		<input id="file" type="file" name="file" hidden>		
	</form>

	<span id="fileName">Файл не выбран</span>

	<script>
		// обрабатываем событие выбор файла
		document.getElementById('file').onchange = function() {
  			// создаем объект FormData 		
  			data = new FormData (document.getElementById('frm'));

  			// перебираем параметры объекта
  			for (let [key, val] of data.entries()) {
  				
  				// если значение параметра - строка
  				if(typeof val === 'string') {
  				
  					console.log(key + ' -> ' + val);
  				}  					
  				// если значение параметра - объект File
  				else 
  					console.log(key + ' -> ' + val.name);
  				}
  
  			// дабавляем название выбранного файла
			let span = document.getElementById('fileName'); 
			span.innerText = data.get("file").name;
		};			
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
