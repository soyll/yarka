<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">			
		<span>Логин:</span>
		<input type="text" name="login" value="DenisDream"><p>
		<span>E-mail:</span>
		<input type="text" name="email" value="denis-dream@gmail.com"><p>				
		<span>Пароль:</span>
		<input type="text" name="pwd" value="qwerty@"></span><p>
	</form>
	
	<a href="target.html" onclick="fnSubmit()">Отправить данные</a>

	<script>
		// обработчик клика по ссылке
		function fnSubmit() {
			// создаем объект FormData
			let form = document.getElementById('frm');
			let data = new FormData(form);
			
			// преобразуем к массиву и сериализуем данные
			dataJSON = JSON.stringify(Array.from(data));	 

			// сохраним данные в localStorage 
			localStorage.setItem("data", dataJSON);				
		}
	</script>		

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
