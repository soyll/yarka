<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
		
	<script>
		// создаем из адресной строки параметров объект
		let params = new URLSearchParams(location.search);

		// сохраняем содержимое параметра data
		data_json = params.get("data");

		data = JSON.parse(data_json);

		// вывод данных формы
		document.write ('login = ', data.login, '<br>');
		document.write ('email = ', data.email, '<br>');
		document.write ('pwd = ', data.pwd, '<br>');
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
