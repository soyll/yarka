<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<!-- форма ввода данных -->
	<form id="frm-auth">			
		<span>Логин:</span>
		<input type="text" name="login" value="DenisDream"><p>
		<span>E-mail:</span>
		<input type="text" name="email" value="denis-dream@gmail.com"><p>				
		<span>Пароль:</span>
		<input type="text" name="pwd" value="qwerty@"></span><p>
	</form>

	<!-- форма отправки данных на сервер -->
	<form id="frm-data" action="target.html" method="GEt" onsubmit="return fnSubmit()">
		<!--
			скрытое поле, данные этого поля отправятся в файл обработчик
			для наглядности поле не имеет атрибут type='hidden'
		-->
		<input type="text" name="data" value=""><p>
		<input type="submit" value="Отправить">
	</form>

	<script>
		// обработчик отправки формы
		function fnSubmit() {
			let form = document.getElementById('frm-auth');

			let data = new FormData(form);

			// формирование JSON 
			let data_json = JSON.stringify({
			 	login: data.get("login"),
			 	email: data.get("email"),
			 	pwd: data.get("pwd")
			});
			// вставка данных в скрытое поле
			document.getElementById("frm-data").elements["data"].value = data_json;

			// console.log(data_json);

			return true;
		}	
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
