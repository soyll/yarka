<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">			
		<span>Логин:</span>
		<input type="text" name="login" oninput="data.login=this.value"><p>
		<span>E-mail:</span>
		<input type="text" name="email" oninput="data.email=this.value"><p>				
		<span>Пароль:</span>
		<input type="text" name="pwd" oninput="data.pwd=this.value"></span><p>
	</form>
	
	<a id="link" href="#">Отправить данные</a>

	<script>
		// инициируем объект сбора пользовательских данных
		let data = {};
		
		// навешиваем событие на ссылку
		document.getElementById("link").addEventListener("click", e => {
			// формируем строку параметров
			search = `login=${data.login}&email=${data.email}&pwd=${data.pwd}`;
			
			// создаем атрибут href для ссылки
			e.target.setAttribute("href", "target.html?" + search);		
		});			
	</script>
    
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
