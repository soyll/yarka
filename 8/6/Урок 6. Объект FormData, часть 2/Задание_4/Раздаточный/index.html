<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		form#frm-file span {cursor: pointer}
	</style>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<!-- форма выбора файла -->
	<a href='#' onclick='addFile()'>Добавить файл</a><p>
	<form id="frm-file">
		<div class='file'>
			<input id="file" type="file" name="file">
		</div>	
	</form><p>

	<!-- форма для отправки на сервер -->
	<form id="frm-data">
		Логин:<input type="text" name="login" value="DenisDream"><p>
		E-mail:<input type="text" name="email" value="denis-dream@gmail.com"><p>				
		Пароль:<input type="text" name="pwd" value="qwerty@"><p>

		<input type="submit" value="Отправить">
	</form>

	<script>
		// функция добавления элемента выбора файла
		function addFile() {
			let node = document.querySelector('div.file');
			let clone = node.cloneNode(true);
			html = '<p>' + clone.innerHTML + '<span onclick="delFile(event)">&minus;</span></p>';
			node.insertAdjacentHTML('afterend', html); 
		}	

		// функция удаления элемента выбора файла
		function delFile(e) {
			e.target.closest('p').remove();
		}

		// ...
		
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
