<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<script>
		// извлекаем из cookie строку формата JSON
		let [, val] = document.cookie.split('='); 

		// преобразуем JSON в JS-объект
		let character = JSON.parse(val);  

		// перебираем свойства объекта
		for (let key in character) {
			// если свойство - изображение
			if(key == "images")
				// вывод изображения
				document.write(`<img src="images/${character[key]}" width=300px>`);
			else
				// вывод текстовых данных
				document.write(key, ' -> ', character[key], '<p>')
		}
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
