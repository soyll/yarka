	<script>
		// проверяем cookie сайта на пустоту
		if (document.cookie == '') {

			document.write('<h3>Cookie citate не существует или успешно удалена! (... а жаль)</h3>');
		} else {
			// вывод в браузер cookie
			// document.write('<h3>', decodeURIComponent(document.cookie), '</h3>');
			document.write('<h2>', document.cookie, '</h2>');
		}
	</script>
