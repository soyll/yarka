<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<script>
		// запись в cookie
		document.cookie = "login=DenisDream";
		// проверка содержимого cookie
		document.write(document.cookie, '<p>'); // login=DenisDream
		
		// еще одна запись в cookie
		document.cookie = "pwd=qwerty@";	
		// проверка содержимого cookie
		// старое значение никуда не делось 
		document.write(document.cookie, '<p>'); // login=DenisDream; pwd=qwerty@
		
		// и еще одна запись в cookie
		document.cookie = "email=denis-dream@gmail.com";	
		document.write(document.cookie, '<p>'); // login=DenisDream; pwd=qwerty@; email=denis-dream@gmail.com		
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
