<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<script>
		// выведем данные cookie сайта в виде строки
		document.write(document.cookie, '<p>');

		// разобъем строку по парам параметр=значение
		let cookies = document.cookie.split('; ');

		document.write('<h3>Вывод содержимого document.cookie в цикле</h3>')

		// выведем данные cookie в цикле
		for (let cookie of cookies) {
			// сохраним пару параметр=значение в соответствующие переменные
			let [key, val] = cookie.split('=');
			document.write(key, ' -> ', val, '<p>');
		}
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
