<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="function.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<script>
		// установка cookie
		setCookie('login', 'SuperAdmin');
		setCookie('email', 'pechora_pro@gmail.com', 2);	

		// вывод cookie
		let cookies = document.cookie.split('; ');

		for (cookie of cookies) {
			[key, val] = cookie.split('=');
			document.write(key, ' -> ', val, '<p>');
		}				
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
