<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<script>
		// значение переменной citate содержит символ: ; 
		let citate = '“Не смотри на часы; делай то, что они делают. Продолжай идти”. – Сэм Левенсон';
		
		// кодируем строку перед записью в cookie
		citate = encodeURIComponent(citate);
		document.cookie = `citate=${citate}`;

		// анализируем вывод
		document.write('<h2>', decodeURIComponent(document.cookie), '</h2>');
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
