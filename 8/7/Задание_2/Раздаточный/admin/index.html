<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<a href="/">Главная</a> | 	
	<a href="/page.html">Добро пожаловать</a> |
	<a href="/moderator/">Модератор</a> |
	<a href="/admin/">Администратор</a><p>

	<script>	
		let user = {};
		
		let cookies = document.cookie.split('; ');
		for (let cookie of cookies) {
			let [key, val] = cookie.split('=');
			user[key] = val;
		};

		if (user.role == 'Администратор') {
			document.write('<h2>Администратор</h2>');
			document.write('<p>Этот контент для Администратора сайта</p>');
			document.write(`<p>Ваш логин: ${user.login}</p>`);
		}
		else {
			document.write('<h3>Просмотр страницы ограничен системой разрешений сайта</h3>');
		}
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
