<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="users.js"></script>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<a href="/">Главная</a> | 	
	<a href="/page.html">Добро пожаловать</a> |
	<a href="/moderator/">Модератор</a> |
	<a href="/admin/">Администратор</a><p>

	<h2>Главная страница</h2>	
		
	<script>
		let user = {};
		
		let cookies = document.cookie.split('; ');
		for (let cookie of cookies) {
			let [key, val] = cookie.split('=');
			user[key] = val;
		};

		if (user.role == 'Администратор' || user.role == 'Модератор')
			document.write(`<p>Вы зашли как ${user.role} сайта</p>`);
		else 
			document.write('<p>Для работы в системе требуется аутентификация</p>');
	</script>

	<form id="frm-auth" onsubmit="return fnAuth()">
		<input type="text" name="login" value=""><p>
		<input type="text" name="pwd" value=""><p>

		<button>Регистрация</button>	
	</form>
	
	<script>	
		function fnAuth() {
			let data = new FormData(document.getElementById("frm-auth"));

			if (
				data.get('login') == '' ||
				data.get('pwd') == ''
			) {
				alert("Введите данные!");
			} else {
				for (user of users) {
					if (
						user.login == data.get('login') &&
						user.pwd == data.get('pwd')
					) {
						alert("Спасибо за регистрацию!");

						document.cookie = `login=${user.login}; path=/`;
						document.cookie = `pwd=${user.pwd}; path=/`;
						document.cookie = `role=${user.role}; path=/`;						

						window.location.href = '/page.html';					
					} 
				}
				alert("Пользователь с такими данными не найден");
			}
			return false;
		}
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
