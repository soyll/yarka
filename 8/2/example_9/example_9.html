<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<!-- блок для вставки контента -->
	<div id="main"></div>

	<script>
		// сохраняем ссылку на всплывающее окно
  		let mywin = window.open('target.html','popUp','left=400,top=200,width=300,height=250');
    	
    	// в всплывающее окно записываем кнопку
    	mywin.document.write('<button id="btn">Сделай клик</button>');
    
    	// получаем ссылку на кнопку всплывающего окна
    	let btn = mywin.document.querySelector('#btn');
    	
    	// навешиваем на кнопку событие click
    	btn.addEventListener('click', () => {
			// из ссылки на всплывающее окно получаем доступ к родительскому
			mywin.opener.document.getElementById("main").innerHTML = '<h1>Привет, из всплывающего окна!</h1>';
    	})
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
