<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="guitars.js"></script>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<!-- блок для вставки контента -->
	<div id="main"></div>

	<button onclick="openWin()">Открыть список</button>
	
	<script>		
		// функция запуска событий страницы
		function openWin () {
			
			let out = "";

			// формируем контент для всплывающего окна
			guitars.forEach( (item) => {
				out += `
					<h4><a class="guit" id="${item.id}" href="#">${item.name}</h4>
					<img src="images/${item.image}" width=100px>
				`
			});

			// сохраняем ссылку на всплывающее окно
			var mywin = window.open("target.html","pupUp","width=600,height=700");	
		
			// создаем событие загрузки всплывающего окна
			mywin.onload = function () {

				// загружаем контент в всплывающее окно
				mywin.document.getElementById("target").innerHTML = out;	

				// получаем коллекцию ссылок всплывающего окна
				links = mywin.document.querySelectorAll("a.guit");

				// перебираем коллекцию, навешиваем на каждую ссылку событие click
				for(let link of links) {
					link.addEventListener("click", function() {
						
						let out = "";
			
						// выполняем поиск гитары, по которой кликнули
						guitar = guitars.find( (item) => {
							return this.id == item.id;
						});

						// формируем контент
						out = `
							<h2>${guitar.name}</h2>
							<p><b>
								${guitar.preview}
							</b></p>
							<div>
								${guitar.description}
							</div>
							<img src="images/${guitar.image}" width="300px">
						`;
						// вставляем в родительское окно новый контент
						mywin.opener.document.getElementById("main").innerHTML = out;
					})
				}
			} 
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
