<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<!-- блок-контейнер -->
	<div id="target"></div>
	
	<script>
		// создаем объект url из адресной строки
		let url = new URL(window.location.href);

		// разбираем объект на параметры
		let par1 = url.searchParams.get('par1');
		
		let par2 = url.searchParams.get('par2');
		
		let par3 = url.searchParams.get('par3');
		
		// формируем строку
		out = `<h1>${par1} ${par2} ${par3}!</h1>`;
		
		document.write(out);
	</script>
		
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
