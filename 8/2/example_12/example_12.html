	<script>
		// функция запуска событий страницы	
		function openWin () {
			event.preventDefault();

			let mywin = window.open("target.html?par1=Veni&par2=vidi&par3=vici","pupUp","width=600,height=700");	
			
			// создаем событие загрузки всплывающего окна
			mywin.onload = function () {
				// добавляем контент в всплывающее окно
				mywin.document.getElementById("target").innerHTML = '<h3>Однажды Гай Юлий Цезарь сказал:</h3>';		
			} 
		}
	</script>
