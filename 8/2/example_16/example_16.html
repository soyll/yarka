<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<script>
		// создаем всплывающее окно
		// подгружаем в окно файл target.html
		// сохраняем ссылку
  		let mywin = window.open('target.html','newPopUp','width=200,height=200,left=400,top=200')
    	
		// записываем в всплывающее окно код кнопки
		mywin.document.write('<button id="btn">Кликни на меня</button>')
    
    	// получаем ссылку на кнопку
		let btn = mywin.document.querySelector('#btn')
    	
    	// создаем для кнопки обработчик
		btn.addEventListener('click', () => {
        	mywin.close()
    	})
	</script>
	
    <footer align="center">
        <h3>Бесплатный старт в программирование и дизайн</h3>
    	<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
