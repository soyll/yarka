<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<div id="main"></div>

	<a href="#" onclick="openWin()">Открыть новое окно</a></p>
	
	<script>
		// функция запуска событий страницы	
		function openWin () {
			event.preventDefault();
			
			// сохраняем ссылку на всплывающее окно
			let mywin = window.open("target.html", 'pupUp' ,"width=600,height=700");	
		
			// создаем событие загрузки всплывающего окна
			mywin.onload = function () {

				// HTML-разметка формы
				// обратите внимание на атрибуты:
				// hidden - форма скрыта
				// target - данные формы будут вставлены в адресную строку всплывающего окна
				let form = `
					<form hidden action='target.html' target='pupUp' id='frm' method='get'>
						<input type="text" name='citate' value="Ум - это все. Вы становитесь тем, о чем думаете">
						<input type="text" name='author' value="Будда">
					</form>
				` 

				// вставка в документ HTML-разметки формы
				document.getElementById("main").innerHTML = form;

				// mywin.focus();

				// отправка формы
				document.getElementById("frm").submit();	
			} 
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
