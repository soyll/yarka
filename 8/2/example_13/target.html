<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<h2>Эти данные пришли из формы:</h2>
		
	<script>
		// создаем объект url из адресной строки
		let url = new URL(window.location.href);

		// разбираем объект на параметры
		let citate = url.searchParams.get('citate');
		
		let author = url.searchParams.get('author');
			
		// формируем строку
		out = `<h1>${citate} (${author}).</h1>`;
		
		document.write(out);
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
