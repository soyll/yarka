<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="citate.js"></script>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<!-- блок для вставки контента -->
	<div id="main"></div>

	<button onclick="openWin()">Открыть список</button>
	
	<script>		
		// функция запуска событий страницы
		function openWin () {
			
			let out = "";

			// формируем контент для всплывающего окна
			citate.forEach( (val, key) => {
				str =  val.substring(0,25);

				out += `
					<h3><a class="citate" data-num="${key}" href="#">${str} ...</h3>
				`
			});

			// сохраняем ссылку на всплывающее окно
			var mywin = window.open("target.html","pupUp","width=600,height=700");	
		
			// создаем событие загрузки всплывающего окна
			mywin.onload = function () {

				// загружаем контент в всплывающее окно
				mywin.document.getElementById("target").innerHTML = out;	

				// получаем коллекцию ссылок всплывающего окна
				links = mywin.document.querySelectorAll("a.citate");

				// перебираем коллекцию, навешиваем на каждую ссылку событие click
				for(let link of links) {
					link.addEventListener("click", function() {
						
						// выполняем поиск цитаты, по которой кликнули
						out = citate.find( (val, key) => {
							return this.dataset.num == key;
						});

						// вставка цитаты в родительское окно
						mywin.opener.document.getElementById("main").innerHTML = "<h2>" + out + "</h2>";
					})
				}
			} 
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
