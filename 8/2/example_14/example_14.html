<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>

	<!-- блок для вставки формы -->
	<div id="main"></div>

	<a href="#" onclick="openWin()">Открыть новое окно</a></p>
	
	<script>
		// функция запуска событий страницы		
		function openWin () {
			event.preventDefault();

			// сохраняем ссылку на всплывающее окно
			let mywin = window.open("target.php", 'pupUp' ,"width=600");	
		
			// HTML-разметка формы
			// обратите внимание на атрибуты:
			// hidden - форма скрыта
			// action - файл с расширением .php
			// method - post
			// target - данные формы будут вставлены в тело запроса всплывающего окна	
			let form = `
				<form hidden action='target.php' id='frm' target='pupUp' method='post'>
					<input type="text" name='firstName' value="Оскар">
					<input type="text" name='secondName' value="Уайльд">
					<input type="text" name='citate' value="У меня непритязательный вкус — достаточно самого лучшего.">
				</form>
			` 

			// вставка в документ HTML-разметки формы
			document.getElementById("main").innerHTML = form;

			// mywin.focus();

			// отправка формы
			document.getElementById("frm").submit();	
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
