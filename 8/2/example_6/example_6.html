<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<script>
		// создаем всплывающее окно
		// подгружаем в окно файл target.html
		// сохраняем ссылку на созданное окно
		let mywin = window.open(
			"target.html",
             "_blank",  
             "left=50,top=20,width=700,height=300,toolbar=yes,scrollbars=yes,resizable=yes"
        );

		// используя ссылку на окно записываем в документ динамический контент
		mywin.document.write('<h1>Это динамический контент</h1>');

		mywin.document.write('<div style="margin:10px; padding:10px; border:1px solid #c0c0c0"><h2>');

		mywin.document.write('Образование создало огромное множество людей, которые умеют читать, но не способны определить, что заслуживает чтения.');

		mywin.document.write('<br>(<i>Джордж Маколей Тревелян</i>)</h2></div>');
	</script>
	
    <footer align="center">
        <h3>Бесплатный старт в программирование и дизайн</h3>
    	<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
