<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body> 
	<header align="center">
		<h1>Работа с браузером. BOM</h1>
	</header>
	
	<!-- подключаем внешние данные -->
	<script src="course.js"></script>
	
	<!-- повесим обработчик на событие oncliick  -->
	<a href="#" onclick="openWin()">Открыть список курсов в новом окне</a></p>
	
	<script>
		// функция-обработчик
		function openWin () {
			event.preventDefault();

			out = "<ol>";

			// представляем массив курсов в виде списка
			course.forEach( (item) => {
				out += `<li><h3>${item.topic}</h3></li>`
			});

			out += "</ol>";
					
			// загружаем в всплывающее окно файл target.html
			let mywin = window.open("target.html","_blank","width=600,height=700");	
		
			// в документ окна загружаем новый контент
			mywin.onload = function () {

				mywin.document.getElementById("target").innerHTML = out;		
				// mywin.document.write(out);		
			} 
		}
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Бесплатные курсы</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
