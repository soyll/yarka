<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
		
	<script>
		// создаем объект URL
		let url = new URL(location.href);

		// получаем параметры
		let topic = url.searchParams.get('topic')
		let lesson = url.searchParams.get('lesson')
		let section = url.searchParams.get('section')

		// выводим параметры в браузер
		document.write('topic = ', topic,"<br>");
		document.write('lesson = ', lesson,"<br>");
		document.write('section = ', section,"<br>");
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
