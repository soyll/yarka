<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<script>
		// создаем объект URL
		let url = new URL('http://js/target.php?course=javascript&topic=bom&lesson=object-url#encoding');
	
		// раскладываем URL на компоненты
		document.write("href: <b>", url.href, "</b><br>");
		document.write("protocol: <b>", url.protocol, "</b><br>");
		document.write("host: <b>", url.host, "</b><br>");
		document.write("origin: <b>", url.origin, "</b><br>");
		document.write("pathname: <b>", url.pathname, "</b><br>");		
		document.write("search: <b>", url.search, "</b><br>");
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
