<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<a id="link" href="#">
		Анализ строки запроса в серверном файле target.php
	</a><p>		
	
	<script>
		// создаем объект URL
		let url = new URL('http://js/target.php?course=javascript&topic=bom&lesson=object-url#encoding');
	
		// добавляем идентификатор фрагмента
		url.hash = "#encodeURI";
	
		// вывод обновленной ссылки в браузер
		document.write("href: ", url.href);		
		
		// обновляем атрибут href ссылки
		document.getElementById('link').setAttribute('href', url.href);
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
