<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<script>
		// создаем объект URL
		let url = new URL('http://js/target.php?course=javascript&topic=bom&lesson=object-url#encoding');

		// вывод в консоль строки параметров
		console.log(url.searchParams);
		
		// вывод в консоль итератора
		console.log(url.searchParams.keys());
		
		// вывод в консоль имен параметров
		for (let key of url.searchParams.keys()){
			console.log(key);
		}
	</script>	
		
    <footer align="center">

    </footer>		
</body>
</html>
