<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<a id="link" href="#">Переход к файлу target.html</a>

	<script>
		// самостоятельно кодируем параметры
		let topic = encodeURI('Управляющие конструкции');
		let lesson = encodeURI('Специальные циклы');
		let section = encodeURI('Цикл for-of');
	
		// формируем атрибут href ссылки
		document.
		getElementById("link").
		setAttribute(
			"href", 
			`target.html?topic=${topic}&lesson=${lesson}&section=${section}`
		);
	</script>
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
