<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<a id="link" href="#">Переход к файлу target.html</a>
			
	<script>
		// самостоятельно кодируем параметры
		// символ & используется не как разделитель параметров,
		// а как часть значения параметра	
		let topic = encodeURI('dom-&-bom-браузера');
		let section = encodeURI('encodeURI&decodeURI');
		
		// символ # используется не как разделитель хеша,
		// а как часть значения параметра
		let lesson = encodeURI('объект#uri');
		
		// формируем атрибут href ссылки
		document.
		getElementById("link").
		setAttribute(
			"href", 
			`target.html?topic=${topic}&lesson=${lesson}&section=${section}`
		);
	</script>
		
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>	
</body>
</html>
