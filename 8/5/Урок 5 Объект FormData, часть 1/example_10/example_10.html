<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">
		Логин: <input type="text" name="login" value="DenisDream"><p>
		E-mail: <input type="email" name="email" value="denis-dream@gmail.com"><p>
		Пароль: <input type="password" name="pwd" value="qwerty@"><p>
		<input type="submit">
	</form>

	<script>
		// ссылка на форму
		let form = document.querySelector("#frm");

		// преобразование формы в объект FormData
		let form_data = new FormData (form);

		// получение значений элементов формы
		let login = form_data.get("login");
		let email = form_data.get("email");
		let pwd = form_data.get("pwd");

		// вывод данных формы в консоль
		console.log("login -> ", login);
		console.log("email -> ", email);
		console.log("pwd -> ", pwd);
	</script>	

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
