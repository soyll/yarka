<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>
	
	<script>
		// пользовательский объект 
		let user = {
		  login: 'DenisDream',
		  email: 'denis-dream@gmail.com',
		  pwd: 'qwerty@',
		  course: ['python', 'php']
		}
		// объект Set
		user_set = new Set();
		user_set.add(user);

		// изменяем свойство пользовательского объекта
		user.course.push('javascript');

		// измененилтсь оба объекта
		console.log(user);
		console.log(user_set);
	</script>

    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
