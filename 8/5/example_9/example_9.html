<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Работа с браузером. Browser Object Model (BOM)</h1>
	</header>

	<form id="frm">
		Логин: <input type="text" name="login" value="DenisDream"><p>
		E-mail: <input type="email" name="email" value="denis-dream@gmail.com"><p>
		Пароль: <input type="password" name="pwd" value="qwerty@"><p>
		<input type="submit">
	</form>
	
	<script>
		// ссылка на форму
		let form = document.getElementById("frm");
		
		form_data = new FormData(form);
		
		// сериализуем объект
		console.log(JSON.stringify(form_data));

		// преобразуем объект FormData в массив
		form_data_arr = Array.from(form_data);
		
		// сериализуем массив
		console.log(JSON.stringify(form_data_arr));
	</script>	
	
    <footer align="center">
        <h3>Веб-разработка от профессионалов. Программирование и дизайн</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
