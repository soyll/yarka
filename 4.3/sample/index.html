<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>фигуры</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="block">
        <h2>Круг</h2>
        <div class="shape circle"></div>
    </div>
    <div class="block">
        <h2>Овал</h2>
        <div class="shape oval"></div>
    </div>
    <div class="block">
        <h2>Яйцо</h2>
        <div class="shape egg"></div>
    </div>
    <div class="block">
        <h2>Ромб</h2>
        <div class="shape diamond"></div>
    </div>
    <div class="block">
        <h2>Треугольник направо</h2>
        <div class="shape triangle-right"></div>
    </div>
    <div class="block">
        <h2>Треугольник налево</h2>
        <div class="shape triangle-left"></div>
    </div>
    <div class="block">
        <h2>Трапеция</h2>
        <div class="shape trapezoid"></div>
    </div>
    <div class="block">
        <h2>Пятиконечная звезда</h2>
        <div class="shape star-five"></div>
    </div>
    <div class="block">
        <h2>Шестиконечная звезда</h2>
        <div class="shape star-six"></div>
    </div>
    <div class="block">
        <h2>Параллелограмм</h2>
        <div class="shape parallelogram"></div>
    </div>
    <div class="block">
        <h2>Пятиугольник</h2>
        <div class="shape pentagon"></div>
    </div>
    <div class="block">
        <h2>Восьмиугольник</h2>
        <div class="shape octagon"></div>
    </div>
    <div class="block">
        <h2>Сердце</h2>
        <div class="shape heart"></div>
    </div>
    <div class="block">
        <h2>Pacman</h2>
        <div class="shape pacman"></div>
    </div>
</body>

</html>
