<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявляем функцию
		function mult(num1, num2) {
			// тело функции
			let res = num1 * num2;
			return res;
		}
		
		// объявим переменную value
		var value = 4;
		
		// во внешний код вернем значение, возвращаемое функцией
		// значение запишем в переменную 
		var x = mult(value, 6); 
		console.log(x); // 24
	</script>

</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

</body>	
</html>
