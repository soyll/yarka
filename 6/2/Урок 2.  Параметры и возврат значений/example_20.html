	<title>Программирование в среде JavaScript</title>
	
	<script>
		// объявляем стрелочную функцию
		let fnReturnArray = () => {
			// функция возвращает массив
			return ["балалайка", "медведь", "матрешка"];
		} 
		
		// вызов функции
		let arr = fnReturnArray();

		// вывод массива в консоль
		console.log(arr);
	</script>
