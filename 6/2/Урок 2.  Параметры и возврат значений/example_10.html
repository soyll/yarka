<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявляем функцию c двумя параметрами:
		/*
			1) str - явный параметр (строка)
			2) ...params - неопределенным количеством параметров
		*/
		function display(str, ...params){
			
			console.log ("-> это первый параметр: ", str);
			console.log ("-> далее массив параметров: ");
			
			// params - массив
			for (value of params){
				console.log(value);
			}
		}
		
		// вызов функции
		display("html", "javascript", true, "css", 1); 		

		console.log ("==========\n");	
		
		// вызов функции может быть и такой
		console.log ("вызов функции может быть и такой:\n");
		display();	
	</script>	
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

</body>	
</html>
