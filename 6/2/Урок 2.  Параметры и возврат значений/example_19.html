<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>	
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	
	
	<script>
		// объявляем анонимную функцию 
		let checkUser = function() {
			// получение данных от пользователя
			let login = prompt('Введите логин: ');
			let pwd = prompt('Введите пароль: ');
			
			// анализ данных
			if (login == "admin" && pwd == "12345") {
				return true;
			} 
			else {
				return false;
			}
		}

		// принятие решения о доступе
		if (checkUser()) {
			document.write ('<h1>Добро пожаловать на сайт!</h1>');
		} else {
			alert('Пользователь с такими данными в системе не обнаружен.');
			document.write ('<h1>Доступ к ресурсу закрыт :(</h1>');
		}
	</script>

	<footer align="center">
		<h3>Веб-программирование и дизайн на vk.com/pechora_pro</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>	
</html>
