<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявляем функцию с двумя параметрами 
		// параметры: user, role
		// параметр role задан по умолчанию
		function showUser(user, role = 'Модератор') { 
			let msg = user + ' (' + role + ') ';
			alert(msg);
			console.log(msg);
		}

		// вызываем функцию с одним аргументом: 'Евгений'
		showUser('Евгений');
	</script>	
	
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

	</footer>
</body>	
</html>
