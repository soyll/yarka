<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявляем функцию с неопределенным количеством параметров
		function fnParamsDisplay(...params) {
			// params - массив
			console.dir("params - это массив:");
			console.dir(params);

			console.log("==========\n");

			console.log(params[0]);
			console.log(params[1]);
			console.log(params[2]);
			console.log(params[3]);
		}
		
		// вызов функции c 4 аргументами
		/*
			"99" - строка
			10 - число
			true - булев
			[{user:"sa"}, "php"] - массив из двух элементов (объект, строка)
		*/
		fnParamsDisplay("99", 10, true, [{user:"sa"}, "php"]);	
	</script>	

</head>
