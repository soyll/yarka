<!doctype html> 
<html lang="ru">
<head> 
	<meta charset="UTF-8">
	<title>Программирование JavaScript</title> 
</head>
<body>
	<h1>Функции в JavaScript</h1>
	
	<script type="module">
		import { fnGetData } from "./functions.js";

		// вызываем импортированную функцию списка
 		let html = fnGetData();

 		// без всяких блоков-контейнеров вставляем сформированный контент в браузер
		document.body.firstElementChild.insertAdjacentHTML("afterend", html);
	</script>

    <footer align="center">
        <h3>Образование | Веб-разработка | Frontend-программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
