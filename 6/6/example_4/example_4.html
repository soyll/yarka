<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<h1>Функции в JavaScript</h1>
	
	<!-- 
		подключаем внешний модульный скрипт 
		такие скрипты без проблем взаимодействуют с деревом DOM 
	-->
	<script type="module" src="./outer.js"></script>

	<!-- 
		встроенный модульный скрипт 
		содержит подключаемые функции
	-->
	<script type="module">
		// импортируем функцию из модуля storage.js
		import { fnSayHello } from "./storage.js";

		// вызов импортированной из модуля функции
		fnSayHello("Привет, это снова я...");
	</script>
    
    <footer align="center">
        <h3>Образование | Веб-разработка | Frontend-программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
