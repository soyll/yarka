<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<h1>Функции в JavaScript</h1>

	<div id="target"></div>

	<script type="module">
		import {fnAreaCircle as ModfnAreaCircle, fnSquare, pi} from "./mathematic.js";

		// создадим функцию с дублирующим именем
		let fnAreaCircle = (r) => {
			let res = pi * fnSquare(r);  
			return res;
		};		

		let out = 'Площадь круга: ' + ModfnAreaCircle(4);
		out += '<p>Площадь круга: ' + fnAreaCircle(4);
		
		let target = document.getElementById("target");
		target.insertAdjacentHTML('beforeend', out);		
	</script>

    <footer align="center">
        <h3>Образование | Веб-разработка | Frontend-программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
