<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<h1>Функции в JavaScript</h1>

	<div id="target"></div>
	
	<script type="module">
		// импортируем все содержимое модуля
		// при этом необходимо указать алиасное имя (as math)
		import * as math from "./module/mathematic.js";

		let target = document.getElementById("target");

		let out = 'Число PI: ' + math.pi;
		target.insertAdjacentHTML('afterbegin', out);
	
		out = '<p>Площадь круга: ' + math.fnAreaCircle(4);
		target.insertAdjacentHTML('afterbegin', out);
		
		out = '<p>Площадь треугольника: ' + math.fnAreaTriangle(4, 2);
		target.insertAdjacentHTML('afterbegin', out);
	</script>

    <footer align="center">
        <h3>Образование | Веб-разработка | Frontend-программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
