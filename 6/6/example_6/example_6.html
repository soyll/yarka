<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<h1>Функции в JavaScript</h1>

	<div id="target"></div>
	
	<script type="module">
		// импортируем только функции (без переменной)
		import { pi, fnAreaCircle, fnAreaTriangle } from "./mathematic.js";

		let out = 'Число PI: ' + pi;
		out += '<p>Площадь круга: ' + fnAreaCircle(4);
		out += '<p>Площадь треугольника: ' + fnAreaTriangle(4, 2);

		let target = document.getElementById("target");
		target.insertAdjacentHTML('afterbegin', out);
	</script>

    <footer align="center">
        <h3>Образование | Веб-разработка | Frontend-программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
