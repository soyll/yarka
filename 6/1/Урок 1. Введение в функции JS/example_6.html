	<title>Программирование в среде JavaScript</title>

	<script>
		// объявление однострочной стрелочной функции cube()
		var cube = (num) => num * num * num;
		
		// вызов функции cube()
		var x = cube(3); 
		
		alert(x); // 27
	</script>
