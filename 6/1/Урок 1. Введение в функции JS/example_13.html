<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// анонимное выражение
		var cube = function (num) {
			return num * num * num;
		};	

		// вывод свойства name
		console.log(cube.name); // cube		

		// переприсвоим значение новой переменной
		var varCube = cube;

		// вывод свойства name новой переменной
		console.log(varCube.name); // сube
		
		// именованное выражение
		var cube = function fnCube (num) {
			return num * num * num;
		};

		// вывод свойства name
		console.log(cube.name); // fnCube

		// переприсвоим значение новой переменной
		var varCube = cube;

		// вывод свойства name новой переменной
		console.log(varCube.name); // fnCube
	</script>

</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

</body>	
</html>
