<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

	<script>
		// объявление стрелочной функции discr()
		var discr = () => {
			let b = 6;
			let a = 2;
			let c = 1;
			let d = b**2 - 4 * a * c;
			return d;	
		};
		
		// вызов функции discr()
		console.log(discr()); 

		// вывод кода функции discr() в браузер
		document.write(discr); 
		
		// вывод кода функции discr() в консоль
		console.log(discr); 
	</script>

</body>
