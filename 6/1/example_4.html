<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// объявление функции 
		var cube = function (number) {
			result = number * number * number;
			return result;
		};
		
		// инициируем переменную value
		var value = 5;
		
		// передаем переменную value в качестве аргумента анонимной функции 
		var x = cube(value); 
		
		console.log(x);  // 125
	</script>
	
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

	</footer>
</body>	
</html>
