<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// два представленных примера эквивалентны
		// 1. - вызов, объявление
		// 2. - объявление, вызов

		// вызов функции sayHello
		sayHello("Greta");

		// объявление функции sayHello
		function sayHello (name) {
			console.log('Hello,', name, '!');
		}
		
		// ====================

		// объявление функции myGreeting
		function myGreeting (name) {
			console.log('Welcome  friend', name, '!');
		};

		// вызов функции myGreeting
		myGreeting ("Jimmy");		
	</script>

</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

	</footer>
</body>	
</html>
