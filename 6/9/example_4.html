<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// глобальная переменная 
		var login = "GlobalLogin";

		// объект
		let user = {
  			login: "DenisDream",
  			// метод
  			welcome: function() {
    			alert (`Привет, ${this.login}!`);
 	 		}
		};

		// потеря контекста в асинхронном вызове
		setTimeout(user.welcome, 3000); // Привет, GlobalLogin!

		// запуск метода в контексте объекта
		user.welcome(); // Привет, DenisDream!
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
