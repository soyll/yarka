<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// внешняя функция
		function outer(name) {
		    let email = "denis-dream@mail.ru";
		    let role = "admin";
		    /* 
		    	локальные переменные функции outer:
				- name
				- email
				- role
			*/

		    // возвращаем определение безымянной функции
		    return function() {
		        // вложенная функция имеет доступ к лексическому окружению родителя
		        document.write(`
		        	<h3>Привет, ${name}!</h3>
		        	Вы зашли с ролью <b>${role}</b><br> 
		        	Ваш e-mail: <b>${email}</b>
		        `);
		    }
		}
		
		/* 
			сохранение состояния лексического окружения
			- name
			- email
			- role
		*/
		// создание замыкания
		let hi = outer('Денис');
		
		// переменные глобального контекста 
		var name = "Anonymous";
		var email = "Unknown";
		var role = "user";

		// вызов замыкания
		hi();
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
