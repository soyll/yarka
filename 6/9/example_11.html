<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// внешняя функция
		function sayHello() {
		    // локальное свойство
		    let name = "Денис";
		    // возвращаем вложенную функцию
		    return function() {
		        console.log(`Привет, ${name}!`);
		    }
		}
		
		console.log(sayHello);

		console.log(sayHello());

		sayHello()();
		
		outUser(sayHello);

		// callback – метод объекта
		function outUser(callback) {
			// вызов вложенной функции callback
			callback()();
		}
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
