<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// глобальная переменная
		login = "JimMorrison";

		// объект user
		var user = {
  			login: "DenisDream",
  			pwd: "12345",
  			role: "admin",
  			welcome: function() {
    			alert(`Привет, ${this.login}!`);
 	 		}
		};
		
		// функция callback для setTimeout() сработает через 2 сек.
		// но к этому времени объект user будет переопределен 
		setTimeout( () => {user.welcome()}, 2000);
		
		// переопределили объект user
		var user = {
  			login: "ZyZyOnly",
  			pwd: "qwerty",
  			role: "moderator",
  			welcome: function() {
    			alert(`Привет, ${this.login}!`);
 	 		}
		};
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
