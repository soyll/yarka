<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// глобальная переменная
		name = "GlobalName";

		// объект 
		let user = {
		    // свойство объекта
		    name: "Дениc",
		    // метод объекта
		    userInfo: function() {
				console.log(`Привет, ${this.name}!`);
		    }
		}
	
		// вызов метода объекта
		user.userInfo(); // Привет, Дениc!

		// вызов функции с аргументом - callback
		outUser(user.userInfo);	// Привет, GlobalName!	
		
		// аргумент функции - callback (метод объекта)
		function outUser(callback) {
			// вызов функции вне контекста объекта
			callback();
		}	
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
