<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// внешняя функция
		function outer() {
		    // внутренняя функция
		   	function inner() {
		        console.log('Привет!');
		    }
		    // инструкции return нет
		}	

		// вызов внешней функции outer
		console.log(outer()); 
		/*
			консоль: 
			undefined (неявный)
		*/
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
