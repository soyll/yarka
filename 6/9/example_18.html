<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Замыкания</h1>
	</header>	
		
	<script>
		// внешняя функция
		function outer() {
		    // возвращаем определение безымянной функции
			return function () {
		        console.log('Привет!');
		    }
		}

		// сохранение состояния (лексического окружения)
		// создание замыкания
		let hi = outer();

		// вывод замыкания
		console.log(hi);
		/*
			консоль:
			ƒ () {
		        console.log('Привет!');
		    }
		*/

		// вызов замыкания
		hi();
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
