<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>
		name = "Филип Филиппович";

		order = [
			{
				name: "Арлекино",
				
				getThis: function () {
					console.log(this); // ???

					console.log(`Меня зовут ${this.name}`); // ???
				},
				getName:() => {
					name = "Mademoiselle Azzaro";
					// var name = "Mademoiselle Azzaro";
					
					console.log(this); // ???
					
					console.log(`Меня зовут ${this.name}`); // ???
				}
			}
		]
		
		// 1
		order[0].getThis();
		
		// 2
		console.log(window.name);
		
		// 3
		order[0].getName();
		
		// 4
		console.log(window.name); 
	</script>
