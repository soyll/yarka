<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>		
		// внешняя функция инструкция
		function fnOuterStatement() {			
			// локальная переменная name 
			let name = "I'm Silvija";

			// вложенная функция инструкция
			function fnInnerStatement() {
				// локальная переменная name 
				let name = 'Who am I?';

				console.log(name); // Who am I?
				console.log(this.name); // My name is Bond. James Bond				
			}

			// вызов вложенной функции
			fnInnerStatement();
		};

		// глобальная переменная name
		var name = "My name is Bond. James Bond";

		// вызов внешней функции
		fnOuterStatement();
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
