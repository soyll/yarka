<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>		
		// внешняя функция стрелка
		fnOuterArrow = () => {
			// включаем строгий режим
			// 'use strict';

			// локальная переменная name
			let name = "I'm Silvija";

			// вложенная функция стрелка
			let fnInnerArrow = () => {
				console.log(name); // I'm Silvija
				console.log(this.name); // My name is Bond. James Bond 				
			}

			// вызов вложенной функции
			fnInnerArrow();
		};
		
		// глобальная переменная name
		var name = "My name is Bond. James Bond";			

		// вызов внешней функции
		fnOuterArrow(); 
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
