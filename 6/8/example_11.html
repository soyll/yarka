<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>		
		myFn = function () {
				// локальная переменная name
				var name = "I'm Silvija";
				console.log(name);  // I'm Silvija
				console.log(this.name);  // No Name
				console.log(globalThis.name); // My name is Bond. James Bond
			}

		// определене объекта
		let obj = {
			// name - свойство объекта
			name: "No Name",

			mtdStatement: myFn,

			mtdArrow: () => {
				// локальная переменная name
				console.log(name);  // My name is Bond. James Bond
				console.log(this.name);  // My name is Bond. James Bond
				console.log(globalThis.name); // My name is Bond. James Bond
			}			
		};

		// глобальная переменная name
		var name = "My name is Bond. James Bond";

		// вызов методов объекта
		obj.mtdStatement(); 
		// obj.mtdArrow();
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
