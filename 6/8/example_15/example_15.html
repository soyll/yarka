<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
		
	<script>
        // массив для передачи в функцию
        let block = Array(
        	`<header>
				<h1 align="center">Лексическое окружение и контекст</h1>
			</header>`,
    		`<footer align="center">
        		<h3>Верстка | Дизайн | Программирование</h3>
        		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    		</footer>`
        );

        /*
			block[0] - header
			block[1] - footer
        */

        // набор глобальных переменных
        var name = "No name";
        var login = "undefined";
        var email = "hidden";
        var role = "lamer";
        var image = "no.jpg";       

        // объект
        var user = {
        	name: "Злой Бармалей",
        	login: "SuperAdmin",
        	email: "super-admin@mail.org",
        	role: "administrator",
        	image: "user.jpg"
        }

		// параметр - массив
		function outUserInfo(...rest) {
			// формирование блока для вывода		
			let html = `
				${rest[0]}
				${this.name} <br>
				${this.login} <br>
				${this.email} <br>
				<img src="${this.image}" width="250px"> <br>
				${rest[1]}
			`;

			// возвращаем блок вывода
			return html;				
		}

		// параметр - массив block
		document.write(outUserInfo.apply(this, block));  

		// document.write(outUserInfo.apply(user, block));  
	</script>

</body>
</html>
