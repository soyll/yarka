<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>		
		// внешняя функция выражение
		fnOuterExpression = function () {
			// включаем строгий режим
			'use strict';

			// локальная переменная name
			var name = "I'm Silvija";

			// вложенная функция выражение
			let fnInnerExpression = function() {
				
				console.log(name); // I'm Silvija
				console.log(this); // undefined 	
				console.log(globalThis); // window 				
			}

			// вызов вложенной функции
			fnInnerExpression();
		};

		// глобальная переменная name
		var name = "My name is Bond. James Bond";		

		// вызов внешней функции
		fnOuterExpression();
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
