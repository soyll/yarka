<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Лексическое окружение и контекст</h1>
	</header>	
	
	<script>
		// функция инструкция
		function aFnStatement() {
			console.log('I am a FUNCTION STATEMENT');
			console.log(this);
		}

		// функция выражение
		var aFnExpression = function () {
			console.log("I'm a FUNCTION EXPRESSION");
			console.log(this);
		}

		// функция стрелка
		var aFnArrow =  () => {
			console.log("I'm a FUNCTION ARROW");
			console.log(this);
		}

		// объект
		var aMyObj = {
			methodExpr: function() {
				console.log("I'm a METHOD Expression Object");
				console.log(this);
			},
			methodArrow: () => {
				console.log("I'm a METHOD Arrow Object");
				console.log(this);
			}
		};
		
		// глобальный объект window
		console.log(this);

		aFnStatement(); // window

		aFnExpression(); // window

		aFnArrow(); // window
		
		aMyObj.methodExpr(); // Object

		aMyObj.methodArrow(); // window
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
