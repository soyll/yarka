<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>

	<script>
		// определяем первую функцию
		function first() { 
			console.log("The first function is completed");
		}

		// определяем вторую функцию
		function second() {
			console.log("The second function is completed");
		}

		// вызываем функции
		first();
		second();
		
		// поведение функций предсказуемо
	</script>

</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>
