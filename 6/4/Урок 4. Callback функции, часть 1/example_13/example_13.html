<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="auto.js"></script>
</head>	
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	

	<div id="app"></div>

	<script>
		// определяем функцию
		// 1 параметр - массив объектов
		// 2 параметр - коллбэк (код функции)
		function fnArgData(data, callback) {
		
			// моделируем запрос к API (на внешние ресурсы)
		  	setTimeout(() => {
		  		
		  		let line;

		  		// цикл поиска объекта по id
				for(item of data) {
					line += callback(item);
				}

				document.getElementById("app").innerHTML = line;;
		  	
		  	}, 1000);
		}
		
		// функция-коллбэк
		let callback = (elem) => {
			return `
				<b><a href='?id=${elem.id}'>${elem.name}</a></b><br>
				Бренд: <b>${elem.brand}</b><br>
        		Тип двигателя: <b>${elem.dvs_type}</b><br>
        		Мошность: <b>${elem.power_hp}</b> (л.с.)<br>
        		Количество цилиндров: <b>${elem.cylinders_num}</b><br>
        		Макс. скорость: <b>${elem.max_speed}</b><br>
        		<img src='${elem.image}'><br>
			`;
		};

	</script>

    </footer>
</body>
</html>
