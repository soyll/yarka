<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="cars.js"></script>
</head>	
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>

	<div id="console"></div>		

	<script>
		// определяем функцию
		// 1 параметр - итерируемый набор (массив объектов) 
		// 2 параметр - коллбэк (код функции)
		function fnGetObj(data, callback) {
		
			// моделируем запрос к API (на внешние ресурсы)
		  	setTimeout(() => {
		  		// цикл перебора объектов
				for(item of data) {
					callback(item)
				}
		  	
		  	}, 500);
		}
		
		// функция-коллбэк
		let callback = (elem) => {
			let line = `
				<b><a href='?id=${elem.id}'>${elem.name}</a></b><br>
				Бренд: <b>${elem.brand}</b><br>
        		Тип двигателя: <b>${elem.dvs_type}</b><br>
        		Мошность: <b>${elem.power_hp}</b> (л.с.)<br>
        		Количество цилиндров: <b>${elem.cylinders_num}</b><br>
        		Макс. скорость: <b>${elem.max_speed}</b><br>
        		<img src='${elem.image}'><br>
			`;
			
			// вставка контента в документ
			document.getElementById("console").insertAdjacentHTML("afterend", line);
		};
		
		fnGetObj(cars, callback);
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
