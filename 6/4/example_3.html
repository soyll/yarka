<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	

	<script>
		// определяем отложенную функцию
		// функция имеет параметры
		function sayHi(name, login) {
			alert( "Привет, " +  name + " (" + login + ")!" );
		}
		
		// запускаем функцию на выполнение
		setTimeout(sayHi, 1000, "Евгений", "master");
	</script>

</body>
