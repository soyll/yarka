<body>	
	<header>
		<h1 align="center">Область видимости и лексическое окружение</h1>
	</header>	
	
	<h2>Цепочки объектов лексического окружения</h2>

	<script>		
		// глобальное лексическое окружение 
		var a = 5;
		let b = 10;
		const c = 20;

		// функция глобального лексического окружения 
		function fnOuter() {
			// область видимости функции fnOuter
			// локальное (первое вложенное) лексическое окружение 
			
			// переменная 'a' перезапишет глобальное значение
			a = 10; 
			let b = 15;
			b = 20;
		
			// функция лексического окружения созданного fnOuter
			function fnInner() { 
				// область видимости функции fnInner
				// локальное (второе вложенное) лексическое окружение 
		    	
				// переменная 'b' перезапишет значение родительского окружения
		    	b = 2;
		    	let c = 5;
		    	
		    	console.log(a + b + c); // 10 + 2 + 5 = 17 

		    	// console.log('a = ', a);
		    	// console.log('b = ', b);
		    	// console.log('c = ', c); 
			}
		  	
		  	// вызов функции сформирует второе вложенное лексическое окружение 
			fnInner();
		}

		// вызов функции сформирует первое вложенное лексическое окружение 
		fnOuter();
	</script>
