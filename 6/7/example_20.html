<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>	
	<header>
		<h1 align="center">Область видимости и лексическое окружение</h1>
	</header>	
	
	<h2>Цепочки объектов лексического окружения</h2>

	<script>		
		// глобальное лексическое окружение 
		let a = 5;
		let b = 5;
		let c = 5;

		let obj = {
			// локальное (вложенное) лексическое окружение  
			a: 10, 
			b: 10,
			c: 10,
			calcSum: function() { 
				// метод возвращает сумму трех переменных
		    	return (a + b + c);
			}
		}
		
		console.log(obj.calcSum());  // 15

		console.log(a + b + c);  // 15

		console.log(obj.a + obj.b + obj.c);  // 30
	</script>

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>

    </footer>
</body>
</html>
