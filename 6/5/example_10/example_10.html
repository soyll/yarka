<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="cars.js"></script>	
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>

 	<script>	
		// преобразуем массив cars
		var dieselCars = cars.map(callback);
		
		// функцию инструкцию можно объявить после вызова
		function callback(item, i, cars) {
			// критерий поиска - дизельный двигатель
			reg = RegExp(/дизель/, "i");
			
			// если предикат true - возвращаем название
			// иначе - null
			if (reg.test(item[3])) return  item[2];	
			else return null;
		}

		// вывод исходного массива
		console.dir(cars); 

		// вывод дизельных авто из массива
		console.dir(dieselCars);				
	</script>
	   
</body> 
</html>
