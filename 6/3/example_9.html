	<script>
		function fnStrict() {
			"use strict";
			
			// пытаемся переменную сделать глобальным свойством объекта window
			aStrict = 99;

			/*
				код далее выполняться не будет
				для выполнения необходимо:

					закомментировать - use strict;
				либо:
					закомментировать - aStrict = 99;
				либо:	
					объявить переменную - var aStrict = 99; || let aStrict = 99;
			*/

			return this;
		}

		fnStrict();

		console.log(this);
