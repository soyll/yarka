<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	

	<h2>Переопределение функций</h2>
	
	<script>
		function message() {
		    console.log("Здравствуйте!");
		    message = function() {
		        console.log("До свидания!");
		    }
		}
		 
		// присвоение переменной displayMessage исходного кода функции message
		var displayMessage = message;

		/*
			теперь переменная displayMessage содержит следующее  значение:
		    {
		    	console.log("Здравствуйте!");
			    message = function() {
			        console.log("До свидания!");
			}
		*/

		// console.log(displayMessage);

		/*
			- вызываем функцию displayMessage()
			- при этом перепишем переменную message 
		*/
		displayMessage();

		message();
	</script>	

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
