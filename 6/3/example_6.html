	<script>
		// глобальный контекст
		console.log("this === window: ", this === window); // true

		// числовая переменная станет глобальным свойством объекта window 
		aNum = 55;
		
		// строковая переменная станет глобальным свойством объекта window 
		window.aStr = "Hello User!";

		// логическая переменная станет глобальным свойством объекта window
		this.aBool = true;

		console.log(this); 

		// console.log(aNum);

	</script>
