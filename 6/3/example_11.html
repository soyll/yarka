<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>	

	<h2>Переопределение функций</h2>
	
	<script>
		function message(){
		    console.log("Здравствуйте!");
		    // переписываем значение глобальной переменной message
		    message = function(){
		        console.log("До свидания!");
		    }
		}
		// первый вызов функции
		/*
			во время первого вызова в теле функции произошло
			переопределение исходного кода вызываемой функции
		*/		 
		message();

		// второй вызов функции (функция переопределена)
		message();
	</script>	

    <footer align="center">
        <h3>Верстка | Дизайн | Программирование</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
