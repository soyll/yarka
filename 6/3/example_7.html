<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	
	<script>
		// нестрогий режим / sloppy mode
		function fnSloppy() {
		  // числовая переменная станет глобальным свойством объекта window 
		  aSloppy = 99;

		  return this;
		}

			console.log("НЕстрогий режим ->");

		// this ссылается на глобальный window
		console.log(fnSloppy() === window); // true

		console.log(this); // глобальный объект window

		// глобальный window содержит свойство aSloppy
		console.log(this.aSloppy); // 99
	</script>	

</head>
<body>
	<header>
		<h1 align="center">Функции JavaScript</h1>
	</header>
