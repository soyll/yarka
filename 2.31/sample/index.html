<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Личный кабинет 1.1</title>
</head>

<body>
	<h1>Добро пожаловать в личный кабинет. Версия 1.1</h1>

	<form name="auth" action="index.html">
		<div>
			<h2>Выберите удобный для вас способ авторизации</h2>

			<fieldset>
				<legend>Варианты авторизации</legend>
				<input type="radio" name="auth-method" id="auth-email" value="email">
				<label for="auth-email">Email</label>
				<input type="radio" name="auth-method" id="auth-login" value="login">
				<label for="auth-login">Логин</label>
				<input type="radio" name="auth-method" id="auth-tel" value="tel" checked>
				<label for="auth-tel">Телефон</label>
			</fieldset>
		</div>

		<div>
			<h2>Заполните данные для связи с Вами</h2>

			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="Введите email...">

			<label for="tel">Телефон</label>
			<input type="tel" id="tel" name="tel" placeholder="Введите телефон...">
			<br>
			<label for="url">Страница в соцсетях или личный сайт</label>
			<input type="url" id="url" name="url" placeholder="Введите адрес страницы...">
		</div>

		<div>
			<h2>Измените пароль</h2>
			<label for="password">Пароль</label>
			<input type="password" id="password" name="password" placeholder="Введите пароль..."> <br>
			<label for="password-confirm">Подтверждение пароля</label>
			<input type="password" id="password-confirm" name="password-confirm" placeholder="Повторите пароль...">
		</div>

		<input type="submit" value="Сохранить">
	</form>



	<form name="profile" action="index.html">
		<div>
			<h2>Расскажите нам о себе</h2>

			<label for="name">Имя:</label>
			<input type="text" name="name" id="name">
			<label for="surname">Фамилия:</label>
			<input type="text" name="surname" id="surname"><br>
			<label for="birthday">Дата рождения:</label>
			<input type="date" name="birthday" id="birthday"> <br>
			<label for="photo">Фото профиля:</label>
			<input type="file" name="photo" id="photo" accept="image/png,image/jpeg">

			<input type="submit" value="Сохранить">
		</div>
	</form>


	<form name="message" action="index.html">
		<h2>Кому желаете отправить сообщение:</h2>

		<div>
			<input type="radio" name="destination" id="destination-dis" value="designer" checked>
			<label for="destination-dis">Главный дизайнер</label>
			<input type="radio" name="destination" id="destination-mod" value="moderator">
			<label for="destination-mod">Модератор</label>
			<input type="radio" name="destination" id="destination-adm" value="admin">
			<label for="destination-adm">Администратор</label>
		</div>

		<div>
			<label for="theme">Тема сообщения:</label>
			<input type="text" id="theme" name="theme" placeholder="Введите тему сообщения...">
			<br>
			<label for="message">Сообщение:</label> <br>
			<textarea name="message" id="message" cols="50" rows="10" placeholder="Введите сообщение..."></textarea>
		</div>

		<input type="checkbox" id="personal" name="personal" required>
		<label for="personal">Согласие на обработку персональных данных</label>

		<input type="submit" value="Отправить">
	</form>

</body>

</html>
