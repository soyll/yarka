<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Настройка формы</title>
</head>
<body>
    <form>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            required 
            type="email" 
            id="email" 
            class="form-input" 
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" 
            title="Введите валидный адрес" 
            placeholder="Введите валидный адрес">   
          <div class="form-group__error">Введите валидный адрес</div>
        </div>
    </form>
</body>
</html>
