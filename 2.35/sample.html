<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма сбора персональных данных</title>
    <style>
        body {
            color: white;
            background-color: gray;
            text-align: center;
        }
        form {
            background-color: white;
            color: black;
            width: 75%;
            margin: 0 auto;
            border-radius: 15px;
            padding: 15px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>Форма сбора персональных данных</h1>

    <form action="#" method="get">
        <h2>Персональные данные</h2>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="surname">Фамилия (кириллица, тире, пробел; от 3 до 15 символов):</label>
            <input type="text" id="surname" name="surname" value="Панкратов"
                minlength="3" maxlength="15" pattern="[а-яА-ЯёЁ\s\-]{3,15}"
                title="Кириллица, тире, пробел; от 3 до 15 символов">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="name">Имя (кириллица, пробел; от 3 до 10 символов):</label>
            <input type="text" id="name" name="name" value="Инокентий"
                minlength="3" maxlength="10" pattern="[а-яА-ЯёЁ\s]{3,10}"
                title="Кириллица, пробел; от 3 до 10 символов">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="patronymic">Отчество (кириллица; от 3 до 15 символов):</label>
            <input type="text" id="patronymic" name="patronymic" value="Караулович"
                minlength="3" maxlength="15" pattern="[а-яА-ЯёЁ]{3,15}"
                title="Кириллица; от 3 до 15 символов">
        </div>

        <div>
            <p>Укажите ваш пол</p>
            <input type="radio" id="sex-m" name="sex" value="мужской" checked>
            <label for="sex-m">мужской</label>
            <input type="radio" id="sex-f" name="sex" value="женский">
            <label for="sex-f">женский</label>
            <input type="radio" id="sex-o" name="sex" value="другой">
            <label for="sex-o">другой</label>
        </div>

        <h2>Разное</h2>

        <div style="margin-bottom: 20px;">
            <label for="document">Вид документа:</label>
            <select id="document" name="document" size="1">
                <option value="Паспорт" selected>Паспорт</option>
                <option value="Удостоверение личности">Удостоверение личности</option>
                <option value="Водительские права">Водительские права</option>
                <option value="Купюра 100$">Купюра 100$</option>
            </select>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="email">E-mail (стандартный):</label>
            <input type="email" id="email" name="email" value="1@gmail.com"
                minlength="5" maxlength="50">
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" name="phone" value="7-921-765-23-12"
                placeholder="7-921-765-23-12" maxlength="16"
                pattern="[0-9\-]{10,16}" title="Пример: 7-921-765-23-12">
            <p><small>Пример: 7-921-765-23-12</small></p>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="age">Полных лет на момент согласия (диапазон: 18-65):</label>
            <input type="number" id="age" name="age" value="18" min="18" max="65">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="consent-date">Дата заполнения согласия (дд.мм.гггг):</label>
            <input type="date" id="consent-date" name="consent-date" value="2019-12-12">
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <label for="about">Расскажите о себе:</label>
            <textarea name="about" id="about" cols="50" rows="5" maxlength="500" placeholder="Я очень люблю гулять и рисовать."></textarea>
        </div>

        <div>
            <input type="reset" value="Очистить">
            <input type="submit" value="Отправить">
        </div>
    </form>

    <h1>Спасибо за заполнение</h1>
</body>

</html>
