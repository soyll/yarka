<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<div id="content"><!-- место для вставки контента --></div>
	
	<script>
		// создаём и инициализируем объект XMLHttpRequest
		let xhr = new XMLHttpRequest();
		xhr.open('GET', 'http://js/server.php');

		// используем метод onprogress
		xhr.onprogress = function (event) {

			console.log("Получено: ", event.loaded, " байт");
			console.log("Cостояние запроса: ", xhr.readyState);
			console.log("Ответ сервера получен");
		}		

		// обработчик ответа сервера
		xhr.onload = function() {
			document.querySelector("#content").innerHTML = xhr.response; 
			console.log("Скрипт закончил работу");
		};

		xhr.send();	
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
