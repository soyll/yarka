<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>

	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// инициализируем объект 
		xhr.open('GET', 'server.php');

		// отправка запроса
		xhr.send();	

		// сработает после получения ответа сервера
		xhr.onload = function() {
	 		// выведем список полученных от сервера заголовков 		
			console.info ("Список полученных заголовков:");
			console.log (xhr.getAllResponseHeaders());
		};
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
