<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>

	<script>
		// создаём и инициализируем объект XMLHttpRequest
		let xhr = new XMLHttpRequest();
		xhr.open('GET', 'server.php');
		
		// тестируем изменения в состоянии объекта запроса  
		xhr.onreadystatechange = function () {
			if (xhr.readyState == 0) {
    			console.log("Исходное состояние");
  			}

 			if (xhr.readyState == 1) {
    			console.log("Вызван метод open");
  			}

  			if (xhr.readyState == 2) {
    			console.log("Получены заголовки ответа");
  			}

  			if (xhr.readyState == 3) {
    			console.log("Ответ в процессе передачи (данные частично получены)");
  			}

  			if (xhr.readyState == 4) {
    			console.log("Запрос завершён");
  			}
		}
	
		// обработчик ответа сервера
		xhr.onload = function() {	
			console.log("Скрипт закончил работу");
		};
		
		xhr.send();	
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
