<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>

	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// инициализируем объект 
		xhr.open('GET', 'server.php');

		// 1. будем передавать данные PDF
		xhr.setRequestHeader('Content-Type', 'application/pdf');
		
		// 2. будем передавать данные JSON
		// xhr.setRequestHeader('Content-Type', 'application/json');
		
		// 3. будем передавать данные urlencoded
		// xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

		// отправка запроса
		xhr.send();	

		// сервер вернет информацию о типе пересылаемых данных
		xhr.onload = function() {
			// вывод ответа сервера
			console.log(xhr.response);
		};
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
