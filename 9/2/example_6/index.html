<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<div id="content"><!-- место для вставки контента --></div>

	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// инициализируем объект 
		xhr.open('GET', 'server.php');

		// по умолчанию тип ответа text
		// но можно указать явно
		xhr.responseType = "text";		

		// отправка запроса
		xhr.send();	

		// сработает после получения ответа сервера
		xhr.onload = function() {
			// анализируем HTTP-статус ответа
			// если статус не 200, то произошла ошибка
  			
  			if (xhr.status != 200) { 
    			// выводим статус и текстовое сообщение ошибки
    			alert(`Ошибка ${xhr.status}: ${xhr.statusText}`); 
			
			// если status==200 (ОК) выводим результат
  			} else { 
     			// вывод дополнительной информации в консоль
				console.log (`Объем полученной информации - ${xhr.response.length} байт`); 
     			
     			// в свойстве response - тело ответа сервера
				let resp = xhr.response;

				// вставляем строку в документ
				document.querySelector("#content").innerHTML = resp; 			
  			}
		};
	</script>	
		
    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
