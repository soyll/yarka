<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<div id="content"><!-- место для вставки контента --></div>
	
	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// инициализируем объект 
		xhr.open('GET', 'server.php');

		// отправка запроса
		xhr.send();	

		// сработает после получения ответа сервера
		xhr.onload = function() {
	 		
	 		// получим из ответа сервера формат присылаемых данных
	 		let type = xhr.getResponseHeader('Content-Type');
			
			// в зависимости от формата обработаем полученные данные
			if (type.includes('application/json')) {
				
				// если ответ - JSON строка 
				// распарсим ответ и вставим данные объекта в выходное сообщение
				let obj = JSON.parse(xhr.response);
				out = `<h2 style="color:red">Вы зашли на сайт как ${obj.user} (${obj.login})</h2>`;
			} else {
				
				// если ответ - простая строка 
				// обернем ответ тегом h2
				out = "<h2>" + xhr.response + "</h1>";
			}

			// вставляем строку в документ
			document.querySelector("#content").innerHTML = out; 
		};
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
