<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// вывод объекта в консоль
		console.log(xhr); // XMLHttpRequest

		// инициализируем объект 
		xhr.open('GET', 'http://js/server.php');

		// отправка запроса
		xhr.send();
		
		// происходит когда запрос не может быть выполнен
		xhr.onerror = function() {
			// вывод сообщения
			alert('Ошибка выполнения запроса');
		}	
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
