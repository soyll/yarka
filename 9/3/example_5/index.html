<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<script>
		let xhr = new XMLHttpRequest();
		xhr.open ("POST", "server.php");
		
		// тип передаваемых данных
		xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

		// определим объект с данными о товаре
		let order = {
			id : 1,
			title : "Утепленная стеганая куртка",
			brand : "MARCO DI RADI",
			colour : "Синий",
			country : "Китай",
			hood : "Есть",
			size : "52",
			price : 25.590,
			image : "steganaya-marco.jpg"
		};

		// определим объект с данными о пользователе
		let user = {
			name : "Денис",
			login : "DenisDream",
			email : "denis-dream@gmail.com"
		};
		
		// упаковываем заказ в JSON формат
		JSONorder = JSON.stringify(order);

		// упаковываем пользователя в JSON формат
		JSONuser = JSON.stringify(user);

		// формируем строку для передачи на серввер
		// в качестве значений ключей используются строки JSON формата
		data = `order=${JSONorder}&user=${JSONuser}`;

		// отправка запроса
		// к запросу добавляем тело сообщения
		xhr.send(data);

		// сработает после получения ответа сервера
		xhr.onload = function() {
			console.log(xhr.response);
		} 
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
