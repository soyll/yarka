<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<form id="frm" onsubmit="return fnSubmit()">			
		<span>Логин:</span>
		<input type="text" name="login" value="DenisDream"><p>			
		<span>Пароль:</span>
		<input type="text" name="pwd" value="qwerty@"><p>
		<span>Прикрепите файл:</span><p>
		<input type="file" name="file"><p>
		<button>Отправить</button>
	</form>
	
	<script>
		function fnSubmit() {
			let xhr = new XMLHttpRequest();

			// при использовании FormData тип передаваемых данных указывать не надо
			// определим пустой объект FormData
			data = new FormData();
			
			// добавим к объекту FormData двоичный файл
			data.append("file", document.querySelector('[name="file"]').files[0])

			// добавим в адресную строку GET-параметры 
			$get = `?
				login=${document.querySelector('[name="login"]').value}&
				pwd=${document.querySelector('[name="pwd"]').value}`;

			// инициализируем объект
			xhr.open("POST", "server.php" + $get);

			// отправляем данные 
			// # GET - адресная строка 
			// # POST - тело сообщения
			xhr.send(data);

			// сработает после получения ответа сервера
			xhr.onload = function() {
				console.log(xhr.response);
			} 	
			return false;		
		}
	</script>
		
    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
