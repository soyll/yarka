<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<div id="content"><!-- место для вставки контента --></div>
	
	<script>
		// создаём объект XMLHttpRequest
		let xhr = new XMLHttpRequest();

		// определим объект с данными о товаре
		let order = {
			id : 1,
			title : "Утепленная стеганая куртка",
			brand : "MARCO DI RADI",
			colour : "Синий",
			country : "Китай",
			hood : "Есть",
			size : "52",
			price : 25.590,
			image : "steganaya-marco.jpg"
		};
		
		// упаковываем объект c данными для отправки
		JSONorder = JSON.stringify(order);

		// инициализируем объект XHR
		// JSON данные цепляем к адресной строке
		xhr.open('GET', 'server.php?data=' + JSONorder);

		// отправка запроса
		xhr.send();				

		// сработает после получения ответа сервера
		xhr.onload = function() {
			// анализируем HTTP-статус ответа
			// если статус не 200, то произошла ошибка
				
			if (xhr.status != 200) { 
				// выводим статус и текстовое сообщение ошибки
				alert(`Ошибка ${xhr.status}: ${xhr.statusText}`); 
			
			// если status==200 выводим результат
			} else { 
				console.log(`Готово, получили ${xhr.response.length} байт`); 

				document.querySelector("#content").innerHTML = xhr.response; 
			}
		};
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
