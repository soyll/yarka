<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header align="center">
		<h1>Асинхронный JavaScript</h1>
	</header>
	
	<div id="content"><!-- место для вставки контента --></div>

	<script>
		// создаём новый XMLHttpRequest-объект
		let xhr = new XMLHttpRequest();
		
		let user = 'admin';
		let pwd = '12345';

		// инициализируем объект с указанием имени и пароля пользователя
		xhr.open('GET', 'server.php', true, user, pwd);

		// отправка запроса
		xhr.send();	

		// сработает после получения ответа сервера
		xhr.onload = function() {
	 				
			// ответ парсится автоматически
			let resp = xhr.response;
			
			// вставляем строку в документ
			document.querySelector("#content").innerHTML = resp; 
		};
	</script>

    <footer align="center">
        <h3>Разработка асинхронных приложений на JavaScript</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>
</body>
</html>
