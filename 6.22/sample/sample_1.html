<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анимированный многоугольник</title>
    <style>
      .container {
        display: grid;
        justify-content: center;
        place-items: center;
        height: 500px;
      }
      .block {
        width: 300px;
        height: 300px;
        margin: 10px auto;
        background: radial-gradient(rgb(81, 5, 116), rgb(211, 150, 239));
        clip-path: polygon(
          50% 0%,
          60% 40%,
          100% 50%,
          60% 60%,
          50% 100%,
          40% 60%,
          0% 50%,
          40% 40%
        );
        animation: 4s poly infinite alternate ease-in-out;
      }

      @keyframes poly {
        from {
          clip-path: polygon(
            50% 0%,
            60% 40%,
            100% 50%,
            60% 60%,
            50% 100%,
            40% 60%,
            0% 50%,
            40% 40%
          );
        }

        to {
          clip-path: polygon(
            50% 30%,
            100% 0%,
            70% 50%,
            100% 100%,
            50% 70%,
            0% 100%,
            30% 50%,
            0% 0%
          );
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
        <h1>Используем правило @keyframes для анимации контура обрезки между двумя полигонами.</h1>
      <div class="block"></div>
    </div>
    <div class="container">
        <h1>Заменим блок на изображение</h1>
      <img src="dream.jpg" class="block"></ш>
    </div>
  </body>
</html>
