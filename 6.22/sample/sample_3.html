<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анимированный круг</title>
    <style>
      .container {
        display: grid;
        justify-content: center;
        place-items: center;
        height: 500px;
      }
   .circle {
        width: 300px;
        height: 300px;
        margin: 10px auto;
        background: radial-gradient(rgb(81, 5, 116), rgb(211, 150, 239));
        animation: 2s infinite alternate circle;
      }

    @keyframes circle {
      from {
        clip-path: circle(0%);
      }
      to {
        clip-path: circle(120px);
      }
    }

    </style>
  </head>
  <body>
    <div class="container">
        <h1>Используем правило @keyframes для анимации контура обрезки между двумя полигонами.</h1>
      <div class="circle"></div>
    </div>
    <div class="container">
        <h1>Заменим блок на изображение</h1>
      <img src="php.png" class="circle"></ш>
    </div>

  </body>
</html>
