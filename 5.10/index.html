<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Picture — адаптивное изображение</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			font-family: Arial, sans-serif;
			background: #e8f4e8;
			text-align: center;
		}
		picture,
		img {
			max-width: 100%;
			height: auto;
			display: block;
			margin: 0 auto;
		}
	</style>
</head>
<body>
	<h1>Адаптивное изображение (picture)</h1>
	<picture>
		<source media="(max-width: 200px)" srcset="image/port-small-chameleon-image.jpg">
		<source media="(max-width: 400px)" srcset="image/port-medium-chameleon-image.jpg">
		<source media="(max-width: 600px) and (orientation: portrait)" srcset="image/port-large-chameleon-image.jpg">
		<source media="(max-width: 600px) and (orientation: landscape)" srcset="image/land-small-chameleon-image.jpg">
		<source media="(max-width: 800px)" srcset="image/land-medium-chameleon-image.jpg">
		<img src="image/land-large-chameleon-image.jpg" alt="Хамелеон">
	</picture>
</body>
</html>
