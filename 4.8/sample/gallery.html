<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>Муниципальный район "Печора"</title>
	<link href="style/style.css" rel="stylesheet" type="text/css">
	<link rel="stylesheet" href="fa/css/font-awesome.css">
</head>
<body>
	<header>
		<div>
			<h1>Муниципальный район "Печора"</h1>
			<h2>Неофициальный портал</h2>
			<hr>
			<h3>Печора - душа республики</h3>
		</div>
	</header>
	<div class="wrapper">
		<nav>
			<a href="index.html">Главная страница</a> |
			<a href="gallery.html">Галерея </a>|
			<a href="history.html">Из истории</a> |
			<a href="chronicle.html">Летопись</a> |
			<a href="feedback.html">Обратная связь</a>
		</nav>
		<div class="content">
			<h1>Галерея</h1>
			<div class="row">
				<div class="col-12">Весенние пейзажи</div>
				<div class="container_slider time">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/1.jpg" alt="Весенний пейзаж 1">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/2.jpg" alt="Весенний пейзаж 2">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/3.jpg" alt="Весенний пейзаж 3">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/4.jpg" alt="Весенний пейзаж 4">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/5.jpg" alt="Весенний пейзаж 5">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/6.jpg" alt="Весенний пейзаж 6">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/7.jpg" alt="Весенний пейзаж 7">
					<img class="time_slider" src="media/image/gallery_image/pechora_springtime/8.jpg" alt="Весенний пейзаж 8">
				</div>

				<div class="col-12">Летние пейзажи</div>
				<div class="container_btn">
					<input type="radio" name="summer" id="sum1" checked>
					<input type="radio" name="summer" id="sum2">
					<input type="radio" name="summer" id="sum3">
					<input type="radio" name="summer" id="sum4">
					<div class="labels">
						<label for="sum1">1</label>
						<label for="sum2">2</label>
						<label for="sum3">3</label>
						<label for="sum4">4</label>
					</div>
					<div class="container_slider click">
						<div class="click_line">
							<img src="media/image/gallery_image/pechora_summer/1.jpg" alt="Летний пейзаж 1">
							<img src="media/image/gallery_image/pechora_summer/2.jpg" alt="Летний пейзаж 2">
							<img src="media/image/gallery_image/pechora_summer/3.jpg" alt="Летний пейзаж 3">
							<img src="media/image/gallery_image/pechora_summer/4.jpg" alt="Летний пейзаж 4">
						</div>
					</div>
				</div>

				<div class="col-12">Осенние пейзажи</div>
				<div class="container_arrow">
					<input type="radio" class="slide_img" name="autumn_slide" id="aut_1" checked>
					<input type="radio" class="slide_img" name="autumn_slide" id="aut_2">
					<input type="radio" class="slide_img" name="autumn_slide" id="aut_3">
					<input type="radio" class="slide_img" name="autumn_slide" id="aut_4">
					<div class="slides" id="aut_i_1">
						<img src="media/image/gallery_image/pechora_autumn/1.jpg" alt="Осенний пейзаж 1">
					</div>
					<div class="slides" id="aut_i_2">
						<img src="media/image/gallery_image/pechora_autumn/2.jpg" alt="Осенний пейзаж 2">
					</div>
					<div class="slides" id="aut_i_3">
						<img src="media/image/gallery_image/pechora_autumn/3.jpg" alt="Осенний пейзаж 3">
					</div>
					<div class="slides" id="aut_i_4">
						<img src="media/image/gallery_image/pechora_autumn/4.jpg" alt="Осенний пейзаж 4">
					</div>
					<div id="arrow_next">
						<label for="aut_1"><i class="fa fa-angle-right" aria-hidden="true"></i></label>
						<label for="aut_2"><i class="fa fa-angle-right" aria-hidden="true"></i></label>
						<label for="aut_3"><i class="fa fa-angle-right" aria-hidden="true"></i></label>
						<label for="aut_4"><i class="fa fa-angle-right" aria-hidden="true"></i></label>
					</div>
					<div id="arrow_prev">
						<label for="aut_1"><i class="fa fa-angle-left" aria-hidden="true"></i></label>
						<label for="aut_2"><i class="fa fa-angle-left" aria-hidden="true"></i></label>
						<label for="aut_3"><i class="fa fa-angle-left" aria-hidden="true"></i></label>
						<label for="aut_4"><i class="fa fa-angle-left" aria-hidden="true"></i></label>
					</div>
				</div>
			</div>
		</div>
	</div>
	<footer>
		<div>
			<p>Материал взят из официальных источников:<br>pechoraonline.ru<br>ru.wikipedia.org</p>
		</div>
	</footer>
</body>
</html>
