<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Создание svg</title>
    <style>
        main {
            width: 80%;
            margin: 0 auto;
            font-size: 2rem;
            color: #333333;
        }

        h1 {
            text-align: center;
        }

        h2 {
            color: #fff;
        }

        section {
            background: linear-gradient(90deg, #ff5cf1, #b38ade, #66ebff);
            margin: 2rem;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Внедрение объектов. SVG</h1>

        <section>
            <h2>Иконки Bootstrap5</h2>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-windows" viewBox="0 0 16 16">
                <path d="M6.555 1.375 0 2.237v5.45h6.555zM0 13.795l6.555.933V8.313H0zm7.278-5.4.026 6.378L16 16V8.395zM16 0 7.33 1.244v6.414H16z"/>
            </svg>

            <div>Здесь будет ваша стандартная иконка</div>

            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="black" class="bi bi-windows" viewBox="0 0 16 16">
                <path d="M6.555 1.375 0 2.237v5.45h6.555zM0 13.795l6.555.933V8.313H0zm7.278-5.4.026 6.378L16 16V8.395zM16 0 7.33 1.244v6.414H16z"/>
            </svg>

            <div>Копия иконки с новыми настройками</div>
            
        </section>

        <section>
            <h2>Добавление svg и работа с блокнотом</h2>
            <div>Сюда добавьте код иконки, скопированный со стороннего сайта</div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="ag5_7_0-b3">
                <path fill="currentColor" d="M17.892 15.064a8 8 0 1 0-2.828 2.828l2.522 2.522a2 2 0 1 0 2.828-2.828zM11 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10"></path>
            </svg>
            <div>Здесь будет svg-файл</div>
        </section>
        </section>

    </main>

</html>
