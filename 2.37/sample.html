<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Создание svg</title>
  <style>
    main {
      width: 80%;
      margin: 0 auto;
      font-size: 2rem;
      color: #333333;
    }

    h1 {
      text-align: center;
    }

    h2 {
      color: #fff;
    }

    section {
      background: linear-gradient(90deg, #ff5cf1, #b38ade, #66ebff);
      margin: 2rem;
      padding: 2rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Внедрение объектов. SVG</h1>

    <section>
      <h2>Иконки Bootstrap5. Стандартная иконка</h2>
      <div>
        <h3>Иконка изображения</h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-image"
          viewBox="0 0 16 16">
          <!-- путь в виде окружности - солнце -->
          <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />

          <!-- путь в виде рамки и гор -->
          <path
            d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
        </svg>
      </div>

      <div>
        <h3>Иконка изображения большего размера</h3>
        <!-- изменили настройки параметров ширины и высоты -->
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-image"
          viewBox="0 0 16 16">
          <!-- путь в виде окружности - солнце -->
          <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />

          <!-- путь в виде рамки и гор -->
          <path
            d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
        </svg>
      </div>

      <div>
        <h3>Иконка изображения без солнца</h3>
        <!-- изменили настройки параметров ширины и высоты -->
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-image"
          viewBox="0 0 16 16">
          <!-- путь в виде рамки и гор -->
          <path
            d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
        </svg>
      </div>

    </section>


  </main>
</body>

</html>
