<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FOOD & COFFEE</title>
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
	<header>
		<img src="images/logo.png" alt="Логотип" class="logo">
		<h1>FOOD & COFFEE</h1>
	</header>

	<div class="container">
		<div class="dishes">
			<div class="dish">
				<div class="info">
					<p class="dish-info-name">Пицца</p>
					<p class="dish-info-price">499 <span class="select">руб.</span></p>
					<p>Описание блюда.</p>
				</div>
				<div class="photo">
					<img src="images/pizza.jpg" alt="Пицца">
				</div>
			</div>
			<div class="dish">
				<div class="info">
					<p class="dish-info-name">Бургер</p>
					<p class="dish-info-price">349 <span class="select">руб.</span></p>
					<p>Описание блюда.</p>
				</div>
				<div class="photo">
					<img src="images/burger.jpg" alt="Бургер">
				</div>
			</div>
			<div class="dish">
				<div class="info">
					<p class="dish-info-name">Салат Цезарь</p>
					<p class="dish-info-price">299 <span class="select">руб.</span></p>
					<p>Описание блюда.</p>
				</div>
				<div class="photo">
					<img src="images/cesar.jpg" alt="Салат">
				</div>
			</div>
		</div>
	</div>

	<footer>
		<p>Контакты и адрес</p>
	</footer>
</body>

</html>
