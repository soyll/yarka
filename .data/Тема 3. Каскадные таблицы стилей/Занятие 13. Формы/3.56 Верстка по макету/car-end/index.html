<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <title>Индекс Драйв</title>
</head>

<body>
    <section class="search">
        <form action="booking.html" class="form_search">
            <h3 class="title_search">ПОИСК АВТО</h3>
            <select name="class">
                <option value="car_class" hidden>Класс автомобиля</option>
                <option value="econom">Эконом</option>
                <option value="premium">Премиум</option>
            </select>
            <input type="text" list="car_brand" placeholder="Введите марку авто">
            <datalist id="car_brand">
                <option value="TOYOTA">
                <option value="VOLKSWAGEN">
                <option value="NISSAN">
                <option value="MERCEDES-BENZ">
                <option value="MITSUBISHI">
            </datalist>
            <input type="text" placeholder="Введите модель авто">
            <input type="submit" class="search_submit" value="Поиск">
        </form>
    </section>
</body>

</html>
