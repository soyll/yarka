<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка субтитров</title>
    <style>
        section {
            border: 3px solid #333;
            font-size: larger;
            border-radius: 10px;
            padding: 2%;
            margin-top: 2%;
        }

        video::cue {
            font-style: italic;
            color: red;
        }
    </style>
</head>

<body>

    <section>
        <h1>Правая или левая? </h1>

        <p>Смешная реклама, основанная на любимом утверждении бренда о том, что палочки Twix разные, но в тоже время
            одинаковые.</p>

        <!-- место для видео -->
        <video controls>
            <source src="media/sample.mp4" type="video/mp4" />
            <track label="Rus subtitles" kind="subtitles" srclang="ru" src="media/sample.vtt" default="" />
        </video>

    </section>


</body>

</html>
