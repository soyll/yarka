<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Элементы формы</title>

</head>

<body>
  <main>
    <h1>Элементы формы</h1>

    <section>
      <h3>Группировка элементов</h3>
      <form>
        <label for="fiedset">
          Визуально объединяем любые элементы формы.
          Добавляем границу и подпись к группе.
        </label>
        <fieldset id="fieldset">
          <legend>Группа кнопок</legend>
          <button>Первая</button>
          <button>Вторая</button>
          <button>Третья</button>
        </fieldset>
      </form>
    </section>


    <section>
      <h3>Поле для ввода текста</h3>
      <form>
        <label for="textarea">
          По умолчанию для textarea задается размер значениями cols="30"
          rows="10". Но вы можете вручную перетащить границы поля на
          странице. Запретить изменение размера можно через свойства css.
          Для элемента также доступны возможности автофокуса, подсказки
          пользователю в виде placeholder, ограничения на ввод и т.д.
        </label>
        <textarea name="textarea" id="textarea" cols="30" rows="10"></textarea>

        <label for="textarea-spellcheck">
          Отключили проверку орфографии введенного пользователем текста.
        </label>
        <textarea name="textarea-spellcheck" id="textarea-spellcheck" cols="30" rows="10" spellcheck="false"></textarea>
      </form>
    </section>


    <section>
      <h3>Элемент progress</h3>
      <form>

        <label for="progress">
          С помощью элемента отображаем процент выполнения чего-либо.
          Значение min для элемента всегда 0. Поэтому в атрибутах указываем
          только максимальное и текущее значения.
        </label>
        <progress id="progress" max="100" value="70"> 70% </progress>

        <label for="progress">
          А вот что произойдет, если текущее значение не указать.
        </label>
        <progress id="progress" max="100"> </progress>

      </form>
    </section>

  </main>
</body>

</html>
