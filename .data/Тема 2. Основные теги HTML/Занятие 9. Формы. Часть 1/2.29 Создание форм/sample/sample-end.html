<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Заявка на обучение</title>
</head>

<body>
	<h1>Добро пожаловать на курс HTML&CSS</h1>
	<h2>Перед переходом на следующий уровень, хотим получить обратную связь.</h2>

	<form name="info">

		<div>
			<label for="select">Оцените свой уровень владения языком HTML</label>
			<select name="select" id="select">
				<option value="start">начальный</option>
				<option value="jun">средний</option>
				<option value="middle">продвинутый</option>
			</select>
		</div>

		<div>
			<label for="select-group">Выберите из перечисленных урок, который вам понравился больше всего</label>
			<select name="select-group" id="select-group">
				<optgroup label="Прошедшие уроки">
					<option value="less-1-7">Занятие 1-7. Emmet.</option>
					<option value="less-2-7">Занятие 2-7. Виды верстки</option>
					<option value="less-2-16">Занятие 2-16. Таблицы</option>
				</optgroup>
				<optgroup label="Будущие уроки" disabled>
					<option value="less-n-1">Валидация форм</option>
					<option value="less-n-2">Внедрение элементов</option>
				</optgroup>
			</select>
		</div>

		<div>
			<label for="progress">
				Укажите, какой процент заданий курса вы выполнили?
			</label>
			<progress id="progress" max="100"></progress>

		</div>

		<h2>Поделитесь своим мнением о нашем курсе.</h2>

		<div>
			<label for="datalist">Выберите из предложенного или внесите свой вариант</label>

			<input type="text" list="datalist">
			<datalist id="datalist">
				<option value="5 звезд">Хороший курс</option>
				<option value="6 звезд">Замечательный курс</option>
				<option value="7 звезд">Просто потрясающий курс</option>
			</datalist>
		</div>

		<textarea name="textarea" id="textarea" cols="40" rows="10">Расскажите нам о себе ...</textarea>

		<div id="fieldset">
			<button type="submit">Отправить</button>
			<button type="reset">Очистить</button>
		</div>

	</form>
</body>

</html>
