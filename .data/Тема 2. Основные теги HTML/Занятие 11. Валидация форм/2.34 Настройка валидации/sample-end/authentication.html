<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>

<body>
    <header>
        <h1>Вход</h1>
    </header>
    <div>
        <form action="account.html">

            <div>
                <label for="tel">Телефон (цифры,"+"; от 11 до 12 символов)</label>
                <input type="tel" id="tel" placeholder="Введите номер телефона" pattern="[0-9\+]{11,12}" required>
            </div>

            <div>
                <label for="password">Пароль (латиница, цифры; от 8 до 15 символов)</label>
                <input type="password" id="password" placeholder="Введите пароль" pattern="[A-Za-z0-9]{8,15}" required>
            </div>

            <div>
                <input type="checkbox" id="checkbox">
                <br>
                <label for="checkbox">Запомнить пароль</label>
            </div>


            <!-- С точки зрения валидности, не совсем правильно помещать в качестве содержимого ссылки input.
                Но пока мы с вами использовать скрипты и прочие блага цивилизации
                для настройки взаимодействия с кнопками не умеем, поэтому глаза на эту ошибку закроем.
            -->

            <div>
                <input type="submit" value="Войти">
                <a href="registration.html"><input type="button" value="Зарегистрироваться"></a>
            </div>

        </form>
    </div>
</body>

</html>
