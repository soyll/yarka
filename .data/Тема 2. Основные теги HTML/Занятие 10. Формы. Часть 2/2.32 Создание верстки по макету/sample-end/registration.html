<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <header>
        <h1>Регистрация</h1>
    </header>
    <div>
        <form action="account.html">

            <div>
                <label for="name">Имя</label>
                <input type="text" id="name" placeholder="Введите имя">
            </div>

            <div>
                <label for="email">Электронная почта</label>
                <input type="email" id="email" placeholder="Введите email">
            </div>

            <div>
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>

            <div>
                <label for="password-rep">Подтверждение пароля</label>
                <input type="password" id="password-rep" placeholder="Повторно введите пароль">
            </div>

            <div>
                <input type="checkbox" id="checkbox">
                <label for="checkbox">Запомнить пароль</label>
            </div>

            <div>
                <input type="submit" value="Зарегистрироваться">
                <a href="authentication.html"><input type="button" value="Войти"></a>
            </div>
        </form>
    </div>
</body>
</html>
