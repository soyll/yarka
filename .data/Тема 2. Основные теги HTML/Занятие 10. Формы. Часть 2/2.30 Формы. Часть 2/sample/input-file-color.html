<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементы формы. Input</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Элементы формы. Input</h1>
      <h2>
        Вызов стандартных окон выбора. File. Color.
      </h2>

      <section>
        <form>
          <h3>Выбор файла</h3>
          <label for="file">
            Вызываем стандартное окно выбора файла нажатием на элемент.
          </label>
          <input id="file" type="file">

          <label for="file-text">
            Ограничиваем возможность выбора файлов. Доступны только текстовые документы. 
          </label>
          <input id="file-text" type="file" accept=".doc,.docx">

        </form>
      </section>

      <section>
        <form>
          <h3>Выбор цвета</h3>
          <label for="color">
            Вызываем стандартное окно выбора цвета нажатием на элемент.
          </label>
          <input id="color" type="color">
        </form>
      </section>
    </main>
  </body>
</html>
