<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Элементы формы. Input</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Элементы формы. Input.</h1>
      <h2>
        E-mail. Password. Tel. Url.<br>Варианты input, необходимые для <br>регистрации и авторизации пользователя.
      </h2>

      <section>
        <h3>Поле для ввода email: input type="email"</h3>
        <form>
            <label for="email">
              Обратите внимание, что при клике на поле открывается список уже
              вводимых ранее адресов. Еще одной особенностью поля являются
              возможности встроенной проверки его содержимого. Об этом подробнее
              поговорим на следующем занятии.
            </label>
            <input id="email" type="email">

        </form>
      </section>


      <section>

        <h3>Поле для ввода пароля: input type="password"</h3>
        
        <form>

            <label for="password">
              Все символы внутри поля заменяют звездочками, при этом при
              отправке формы отправятся введенные пользователем данные.
            </label>
            <input id="password" type="password">

        </form>

      </section>
      
      <section>
          <h3>Поле для ввода телефона: input type="tel"</h3>

          <form>

            <label for="tel">
              Встроенной валидации для этого поля нет, потому что формат записи номера телефона отличается в разных странах.
            </label>
            <input id="tel" type="tel">

        </form>

      </section>

      <section>
        <h3>Поле для ввода ссылки: input type="url"</h3>

        <form>
          <label>
            Используя это поле, следует объяснить пользователю вид и формат
            вводимых данных, желательно привести пример.
          </label>
          <input id="url" type="url" placeholder="http://example.com" style="width:300px;">
        </form>
      </section>
    </main>
  </body>
</html>
