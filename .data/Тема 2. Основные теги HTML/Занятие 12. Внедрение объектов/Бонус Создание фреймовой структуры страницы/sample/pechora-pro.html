<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pechora-PRO</title>
</head>

<!--содержимое страницы делится на две строки: высота первой-70, вторая занимает все остальное пространство-->
<frameset rows="70,*" noresize>

    <!--первая строка содержит один столбец на всю ширину страницы-->
    <frameset cols="*">
        <!--содержимое фрэйма - страница pechora-pro-nav.html-->
        <frame name="topFrame" src="pechora-pro-nav.html">
    </frameset> <!--конец первой строки-->

    <!--вторая строка содержит два столбца: первый шириной 300, второй занимает все остальное пространство-->
    <frameset cols="300,*">
        <!--содержимое первого столбца - страница pechora-pro-sidebar.html-->
        <frame name="leftFrame" noresize src="pechora-pro-sidebar.html">
        
        <!--фрэйм используется для отображения содержимого ссылок из левого фрэйма-->    
        <frame name="startFrame" src="html-css.html">
    </frameset> <!--конец второй строки-->
</frameset> <!--конец фрэймовой структуры-->

</html>
