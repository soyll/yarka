<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Создание svg</title>
    <style>
        main {
            width: 80%;
            margin: 0 auto;
            font-size: 2rem;
            color: #333333;
        }

        h1 {
            text-align: center;
        }

        h2 {
            color: #fff;
        }

        section {
            background: linear-gradient(90deg, #ff5cf1, #b38ade, #66ebff);
            margin: 2rem;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Внедрение объектов. SVG</h1>

        <section>
            <h2>Иконки Bootstrap5</h2>
            <div>Здесь будет ваша стандартная иконка</div>
            <div>Копия иконки с новыми настройками</div>
        </section>

        <section>
            <h2>Добавление svg и работа с блокнотом</h2>
            <div>Сюда добавьте код иконки, скопированный со стороннего сайта</div>
            <div>Здесь будет svg-файл</div>
            <div>Он же но в виде svg-элемента</div>
        </section>
        </section>

    </main>
</body>

</html>
