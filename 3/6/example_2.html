<body>
	<header>
		<h1 align = "center">JSON представление данных</h1>
	</header>
	
	<script>
		// определение JS-объекта
		let personJS = {
			surname : "Бородина", 
			name : "Ксения", 
			patronymic : "Алексеевна", 
			post : "Преподаватель"
		};
		
		// определение JSON-объекта		
		// для записи в несколько строк используем обратные кавычки
		let personJSON = `
		{
			"surname": "Бородина", 
			"name": "Ксения", 
			"patronymic": "Алексеевна", 
			"post": "Преподаватель"
		}`;
	</script>
