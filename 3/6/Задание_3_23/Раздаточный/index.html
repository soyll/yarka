<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="product.js"></script>
	<style>
		.wrapper {
			display: flex;
			justify-content: space-around;
			width: 80%;
			margin: 0 auto;
		}

		.card {
			width: 30%;
			padding: 1% 0;
			border: 1px solid lightgray;
			border-radius: 10px;
			box-shadow: 5px 5px 10px lightgray;
		}

		img {
			display: block;
			width: 60%;
			margin: 2% auto;
		}

		span {
			display: block;
			margin-left: 7%;
			margin-bottom: 1%;
		}

		hr {
			border: 1px solid lightgray;
		}
	</style>
</head>

<body>
	<header>
		<h1 align = "center">JSON представление данных</h1>
	</header>
	
	<div id="content"></div>
	
	<footer align = "center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>

	<script>
		let products = JSON.parse(productJSON);

		let html = '<div class="wrapper">';

		for (let i = 0; i < products.length; i++) {
			let p = products[i];
			html += `
				<div class="card">
					<img src="images/${p.image}">
					<hr>
					<span><b>Название:</b> ${p.title}</span>
					<span><b>Бренд:</b> ${p.brand}</span>
					<span><b>Цвет:</b> ${p.color}</span>
					<span><b>Страна:</b> ${p.country}</span>
					<span><b>Капюшон:</b> ${p.hood}</span>
					<span><b>Размер:</b> ${p.size}</span>
					<span><b>Цена:</b> ${p.price} руб.</span>
				</div>
			`;
		}

		html += '</div>';
		document.getElementById("content").innerHTML = html;
	</script>

</body>
</html>
