<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.wrapper { 
			width: 80%; 
			margin: 15% auto; 
			display: flex;
		}
		.player { 
			width: 50%; 
			padding: 50px; 
			background-color: #A6E3E9; 
			margin-right: 10px 
		}
		input { 
			display: block; 
			width: 80%; 
			margin: 10px auto; 
			height: 3vh; 
			background-color: #fff; 
			text-align: center; 
			font-size: 24px; 
		}
		.cubes { 
			display: flex; 
			padding-top: 30px 
		}
		img { width: 33% }
	</style>
</head>
<body>
	<header>
		<h1 align = "center">Объект Math</h1>
	</header>

	<div class="wrapper">
		<div class="player">
			<input type="text" name="gamerName" disabled>
			<input type="text" name="gamerCount" disabled>
			<div class="cubes">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
			</div>
		</div>

		<div class="player">
			<input type="text" name="gamerName" disabled>
			<input type="text" name="gamerCount" disabled>
			<div class="cubes">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
			</div>
		</div>
	</div>

	<script>
		// объект для записи данных игроков
		let game = {
			gamer1: {
				name: "",
				count: undefined
			},
			gamer2: {
				name: "",
				count: undefined
			}
		}

		game.gamer1.name = prompt("Имя первого игрока", "Игрок 1");
		game.gamer2.name = prompt("Имя второго игрока", "Игрок 2");

		let players = document.querySelectorAll(".player");

		let imgs1 = players[0].querySelectorAll("img");
		let sum1 = 0;
		for (let i = 0; i < 3; i++) {
			let n = Math.ceil(Math.random() * 6);
			imgs1[i].src = n + ".png";
			sum1 = sum1 + n;
		}
		game.gamer1.count = sum1;

		let imgs2 = players[1].querySelectorAll("img");
		let sum2 = 0;
		for (let i = 0; i < 3; i++) {
			let n = Math.ceil(Math.random() * 6);
			imgs2[i].src = n + ".png";
			sum2 = sum2 + n;
		}
		game.gamer2.count = sum2;

		players[0].querySelector("[name=gamerName]").value = game.gamer1.name;
		players[0].querySelector("[name=gamerCount]").value = game.gamer1.count;
		players[1].querySelector("[name=gamerName]").value = game.gamer2.name;
		players[1].querySelector("[name=gamerCount]").value = game.gamer2.count;
	</script>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>	
</body>
</html>
