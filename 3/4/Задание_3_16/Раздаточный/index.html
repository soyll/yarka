<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="data.js"></script>
	<style>
		* {
			text-align: center;
			font-size: 24px;
		}
		div {
			margin: 0 auto;
			width: 80%;
		}
		img {
			width: 700px;
		}
		p {
			font-weight: bold;
		}
		ul {
			padding-left: 0;
			list-style-position: inside;
		}
		li {
			list-style-type: none;
		}
	</style>
</head>

<body>
	<header>
		<h1 align = "center">Объект Math</h1>
	</header>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>
	
	<script>
		let min = prompt("Нижняя граница", "0");
		let max = prompt("Верхняя граница", "9");
		min = +min;
		max = +max;

		let num = Math.floor(Math.random() * (max - min + 1)) + min;
		let film = data[num];

		let heroes = "";
		for (let i = 0; i < film.heroes.length; i++) {
			heroes = heroes + "<li>" + film.heroes[i] + "</li>";
		}

		let div = document.createElement("div");
		div.innerHTML = "<h1>Название: " + film.title + "</h1>" +
			"<img src=\"images/" + film.img + "\">" +
			"<p>Год выпуска: " + film.year + "</p>" +
			"<p>Страна: " + film.country + "</p>" +
			"<p>Актеры:</p>" +
			"<ul>" + heroes + "</ul>";
		document.body.insertAdjacentElement("afterbegin", div);
	</script>	

</body>
</html>
