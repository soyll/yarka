 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="data.js"></script>
	<style>
		* {
			text-align: center;
			font-size: 24px;
		}
		div {
			margin: 0 auto;
			width: 80%;
		}
		img {
			width: 700px;
		}
		p {
			font-weight: bold;
		}
		ul {
			padding-left: 0;
			list-style-position: inside;
		}
		li {
			list-style-type: none;
		}
	</style>
</head>

<body>
	<header>
		<h1 align = "center">Объект Math</h1>
	</header>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>
	
	<script>
	let min = parseInt(prompt("Нижняя граница интервала (от 0 до 9):", "0"));
    let max = parseInt(prompt("Верхняя граница интервала (от 0 до 9):", "9"));

    let randomIndex = Math.floor(Math.random() * (max - min + 1)) + min;
    let film = data[randomIndex];
    document.write("<h1>Название: " + film.title + "</h1>");
    document.write("<img src='images/" + film.img + "'>");
    document.write("<p>Год выпуска: " + film.year + "</p>");
    document.write("<p>Страна: " + film.country + "</p>");
    document.write("<p>Актеры: </p>");
    
    document.write("<ul>");
    for (let i = 0; i < film.heroes.length; i++) {
        document.write("<li>" + film.heroes[i] + "</li>");
    }
    document.write("</ul>");
	</script>	

</body>
</html>
