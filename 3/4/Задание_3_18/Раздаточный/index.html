<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
	
<body>
	<header>
		<h1 align = "center">Объект Math</h1>
	</header>

	<script>
		let a = prompt("a", "2");
		let b = prompt("b", "9");
		let c = prompt("c", "5");
		a = +a;
		b = +b;
		c = +c;

		let d = b * b - 4 * a * c;
		let x1 = Math.round((-b + Math.sqrt(d)) / (2 * a));
		let x2 = Math.round((-b - Math.sqrt(d)) / (2 * a));

		console.log("d =", d);
		console.log("x1 =", x1);
		console.log("x2 =", x2);
	</script>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>		
</body>
</html>
