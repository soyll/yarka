 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	
	<script>
		// инициализация переменной
		let a = 11 / 3;

		// вывод исходного числа
		console.log("11 / 3 = ", a);
		
		// вывод округленных значений
		console.log(".ceil() - ", Math.ceil(a)); 
		console.log(".floor() - ", Math.floor(a)); 
	</script>	
	
</head>

<body>
	<header>
		<h1 align = "center">Объект Math</h1>
	</header>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>		
</body>
</html>
