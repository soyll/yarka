<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>

<body>
	<header>
		<h1 align = "center">Объект Date</h1>
	</header>

	<script>
		let days = ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
		let now = new Date();

		let dd = now.getDate();
		let mm = now.getMonth() + 1;
		let yyyy = now.getFullYear();

		if (dd < 10) dd = "0" + dd;
		if (mm < 10) mm = "0" + mm;

		let dayName = days[now.getDay()];

		let h2 = document.createElement("h2");
		h2.align = "center";
		h2.innerHTML = "Сегодня: " + dd + "-" + mm + "-" + yyyy + " (" + dayName + ")";
		document.querySelector("header").insertAdjacentElement("afterend", h2);
	</script>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>		
</body>
</html>
