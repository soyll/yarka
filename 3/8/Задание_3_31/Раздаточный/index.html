 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		img { width: 200px; vertical-align: middle; }
	</style>
</head>
<body>
	<header>
		<h1 align = "center">Объект RegExp. Метасимволы</h1>
	</header>
	
	<div id="block">
		<h2>Это мой дом, он уютный:</h2> {{img-0}}
		<h2>Это моя машина, она красная:</h2> {{pict-1}} <p>
		<h2>Это моя работа, она высокооплачиваемая:</h2> {{screen-2}} <p>
		<h2>Это моя яхта, она дорогая:</h2> {{pic-3}}
		<h2>Это я ...</h2> {{photo-4}}
	</div>	

	<script>
		let block = document.getElementById("block");
		block.innerHTML = block.innerHTML.replace(
			/\{\{[a-z]+-(\d+)\}\}/g,
			'<img src="img-$1.jpg">'
		);
	</script>

	<footer align = "center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>
</body>
</html>
