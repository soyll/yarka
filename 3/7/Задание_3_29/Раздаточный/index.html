 <!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="data.js"></script>
	<style>
		h3 {margin: 5px 0px}
		img { width: 250px; }
	</style>
</head>
<body>
	<header>
		<h1 align = "center">Объект RegExp. Регулярные выражения</h1>
	</header>

	<div id="console"></div>

	<footer align = "center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>			

	<script>
		let re = /.*AC\/DC.*/;
		let line = data.match(re)[0];
		let fields = line.split(";");

		document.getElementById("console").innerHTML = `
			<h2>${fields[1]}</h2>
			<img src="${fields[6]}">
			<h3>Страна: ${fields[3]}</h3>
			<h3>Год основания: ${fields[4]}</h3>
			<h3>Жанр: ${fields[5]}</h3>
		`;
	</script>

</body>
</html>
