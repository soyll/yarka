 <!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<!-- подключаем темпераменты -->
	<script src="temp.js"></script>
	<style>
		.card {
			width: 70%;
			margin: 2% auto;
			padding: 1%;
			border-bottom: 1px solid lightgray;
		}
		img {
			width: 200px;
			display: block;
			margin: 1% 0;
		}
	</style>
</head>
<body>
	<header>
		<h1 align = "center">Объект RegExp. Регулярные выражения</h1>
	</header>
	
	<div id="content"></div>	

	<footer align = "center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>	

	<script>
		let map = {
			phl: "phlegmatic",
			san: "sanguine",
			cho: "choleric",
			mel: "melancholic"
		};

		temp = temp.replace(/\{\{img-(\w+)\}\}/g, function(match, key) {
			return "pict/" + map[key] + ".jpg";
		});

		let temps = JSON.parse(temp);

		let html = "";
		for (let i = 0; i < temps.length; i++) {
			html += `
				<div class="card">
					<h2>${temps[i].title}</h2>
					<img src="${temps[i].img}">
					<p>${temps[i].descr}</p>
				</div>
			`;
		}

		document.getElementById("content").innerHTML = html;
	</script>

</body>
</html>
