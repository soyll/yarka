<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>

<body>
	<header>
		<h1 align = "center">Работа со строками</h1>
	</header>
	
	<pre>
		<h3>
		Чтоб бранью сухой не встречали,
		Жилье огибаю, как трус, –
		И дале – и дале – и дале –
		Вдоль пыльной дороги влекусь.
		</h3>
	</pre>

	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>		

	<script>
		var str = document.querySelector("pre h3").innerText;

		console.log(str.indexOf("дале"));
		console.log(str.lastIndexOf("дале"));
		console.log(str.indexOf("дале", 70));
		console.log(str.lastIndexOf("дале", 70));

		let myStr = "кот ловил мышь, мышь ловила сыр, а сыр просто лежал";
		console.log("моя строка:", myStr);
		console.log("indexOf мышь:", myStr.indexOf("мышь"));
		console.log("lastIndexOf мышь:", myStr.lastIndexOf("мышь"));
		console.log("indexOf мышь с 15:", myStr.indexOf("мышь", 15));
	</script>

</body>
</html>
