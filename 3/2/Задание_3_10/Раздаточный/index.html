<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="teams.js"></script>
</head>

<body>
	<header>
		<h1 align = "center">Работа со строками</h1>
	</header>
	
	<footer>
		<h3 align = "center"><a href="https://vk.com/pechora_proger" target="blank">pechora_PROger</a></h3>
	</footer>	

	<script>
		let lines = teams.trim().split("\n");
		let scorpions = null;

		for (let i = 0; i < lines.length; i++) {
			if (lines[i].indexOf("Scorpions") !== -1) {
				scorpions = lines[i].split(";");
				break;
			}
		}

		console.log("id:", scorpions[0]);
		console.log("name:", scorpions[1]);
		console.log("slug:", scorpions[2]);
		console.log("country:", scorpions[3]);
		console.log("year:", scorpions[4]);
		console.log("genre:", scorpions[5]);
		console.log("img:", scorpions[6]);
	</script>

</body>
</html>
