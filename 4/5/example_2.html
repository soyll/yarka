<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<h2>Вложенные циклы</h2>

	<script>
		// внешний цикл for
		for (var i = 1; i < 4; i++) {
			
			// i - переменная внешнего цикла

			// внутренний цикл for
			for (var k = 1; k <= 10; k++) {
				
				// k - переменная внутреннего цикла

				// выводим произведение переменных i * k
				document.write(i + " * " + k + " = " + i * k, "<br/>" );
			}
			// вывод по завершении внутреннего цикла
			document.write("<hr><p>");
		}				
	</script>
	
	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>
</body>
</html>
