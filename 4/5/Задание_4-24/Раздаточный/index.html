<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="teams.js"></script>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<div id="con"></div>

	<script>
		let box = document.getElementById("con");
		let out = "";

		for (let i = 0; i < teams.length; i++) {
			let t = teams[i];

			let styles = "";
			for (let s = 0; s < t.style.length; s++) {
				styles += "#" + t.style[s] + " ";
			}

			let labels = "";
			for (let l = 0; l < t.label.length; l++) {
				labels += t.label[l];
				if (l < t.label.length - 1) labels += ", ";
			}

			let albums = "";
			for (let a = 0; a < t.albums.length; a++) {
				albums += `<li>${t.albums[a][0]} (${t.albums[a][1]})</li>`;
			}

			out += `
				<h3><a href="${t.link}" target="_blank">${t.name}</a> (id = ${t.id})</h3>
				Алиас: <b>${t.alias}</b><br>
				Страна: <b>${t.country}</b><br>
				Дата создания: <b>${t.date}</b><br>
				Описание: ${t.content}<br>
				Стили: ${styles}<br>
				Лейблы: ${labels}<br>
				<b>Альбомы:</b>
				<ul>${albums}</ul>
				<hr>
			`;
		}

		box.innerHTML = out;
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>
</body>
</html>
