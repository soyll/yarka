<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<h2>Вложенные циклы</h2>

	<script>
		// инициируем переменную внешнего цикла
		let i = 1;
		
		while (i < 5) {
			
			// инициируем переменную внутреннего цикла
			let k = 1;
			
			while (k <= 10) {
				// выводим произведение переменных i * k
				document.write(i + " * " + k + " = " + i * k, "<br/>" );
				k++; // инкремент внутренней переменной
			}
			// вывод по завершении внутреннего цикла
			document.write("<hr><p>");

			i++; // инкремент внешней переменной
		}				
	</script>
	
	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>
</body>
</html>
