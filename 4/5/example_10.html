<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<h2>Вложенные циклы</h2>
	
	<script>
		let user = {
			name: "John",
			login: "master",
			age: 30
		};
		// 
		console.log(user.name); // John
		console.log(user.login); // master
		
		console.log("----------");
		
		// динамическое формирование ключа 
		let key = "name";
		console.log(user.key); // undefined
	
		console.log(user[key]); // John
	</script>

	</footer>
</body>
</html>
