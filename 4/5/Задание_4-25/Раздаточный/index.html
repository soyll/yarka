<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="clothes.js"></script>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<div id="con"></div>

	<script>
		let box = document.getElementById("con");
		let html = "";

		for (let i = 0; i < clothes.length; i++) {
			let item = clothes[i];
			let name = "", brand = "", src = "";
			let list = "<ul>";

			for (let j = 0; j < item.length; j++) {
				let key = item[j][0];
				let val = item[j][1];

				if (key == "img") {
					src = val;
					continue;
				}
				if (key == "Название") name = val;
				if (key == "Бренд") brand = val;

				list += `<li>${key}: ${val}</li>`;
			}
			list += "</ul>";

			// title как на скрине: «Название: Бренд»
			html += list;
			html += `<img src="${src}" title="${name}: ${brand}" width="220"><hr>`;
		}

		box.innerHTML = html;
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>
</body>
</html>
