<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<link rel="stylesheet" href="style.css">
	<script src="data.js"></script>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<h2 align="center">Пассажиры</h2>

	<!-- блок для вставки контента -->
	<div id="passengers"></div>

	<script>
		let passengers = obj.data.items[0].passengers;
		let html = `
			<table>
				<tr>
					<th>ID</th>
					<th>Имя</th>
					<th>Дата рождения</th>
					<th>Номер документа</th>
				</tr>
		`;

		for (let i = 0; i < passengers.length; i++) {
			let p = passengers[i];
			html += `
				<tr>
					<td>${p.id}</td>
					<td>${p.last_name} ${p.first_name}</td>
					<td>${p.birth_date}</td>
					<td>${p.document_number}</td>
				</tr>
			`;
		}

		html += `</table>`;
		document.querySelector("#passengers").innerHTML = html;
	</script>
	
	<footer align="center">
		<h3>Верстка | Дизайн | Программирование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>		
</body>
</html>
