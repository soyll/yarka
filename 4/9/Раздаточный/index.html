<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<table class="booking">
		<tr>
			<th>Код бронирования</th>
			<th>Стоимость бронирования</th>
			<th>Рейсы</th>
			<th>Пассажиры</th>
		</tr>
	</table>

	<script>
		let table = document.querySelector(".booking");

		let msg = `
			<td> ... </td>
			<td> ... </td>
			<td><a href="flights.html">Подробнее...</a></td>
			<td><a href="passengers.html">Подробнее...</a></td>
		`;

		table.insertAdjacentHTML("beforeend", `<tr>${msg}</tr>`);
	</script>

	<footer align="center">
		<h3>Верстка | Дизайн | Программирование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>		
</body>
</html>
