<body>

	<script>
		console.log( 1 || 0 ); // 1
		console.log( true || 'also true' ); // true
		console.log( null || 1 ); // 1 (первое истинное значение)
		console.log( null || 0 || 'hello' ); // 1 (первое истинное значение)
