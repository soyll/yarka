<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>

	<script>
		let a = Number(prompt('a = '));
		let b = Number(prompt('b = '));
		let c = Number(prompt('c = '));

		let d = Math.pow(b, 2) - 4 * a * c;
		console.log('Дискриминант d =', d.toFixed(2));

		if (d > 0) {
			let x1 = (-b + Math.sqrt(d)) / (2 * a);
			let x2 = (-b - Math.sqrt(d)) / (2 * a);
			console.log('Уравнение имеет два корня.');
			console.log('x1 =', x1.toFixed(2));
			console.log('x2 =', x2.toFixed(2));
		} else if (d === 0) {
			let x = -b / (2 * a);
			console.log('Уравнение имеет один корень.');
			console.log('x =', x.toFixed(2));
		} else {
			console.log('Уравнение не имеет корней.');
		}
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
</body>
</html>
