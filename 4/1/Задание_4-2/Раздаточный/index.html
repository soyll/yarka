<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		input {margin:4px}
		span.label {display: inline-flex; width:75px;}
		span.valid {color:red;}
	</style>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>
	<form>
		<span class="label">Имя:</span> <input type="text" value="Денис" name="name"><span class="valid" id="name"></span><br>

		<span class="label">Логин:</span> <input type="text" value="DenisDream" name="login"><span class="valid" id="login"></span><br>
		
		<span class="label">Email:</span> <input type="email" value="denis@mail.com" name="email"><span class="valid" id="email"></span><br>
		
		<span class="label">Пароль:</span> <input type="password" value="master@@@" name="pwd"><span class="valid" id="pwd"></span><br>

	</form>
	
	<footer align = "center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>		

	<script>
		let f = document.forms[0];

		let reName = /^[а-яё]{3,10}$/;
		let reLogin = /^[a-z0-9]{3,10}$/;
		let reEmail = /^[a-z0-9]{3,10}@[a-z]{2,5}\.[a-z]{2,5}$/;
		let rePwd = /^[a-z_@#$%^&*0-9-]{5,15}$/;

		if (!reName.test(f.name.value)) {
			document.getElementById('name').textContent = 'только строчные кириллица, 3–10 символов';
		}
		if (!reLogin.test(f.login.value)) {
			document.getElementById('login').textContent = 'только a-z и цифры, 3–10 символов';
		}
		if (!reEmail.test(f.email.value)) {
			document.getElementById('email').textContent = 'формат login@domain.zone';
		}
		if (!rePwd.test(f.pwd.value)) {
			document.getElementById('pwd').textContent = 'не подходит под шаблон пароля';
		}

		// поправили значения, чтобы дальше проходили проверку
		f.name.value = 'денис';
		f.login.value = 'denis123';
		f.email.value = 'denis@mail.com';
		f.pwd.value = 'master@@@';
 	</script>

</body>
</html>
