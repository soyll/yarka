<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.wrapper { 
			width: 80%; 
			margin: 15% auto; 
			display: flex;
		}
		.player { 
			width: 50%; 
			padding: 50px; 
			background-color: #A6E3E9; 
			margin-right: 10px 
		}
		input { 
			display: block; 
			width: 80%; 
			margin: 10px auto; 
			height: 3vh; 
			background-color: #fff; 
			text-align: center; 
			font-size: 24px; 
		}
		.cubes { 
			display: flex; 
			padding-top: 30px 
		}
		img { width: 33% }
	</style>
</head>

<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>

	<div class="wrapper">
		<div class="player">
			<input type="text" name="gamerName" disabled>
			<input type="text" name="gamerCount" disabled>
			<div class="cubes">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
			</div>
		</div>

		<div class="player">
			<input type="text" name="gamerName" disabled>
			<input type="text" name="gamerCount" disabled>
			<div class="cubes">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
				<img src="1.png" alt="">
			</div>
		</div>
	</div>

	<script>
		let game = {
			gamer1: {
				name: "No name",
				count: undefined
			},
			gamer2: {
				name: "No name",
				count: undefined
			}
		}

		function askName(who) {
			let n;
			do {
				n = prompt('Имя игрока ' + who);
			} while (n === null || n.trim() === '');
			return n.trim();
		}

		function roll() {
			return Math.floor(Math.random() * 6) + 1;
		}

		game.gamer1.name = askName(1);
		game.gamer2.name = askName(2);

		let names = document.getElementsByName('gamerName');
		let counts = document.getElementsByName('gamerCount');
		let cubes1 = document.querySelectorAll('.player')[0].querySelectorAll('img');
		let cubes2 = document.querySelectorAll('.player')[1].querySelectorAll('img');

		let sum1 = 0, sum2 = 0;
		for (let i = 0; i < 3; i++) {
			let d1 = roll();
			let d2 = roll();
			sum1 += d1;
			sum2 += d2;
			cubes1[i].src = d1 + '.png';
			cubes2[i].src = d2 + '.png';
		}

		game.gamer1.count = sum1;
		game.gamer2.count = sum2;

		names[0].value = game.gamer1.name;
		names[1].value = game.gamer2.name;
		counts[0].value = game.gamer1.count;
		counts[1].value = game.gamer2.count;

		if (sum1 > sum2) {
			alert('Победил игрок ' + game.gamer1.name + '!');
		} else if (sum2 > sum1) {
			alert('Победил игрок ' + game.gamer2.name + '!');
		} else {
			alert('Ничья!');
		}
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
</body>
</html>
