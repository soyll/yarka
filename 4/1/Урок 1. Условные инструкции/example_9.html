 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>

	<div id="app"></div>
	
	<script>
		let msg = `
Напишите, кто вы по темпераменту: \n
- Флегматик
- Сангвиник 
- Холерик
- Флегматик
`;
		switch (prompt(msg)) {
		  case "Флегматик":
		    temp = '<h2>Флегматик</h2>В своей деятельности они всегда склонны к порядку и любят привычную для них обстановку. При этом флегматики с трудом воспринимают любые перемены. В своей деятельности они всегда доводят начатое ими дело до конца. Флегматики в меру общительны и отличаются устойчивым настроением. Спокойствие таких людей поражает. Их сложно вывести из себя или задеть эмоционально. Они умело уклоняются от ссор, не теряют чувства самообладания даже в критических стрессовых ситуациях.';
		    break;
		  case "Сангвиник":
		    temp = '<h2>Сангвиник</h2>Это крайне непоседливые, энергичные, легкие на подъем люди, которые очень любят движение. Сангвиникам присущи быстрая реакция, выразительная жестикуляция и мимика. Они очень похожи на холериков, но более уравновешены, готовы взяться за любую работу, но максимальный эффект будет лишь в том случае, когда она вызовет у них настоящий интерес. Люди с сангвиническим типом темперамента очень общительны, жизнерадостны, легко приспосабливаются к любой жизненной ситуации.';
		    break;
		  case "Холерик":
		    temp = '<h2>Холерик</h2>Холерики, по сравнению с сангвиниками, вспыльчивы, непостоянны, агрессивны и импульсивны. Несмотря на все вышесказанное, холерики, как правило, незлопамятны и очень отходчивы. Они способны выполнять любую работу, однако монотонность им быстро надоедает. Такие люди часто не доводят до логичного завершения начатую работу.';
		    break;
		  case "Меланхолик":
		    temp = '<h2>Меланхолик</h2>Достаточно ранимые, обидчивые и скрытые личности. Они склонны к глубоким переживаниям и грустным мыслям. Меланхоликам свойственны сдержанность, замедленная речь, движения, нерешительность, робость и смущение.';
		    break;
		  default:
		    temp = '<h2>Вы неврастеник! ;)</h2>';
		}

		document.querySelector("div#app").innerHTML = temp;
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>	
</body>
</html>
