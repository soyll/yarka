 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>
	
	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
	
	<script>
		// шаблон регулярного выражения RegExp
		var reg = /^[а-яё-]{3,25}$/i;

		// инициализируем переменную
		// var surname = "Бендер-Задунайский";
		var surname = prompt("Введите фамилию. Символы [а-яё-] в количестве от 3 до 25");

		// проверка соответствия вернет true или false
		var res = reg.test(surname);

		// если res == true
		if (res) {
			alert ("Вы успешно справились с заданием!");
		}  
	</script>

</body>
</html>
