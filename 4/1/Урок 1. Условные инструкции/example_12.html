 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="__blank">pechora_PRO</a>
	</footer>		

	<script>
		// 1 вариант, user - не объявлена
		
		/*
			2 вариант, user объявлена, но инициализирована пустой строкой
			var user = ""; // false
		*/
		
		/*
			3 вариант, user объявлена, и инициализирована строкой
			var user = "Denis"; // true
		*/

		if (user) {
			console.log('Привет, ' + user + '!');
		} else {
			console.log('Привет, гость!');
		}
	</script>

</body>
</html>
