<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>
		var maxNum = 10;
		var minNum = 1;

		// получение случайного числа
		// используем функции Math.random(), Math.floor()
		with (Math) {
			let maxNum = 5;
			float = random() * (maxNum - minNum + 1) + minNum;			
			num = floor(float) ;
		}
		
		// вывод расчетных значений
		console.log(float);
		console.log(num);
	</script>
