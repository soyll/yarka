<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>
	
	<script>	
		// представленный код вывел то, что отображено на рисунке задания,
		// почему такое могло случиться? 

		myFunction = () => {
			var name = 'John';
			console.log("Вызов переменной из функции:"); 
			console.log(name); // John
		};
		
		myFunction();

		console.log("Вызов переменной из глобальной области видимости:"); 
		// глобальная переменная в программе не объявлялась
		console.log(name);
	</script>

	</footer>
</body>
</html>
