<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>	
		var a = 1;
		b = 2;

		console.log("a = ", window.a); // 1
		console.log("b = ", window.b); // 2

		console.log("---------------");

		delete window.a; 
		delete window.b; // cвойство 'b' было удалено и больше не существует

		console.log("a = ", window.a); // 1
		console.log("b = ", window.b); // undefined
	</script>

</body>
