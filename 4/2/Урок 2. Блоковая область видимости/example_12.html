	<header>
		<h1 align="center">Управляющие конструкции</h1>

	<script>	
		var x = 5; // x через var
		let y = 5; // y через let
		
		// блок кода
		{
			var x = 10;
			let y = 10;
		}
		
		console.log("x через var = ", x); // 10
		console.log("y через let = ", y); // 5
	</script>
