<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>	
		// определение функции
		function fnTest() {
			y = 10; // y - глобальная 
			var x = 20; // x - уровня функции
		}
		// вызов функции
		fnTest();

		// проверяем переменные
		console.log("y = ", y); // 10
		console.log("x = ", x); // Uncaught ReferenceError: x is not defined
	</script>

	</footer>
</body>
</html>
