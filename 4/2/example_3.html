<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>	
		var outerFunction = function () {
			// внешняя переменная
			let outer = 'John';
			
			var innerFunction = function () {
				// внутренняя переменная
				let inner = 'Max';
				console.log('Значение внешней переменной: ' + outer);
			};
			
			// Uncaught ReferenceError: inner is not defined
			console.log('Значение внутренней переменной: ' + inner);  
			
			// вызов внутренней функции
			innerFunction(); 
		};
		
		// вызов внешней функции
		outerFunction(); 
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
