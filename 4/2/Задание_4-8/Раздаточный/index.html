<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<p id="explain"></p>
	
	<script>	
		// name в глобале — это window.name (строка вкладки браузера),
		// а var name внутри функции — локальная, снаружи её не видно

		myFunction = () => {
			var name = 'John';
			console.log("Вызов переменной из функции:"); 
			console.log(name); // John
		};
		
		myFunction();

		console.log("Вызов переменной из глобальной области видимости:"); 
		console.log(name);
		console.log('typeof name =', typeof name);

		document.getElementById('explain').textContent =
			'Снаружи name — это window.name (строка), локальный var name из функции сюда не протекает. Сейчас window.name = "' + name + '"';
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
