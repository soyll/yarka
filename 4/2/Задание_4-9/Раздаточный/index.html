<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="order.json"></script>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>
		order = JSON.parse(orderJSON);

		with (order) {
			with (student) {
				document.write('<h2>Студент: ' + name + ' (' + login + ')</h2>');
				document.write('<p>id: ' + id_student + ', тел: ' + phone + ', email: ' + email + ', статус: ' + status + '</p>');
			}
			document.write('<h3>Курсы</h3><ul>');
			for (let i = 0; i < courses.length; i++) {
				with (courses[i]) {
					document.write('<li>' + name + ' — ' + hours + ' ч., ' + price + ' руб. (сертификат: ' + certificate + ')</li>');
				}
			}
			document.write('</ul>');
			with (shop) {
				document.write('<p>Дата: ' + date + '</p>');
				document.write('<p>Сумма: ' + price + ', скидка: ' + discaunt + ', итог: ' + newprice + '</p>');
			}
		}
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
