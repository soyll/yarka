<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>	
		// определение первой функции
		function fnFirst () {
			const first = `I'm variable of fnFirst`;
			console.log(first);
		}
		
		// определение второй функции
		function fnSecond () {
			// вызов первой функции
			fnFirst();
			// пробуем получить доступ к переменной first
			console.log(first); // Uncaught ReferenceError: first is not defined
		}
		
		// вызов второй функции
		fnSecond();		
	</script>

</body>
