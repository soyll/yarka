<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>	

	<script>	
		let album = JSON.parse(window.name);

		document.write('<h2>' + album.team + ' — ' + album.name + '</h2>');
		document.write('<p><img src="' + album.path + '" alt="' + album.alias + '" width="300"></p>');
		document.write('<p><b>' + album.country + ', ' + album.date + '</b></p>');
		document.write('<p>' + album.content + '</p>');
		document.write('<p><i>' + album.note + '</i></p>');
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
