<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<script src="clothes.js"></script>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<div id="content"></div>
	
	<script>
		let titles = {
			id: 'Идентификатор товара',
			title: 'Название',
			brand: 'Бренд',
			colour: 'Цвет',
			country: 'Страна изготовитель',
			hood: 'Капюшон',
			size: 'Размер',
			price: 'Цена',
			image: 'Изображение'
		};

		let html = '';

		for (let item of order) {
			for (let key in item) {
				if (key === 'image') {
					html += `<p>${titles[key]}:</p><img src="images/${item[key]}" width="220">`;
				} else {
					html += `<p>${titles[key]}: ${item[key]}</p>`;
				}
			}
			html += '<hr>';
		}

		document.getElementById('content').innerHTML = html;
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
