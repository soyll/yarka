<!doctype html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Программирование в среде JavaScript</title>
</head>
<body>
    <header>
        <h1 align="center">Управляющие конструкции</h1>
    </header>

    <script>
        let television = [
            ["Диагональ", "24", 1], 
            ["Матрица", "LED", 1], 
            ["Количество кадров в секунду", "60 Гц", 0], 
            ["Фирма", "DEXP", 1], 
            ["Модель", "H24F7000E", 0], 
            ["Разрешение экрана", "HD", 1], 
            ["Цена", "8 499 ₽", 1], 
            ["Путь до изображения", "img/H24F7000E.jpg", 0], 
            ["Описание", "Телевизор LED DEXP H24F7000E отличается столь компактными размерами, что место для него найдется даже на самой маленькой кухне. Благодаря VESA-креплению разместить его получится даже на стене, чтобы освободить на горизонтальных поверхностях место для других вещей.", 1]
        ]
        
        let html = '<ul>';

        for (let row of television) {
            if (row[2] === 1) {
                html += `<li><b>${row[0]}:</b> ${row[1]}</li>`;
            }
        }

        html += '</ul>';
        document.write(html);
    </script>

    <footer align="center">
        <h3>Добро пожаловать на pechora_PRO</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>   
</body>
</html>
