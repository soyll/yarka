<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<div id="content"></div>

	<script>
		let order = 
		{
			id : ["Номер",1],
			title : ["Название","Утепленная стеганая куртка"],
			brand : ["Бренд","MARCO DI RADI"],
			colour : ["Цвет","Синий"],
			country : ["Страна","Китай"],
			hood : ["Капюшон","Есть"],
			size : ["Размер","52"],
			price : ["Цена",25.590],
			image: ["Путь","images/steganaya-marco.jpg"]
		};	
		
		// инициируем переменную
		out = '<ul>';

		// цикл for-in перебирает !-ключи-!
		for (key in order) {
			out += `<li>${order[key][0]} - ${order[key][1]}</li>`;
		}
		
		out += '</ul>';

		// выведем в документ результат работы цикла
		document.querySelector("#content").innerHTML = out;
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_proger" target="__blank">pechora_PROger</a>
	</footer>
</body>
</html>
