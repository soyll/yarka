<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<div id="content"></div>

	<script>
		// инициируем объект 
		let order = {
			id: 61,
			title: "Утепленная стеганая куртка",
			brand: "MARCO DI RADI",
			colour: "Синий",
			country: "Китай",
			hood: "Есть",
			size: "52",
			price: 25.590,
			image: "steganaya-marco.jpg"
		};

		// инициируем переменную
		out = '<ul>';

		// цикл for-in перебирает !-ключи-!
		for (key in order) {
			out += `<li>${key}: ${order[key]}</li>`;
		}
		
		out += '</ul>';
		
		// выведем в документ результат работы цикла
		document.querySelector("#content").innerHTML = out;
	</script>

	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
</body>
</html>
