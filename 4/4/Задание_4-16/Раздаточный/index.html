<!doctype html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Программирование в среде JavaScript</title>
</head>
<body>
    <header>
        <h1 align="center">Управляющие конструкции</h1>
    </header>

    <script>
        let teams =
        {
            id: 1,
            name: "Aerosmith",
            alias: "aerosmith",
            country: "США",
            content: "Группа Aerosmith ...",
            date: 1970,
            style: "хард-рок",
            link: "https://ru.wikipedia.org/wiki/Aerosmith",
        }

        let html = '<form>';

        for (let key in teams) {
            html += `<p><input type="text" name="${key}" value="${teams[key]}"></p>`;
        }

        html += '<p><button type="button">Редактировать</button></p></form>';
        document.write(html);
    </script>

    <footer align="center">
        <h3>Добро пожаловать на pechora_PRO</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>   
</body>
</html>
