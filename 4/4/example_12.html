<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>
		
	<h2>Словарь Web - Дизайнера</h2>

	<script>
		// инициируем массив объектов
		let arr = 
		[
			{dt: 'Контент', dd: 'Содержимое макета, которое не относится непосредственно к дизайну - тексты, графика (фотографии, иконки, логотипы и иллюстрации), видео.'},

			{dt: 'Композиция', dd: 'Способ размещения всех элементов макета друг относительно друга. Самые часто встречаемые виды композиции - центральная и боковая.'},
			
			{dt: 'Навигация', dd: 'Система ссылок, с помощью которых посетитель перемещается по страницам. Стандартным элементом навигации являются меню.'},

			{dt: 'Интерфейс (UI)', dd: 'Совокупность средств, методов и правил взаимодействия между элементами системы. Пользователь вводит информацию при помощи специальных средств (кнопок, инпутов), а сайт реагирует ответ своими средствами (визуальными, звуковыми и т.д.)'},
		 
			{dt: 'Элемент интерфейса', dd: 'Отдельный элемент интерфейса сайта, позволяющий выполнить определенные действия. Самые часто встречаемые элементы интерфейса - кнопки, инпуты, ссылки.'},

			{dt: 'Опыт взаимодействия (UX)', dd: 'Комплексный подход к взаимодействию пользователя с интерфейсом - его отношение и эмоции, вызванные и связанные с использованием продукта, системы.'},

			{dt: 'Юзабилити', dd: 'Уровень удобства использования сайта для его посетителей. Большую роль для юзабилити играет навигация на сайте.'}
		]

		document.write("<dl>");

		for (item of arr) {
			document.write (
				`
					<div>
						<dt>${item.dt}</dt>
						<dd>${item.dd}</dd>
					</div>
				`
			);
		}
		
		document.write("</dl>");
	</script>
	
	<footer align="center">
		<h3>Веб-разработка | Профессионалы | Образование</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
</body>
</html>
