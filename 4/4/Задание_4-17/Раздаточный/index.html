<!doctype html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Программирование в среде JavaScript</title>
</head>
<body>
    <header>
        <h1 align="center">Управляющие конструкции</h1>
    </header>

    <script>
        let teams =
        {
            id: 1,
            name: "Aerosmith",
            alias: "aerosmith",
            country: "США",
            content: "Группа Aerosmith ...",
            date: 1970,
            style: "хард-рок",
            link: "https://ru.wikipedia.org/wiki/Aerosmith",
            albums: [
                ['Aerosmith', 8, 1973], /* название, количество композиций, дата выхода */
                ['Rocks', 9, 1976],
                ['Toys in the Attic', 9, 1975]
            ]
        };

        let html = '';

        for (let key in teams) {
            if (key === 'albums') {
                html += '<h3>Альбомы</h3><ol>';
                for (let i = 0; i < teams.albums.length; i++) {
                    let a = teams.albums[i];
                    html += `<li><b>${a[0]}</b>
                        <ul>
                            <li>Количество композиций - ${a[1]}</li>
                            <li>Дата выпуска - ${a[2]}</li>
                        </ul>
                    </li>`;
                }
                html += '</ol>';
            } else {
                html += `<p>${teams[key]}</p>`;
            }
        }

        document.write(html);
    </script>

    <footer align="center">
        <h3>Добро пожаловать на pechora_PRO</h3>
        <a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
    </footer>   
</body>
</html>
