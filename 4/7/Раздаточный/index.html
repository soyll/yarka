<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<link rel="stylesheet" href="style.css">
	<script src="news.js"></script>
</head>
<body>
	<header>
		<div class="top">
			<h1>Новостная сводка</h1>
		</div>
	</header>

	<main>
		<div class="wrapper">
			<div id="content" class="row">

			</div>
		</div>
	</main>

	<script>
		let box = document.querySelector("#content");

		try {
			let n = +prompt("Сколько новостей показать? (1–12)", 3);

			if (!(n >= 1 && n <= 12)) {
				throw {
					name: "RangeError",
					message: "Значение вне допустимого диапазона 1–12",
					description: "Пользователь указал некорректное количество новостей",
					userMessage: "Упс! Можно вывести только от 1 до 12 новостей."
				};
			}

			for (let i = 0; i < n; i++) {
				let item = newsArr[i];
				box.insertAdjacentHTML("beforeend", `
					<div>
						<img src="${item.image}">
						<span>${item.date}</span>
						<h3>${item.name}</h3>
						<p>${item.text}</p>
					</div>
				`);
			}
		} catch (err) {
			console.log(err.name + ". " + err.message);
			console.log(err.description);
			box.className = "";
			box.innerHTML = `<div class="message">${err.userMessage}</div>`;
		}
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>	
</body>
</html>
