<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<script>
		var i = 0;

		// цикл for
		for (;;) {
			// условие прерывания цикла
			if (i == 5) break;
			console.log(i + ": Hello, JavaScript!");
			i++; // увеличение счетчика на 1
		}
	</script>

	</footer>
</body>
</html>
