<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>
	
	<script>
		var i = 1; 
		document.write("<h2>Считаем слоников</h2>");
		while (i <= 10) {
			document.write (i + "-й слоник <p>");
			// прекращаем цикл при i == 7
			if (i == 7) break;
			i++;
		}
		document.write("<h3>Первая инструкция после цикла</h3>");
	</script>	
	
	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
