<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>
	
	<script>
		var i = 0; 
		document.write("<h2>Считаем динозавриков</h2>");
		
		do {			
			i++;
			// прерываем цикл при i == 5
			if (i == 5) continue;
			document.write (i + "-й динозаврик<br>");
		} while (i < 9);
		
		document.write("<hr>");
		document.write("5-й динозаврик пропал :(");
		document.write("<h3>Вы 5-го динозаврика не видели??</h3>");
	</script>
	
	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
