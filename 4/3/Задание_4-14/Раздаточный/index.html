<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>

	<h2>Список браузеров</h2>

	<ul id="browsers">
		<li>Chrome</li>
		<li>Firefox</li>
		<li>Internet Explorer</li>
		<li>Opera</li>
		<li>Safari</li>
		<li>Microsoft Edge</li>
	</ul>

	<script>
		let lis = document.querySelectorAll('#browsers li');
		let html = '<select>';

		for (let i = 0; i < lis.length; i++) {
			let sel = (i === 3) ? ' selected' : '';
			html += `<option${sel}>${lis[i].innerText}</option>`;
		}

		html += '</select>';
		document.write(html);
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
