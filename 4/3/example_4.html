<!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>	
<body>
	<header>
		<h1 align="center">Управляющие конструкции</h1>
	</header>
	
	<script>
		// инициализируем переменные цикла
		var i = 1; 
		var msg = '';

		// цикл while
		while (i <= 10) {
			// формируем строку
			msg += i + ' x 3 = ' + (i * 3) + '\n';  
			i++;
		}
		// выводим строку в консоль
		console.log(msg);
	</script>

	</footer>
</body>
</html>
