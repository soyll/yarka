 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>
	
	<script>
		// такие данные могли прийти с сервера
		// свойство age не обернуто кавычками
		let json = '{"name":"John",age:30}';
		
		// преобразуем текстовое JSON-представление в JS-объект
		let user = JSON.parse(json); 

		// хотим получить JS-объект user со свойствами name и age
		document.write(user.name); // John
		document.write(user.age);  // 30
	</script>

	<footer align="center">
		<h3>Добро пожаловать на pechora_PRO</h3>
		<a href="https://vk.com/pechora_pro" target="_blank">pechora_PRO</a>
	</footer>
</body>
</html>
