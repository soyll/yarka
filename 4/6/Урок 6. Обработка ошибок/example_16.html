 <!doctype html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>
<body>
	<header>
		<h1 align="center">Условные конструкции</h1>
	</header>
	
	<script>
		try {
			// данные с сервера
			let json = '{"name":"John","age": 30}'; 
			
			// возможная ошибка преобразования данных
			let user = JSON.parse(json); 

			// возможная ошибка отсутствия данных
			if (!user.login){
				throw ReferenceError ("Неполные данные сервера");
			}

			/*
				код, в котором возможно появление других ошибок
			*/ 

		} catch(err){
			
			if (err.name == "SyntaxError") {
				 console.log (err.name + ".  Ошибка преобразования данных");

			} else if (err.name == "ReferenceError") {
				 console.log (err.name + ". " + err.message);
			
			// если это неизвестная ошибка, пробросим ее дальше
			} else 
				throw err;
		}
	</script>

	</footer>
</body>
</html>
