			description: "Пользовательский объект ошибки"
		}

		try {
			if (0){

				// вместо объекта стандартной ошибки - пользовательский объект
				throw objErr;
			}		
		} catch(err){
			// вывод информации об ошибке
			console.log(err.name);

		}
