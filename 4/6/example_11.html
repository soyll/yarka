	<script>
		// создаем объект ошибки типа Error
		let error = new Error("Шеф, все пропало, все пропало!!! Гипс снимают, клиент уезжает!");
		
		// генерируем ошибку
		throw error;

		// чтобы увидеть это сообщение закомментируйте вызов throw 
		console.log("Не будет выведено, в случае генерирования ошибки");
	</script>
