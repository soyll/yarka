  <!-- Верх-Исетский, Академический -->
  <path class="map-region" tabindex="0" role="button" data-district="verh-isetsky" data-href="districts.html#verh-isetsky"
    d="M120 20 L200 15 L210 55 L180 80 L130 70 Z"/>
  <text class="map-label" x="145" y="50">В-Исет.</text>
  <path class="map-region" tabindex="0" role="button" data-district="akademichesky" data-href="districts.html#akademichesky"
    d="M210 15 L280 25 L270 70 L210 55 Z"/>
  <text class="map-label" x="225" y="48">Акад.</text>
  <!-- Ленинский, Кировский -->
  <path class="map-region" tabindex="0" role="button" data-district="leninsky" data-href="districts.html#leninsky"
    d="M60 90 L130 80 L170 120 L140 160 L70 150 Z"/>
  <text class="map-label" x="95" y="125">Ленин.</text>
  <path class="map-region" tabindex="0" role="button" data-district="kirovsky" data-href="districts.html#kirovsky"
    d="M235 115 L310 100 L320 150 L250 165 L170 120 Z"/>
  <text class="map-label" x="255" y="140">Киров.</text>
  <!-- Железнодорожный, Октябрьский -->
  <path class="map-region" tabindex="0" role="button" data-district="zheleznodorozhny" data-href="districts.html#zheleznodorozhny"
    d="M140 160 L250 165 L240 210 L130 200 Z"/>
  <text class="map-label" x="175" y="190">Ж/Д</text>
