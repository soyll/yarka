  <!-- Орджоникидзевский -->
  <path class="map-region" tabindex="0" role="button" data-district="ordzhonikidzevsky" data-href="district-ordzhonikidzevsky.html"
    d="M20 160 L130 200 L120 250 L30 230 Z"/>
  <text class="map-label" x="45" y="210">Ордж.</text>
  <!-- Чкаловский -->
