<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width | Height и котики</title>
    <style>
        .container{
            width:80%;
            margin:0 auto;
            margin-bottom: 3%;
        }
        img{
            margin-right: 5%;
        }

        .normal img.n-1{
            width: 100px;
        }
        .normal img.n-2{
            width: 150px;
        }
        .normal img.n-3{
            height: 200px;
        }
        .normal img.n-4{
            height: 300px;
        }

        .no-normal img.nn-1{
            width: 100px;
            height: 300px;
        }
        .no-normal img.nn-2{
            width: 150px;
            height: 200px;
        }
        .no-normal img.nn-3{
            width: 200px;
            height: 100px;
        }
        .no-normal img.nn-4{
            width: 300px;
            height: 150px;
        }
 
    </style>
</head>
<body>
    <h1>Настройки изображения</h1>
    <h2>Задаем высоту или ширину изображению, второй параметр вычисляется автоматически</h2>
    <div class="container normal">
        <img src="images/cool.jpg" class="border n-1" alt="Крутой котик">
        <img src="images/love.webp" class="border n-2" alt="Влюбленные котики">
        <img src="images/omg.jpg" class="border n-3" alt="Придумайте сами какой котик)">
        <img src="images/morning.webp" class="border n-4" alt="Утренний котик">
    </div>
    <h2>Бедные котики... не делайте так пожалуйста...</h2>
    <div class="container no-normal">
        <img src="images/hello.jpg" class="nn-1" alt="Просто котик">
        <img src="images/oops.webp" class="nn-2" alt="Котик-хлебушек">
        <img src="images/mouse.jpg" class="nn-3" alt="Мышко-котик">
        <img src="images/kus.jpg" class="nn-4" alt="Кусь">
    </div>

</body>
</html>
