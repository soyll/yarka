<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width | Height и котики</title>
    <style>
        .container {
            width: 90%;
            margin: 0 auto;
            margin-bottom: 3%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        p {
            display: block;
            text-align: center;
            font-size: 1.2em;
            font-weight: 700;
        }

        img {
            width: 400px;
        }

        .rendering-1 {
            image-rendering: auto;
        }


        .rendering-2 {
            image-rendering: crisp-edges;
        }

        .rendering-3 {
            image-rendering: pixelated;
        }
    </style>
</head>

<body>
    <h1>Настройки масштабирования изображения</h1>
    <h2>Исходный размер изображения 200*200px</h2>
    <div class="container invert">
        <div>
            <p>auto</p>
            <img src="mouse.jpg" class="rendering-1" alt="Мышко-котик">
        </div>
        <div>
            <p>crisp-edges</p>
            <img src="mouse.jpg" class="rendering-2" alt="Мышко-котик">
        </div>
        <div>
            <p>pixelated</p>
            <img src="mouse.jpg" class="rendering-3" alt="Мышко-котик">
        </div>
    </div>
</body>

</html>
