<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border | Opacity | Box-shadow и котики</title>
    <style>
        .container{
            width:80%;
            margin:0 auto;
            margin-bottom: 3%;
            display: flex;
            justify-content: space-around;
        }

        img{
            width: 250px;
        }

        .border .b-1{
            padding: 5px;
            border: 2px dotted #1f0365;
            border-radius: 50% 20% / 10% 40%;
        }
        .border .b-2{
            padding: 5px;
            border: 5px solid #c0c0c0;
            border-top-left-radius: 20%;
            border-bottom-left-radius: 20%;
        }
        .border .b-3{
            padding: 5px;
            border: 5px solid #c0c0c0;
            border-top-right-radius: 20%;
            border-bottom-right-radius: 20%;
        }
        .border .b-4{
            padding: 5px;
            border: 2px dotted #1f0365;
            border-radius:  10% 40% / 50% 20%;
        }

        .opacity .op-1 { opacity:1;}
        .opacity .op-2 { opacity:0.8; }
        .opacity .op-3 { opacity:0.5; }
        .opacity .op-4 { opacity:0.2;}


        .box-shadow .bs-1{
            box-shadow: 4px 4px 8px 0px rgba(34, 60, 80, 0.2);
        }
        .box-shadow .bs-2{
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
        }
        .box-shadow .bs-3{
            box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 4px, rgba(0, 0, 0, 0.3) 0px 7px 13px -3px, rgba(0, 0, 0, 0.2) 0px -3px 0px inset;
        }
        .box-shadow .bs-4{
            box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;
        }

    </style>
</head>
<body>
    <h1>Настройки изображения</h1>
    <h2>Изображениям, также как и блокам или тексту можно задавать настройки границ: скругление, толщина и тип границы</h2>
    <div class="container border">
        <img src="images/cool.jpg" class="border b-1" alt="Крутой котик">
        <img src="images/love.webp" class="border b-2" alt="Влюбленные котики">
        <img src="images/omg.jpg" class="border b-3" alt="Придумайте сами какой котик)">
        <img src="images/morning.webp" class="border b-4" alt="Утренний котик">
    </div>
    <h2>Управляем их прозрачностью с помощью свойства opacity.</h2>
    <div class="container opacity">
        <img src="images/more_love.jpg" class="op-1" alt="Влюбленные котики">
        <img src="images/more_love.jpg" class="op-2" alt="Влюбленные котики">
        <img src="images/more_love.jpg" class="op-3" alt="Влюбленные котики">
        <img src="images/more_love.jpg" class="op-4" alt="Влюбленные котики">
    </div>
    <h2>Задаем тень изображению как блоку с помощью box-shadow</h2>
    <div class="container box-shadow">
        <img src="images/hello.jpg" class="bs-1" alt="Просто котик">
        <img src="images/oops.webp" class="bs-2" alt="Котик-хлебушек">
        <img src="images/mouse.jpg" class="bs-3" alt="Мышко-котик">
        <img src="images/kus.jpg" class="bs-4" alt="Кусь">
    </div>


</body>
</html>
