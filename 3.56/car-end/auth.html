<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <title>Вход — Индекс Драйв</title>
    <style>
        section.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2%; }
        .form_auth { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .form_auth h3 { font-size: 2em; margin-bottom: 1rem; }
        .form_auth input { width: 100%; padding: 15px; margin: 10px 0; font-size: 1em; }
        .form_auth a { color: #f59e00; margin-top: 1rem; }
    </style>
</head>
<body>
    <section class="auth search">
        <form class="form_auth" action="#" method="post">
            <h3>Вход</h3>
            <input type="text" name="login" placeholder="Логин" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="submit" value="Войти">
            <a href="register.html">Нет аккаунта? Регистрация</a>
            <a href="index.html">На главную</a>
        </form>
    </section>
</body>
</html>
