<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style/style.css">
    <title>Регистрация — Индекс Драйв</title>
    <style>
        section.reg { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2%; }
        .form_reg { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .form_reg h3 { font-size: 2em; margin-bottom: 1rem; }
        .form_reg input, .form_reg select { width: 100%; padding: 15px; margin: 10px 0; font-size: 1em; }
        .form_reg a { color: #f59e00; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <section class="reg search">
        <form class="form_reg" action="#" method="post">
            <h3>Регистрация</h3>
            <input type="text" name="login" placeholder="Логин" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <input type="password" name="password2" placeholder="Повторите пароль" required>
            <select name="region">
                <option value="">Регион</option>
            </select>
            <input type="submit" value="Зарегистрироваться">
            <a href="auth.html">Вход</a>
            <a href="index.html">На главную</a>
        </form>
    </section>
</body>
</html>
