<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <header>
        <h1>Регистрация</h1>
    </header>
    <div>
        <form action="account.html">

            <div>
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" placeholder="Введите имя"
                    required minlength="2" maxlength="15"
                    pattern="[а-яА-ЯёЁ\s\-]{2,15}"
                    title="Кириллица, от 2 до 15 символов">
            </div>

            <div>
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" placeholder="Введите email" required>
            </div>

            <div>
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль"
                    required minlength="8" maxlength="15"
                    pattern="[a-zA-Z0-9]{8,15}"
                    title="Латиница или цифры, от 8 до 15 символов">
            </div>

            <div>
                <label for="password-rep">Подтверждение пароля</label>
                <input type="password" id="password-rep" name="password-rep" placeholder="Повторно введите пароль"
                    required minlength="8" maxlength="15"
                    pattern="[a-zA-Z0-9]{8,15}"
                    title="Латиница или цифры, от 8 до 15 символов">
            </div>

            <div>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Запомнить пароль</label>
            </div>

            <div>
                <input type="submit" value="Зарегистрироваться">
                <a href="authentication.html">Войти</a>
            </div>
        </form>
    </div>
</body>
</html>
