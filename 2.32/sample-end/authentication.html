<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <header>
        <h1>Вход</h1>
    </header>
    <div>
        <form action="account.html">

            <div>
                <label for="tel">Телефон</label>
                <br>
                <input type="tel" id="tel" name="tel" placeholder="Введите номер телефона"
                    required minlength="11" maxlength="12"
                    pattern="^[+]?[0-9]{11,12}$"
                    title="Только цифры и символ +, от 11 до 12 символов">
            </div>

            <div>
                <label for="password">Пароль</label>
                <br>
                <input type="password" id="password" name="password" placeholder="Введите пароль"
                    required minlength="8" maxlength="15"
                    pattern="[a-zA-Z0-9]{8,15}"
                    title="Латиница или цифры, от 8 до 15 символов">
            </div>

            <div>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Запомнить пароль</label>
            </div>

            <div>
                <input type="submit" value="Войти">
                <a href="registration.html">Зарегистрироваться</a>
            </div>
            
        </form>
    </div>
</body>
</html>
