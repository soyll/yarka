<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
</head>
<body>
    <header>
        <h1>Личный кабинет</h1>
    </header>
    <div>
        <form action="сongratulation.html">

            <div>
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" placeholder="Введите имя"
                    required minlength="2" maxlength="15"
                    pattern="[а-яА-ЯёЁ\s\-]{2,15}"
                    title="Кириллица, от 2 до 15 символов">
            </div>

            <div>
                <label for="surname">Фамилия</label>
                <input type="text" id="surname" name="surname" placeholder="Введите фамилию"
                    minlength="5" maxlength="30"
                    pattern="[а-яА-ЯёЁ\s\-]{5,30}"
                    title="Кириллица, от 5 до 30 символов">
            </div>

            <fieldset>
                <legend>Выберите свой пол</legend>
                <input type="radio" id="pol-m" name="pol" value="m">
                <label for="pol-m">Мужской</label>
                <input type="radio" id="pol-f" name="pol" value="f">
                <label for="pol-f">Женский</label>
                <input type="radio" id="pol-n" name="pol" value="n">
                <label for="pol-n">Другой</label>
            </fieldset>

            <div>
                <label for="date">Год рождения</label>
                <input type="date" id="date" name="birth-date" max="2006-12-31">
            </div>

            <fieldset>
                <legend>Выберите технологии (можно несколько)</legend>
                <div>
                    <input type="checkbox" id="html" name="tech" value="html">
                    <label for="html">HTML</label>
                </div>
                <div>
                    <input type="checkbox" id="css" name="tech" value="css">
                    <label for="css">CSS</label>
                </div>
                <div>
                    <input type="checkbox" id="js" name="tech" value="js">
                    <label for="js">JavaScript</label>
                </div>
                <div>
                    <input type="checkbox" id="php" name="tech" value="php">
                    <label for="php">PHP</label>
                </div>
            </fieldset>

            <div>
                <label for="level">Выберите уровень сложности</label>
                <select name="level" id="level">
                    <option value="">Выберите уровень</option>
                    <option value="elementary">Начальный</option>
                    <option value="advanced">Продвинутый</option>
                </select>
            </div>

            <div>
                <input type="checkbox" id="rules" name="rules" value="yes" required
                    title="Необходимо согласие для записи на курс">
                <label for="rules">Согласен с правилами записи на курсы</label>
            </div>

            <div>
                <input type="submit" value="Записаться">
                <a href="authentication.html">Выйти</a>
            </div>
        </form>
    </div>
</body>
</html>
