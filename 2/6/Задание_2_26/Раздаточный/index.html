<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
</head>

<body>
	<header>
		<h1 align = "center">Выбор элементов DOM</h1>
	</header>

		<div id='title'>Про Федота-стрельца, удалого молодца</div>
		
		<div id='author'>
			<span>Леонид</span>
			<span>Алексеевич</span>
			<span>Филатов</span>
		</div>

		<!--

		<div id='date'>1987</div>

		<div id="characters">
			<span>Федот</span>
			<span>Маруся</span>
			<span>Царь</span>
			<span>Генерал</span>
		</div>	

		<div id='text'>
			<pre>
			Верьте аль не верьте, а жил на белом свете Федот-стрелец, удалой
			молодец. Был Федот ни красавец, ни урод, ни румян, ни бледен, ни богат, ни
			беден, ни в парше, ни в парче, а так, вообче. Служба у Федота -- рыбалка да
			охота. Царю -- дичь да рыба, Федоту -- спасибо. Гостей во дворце -- как
			семян в огурце. Один из Швеции, другой из Греции, третий с Гавай -- и всем
			жрать подавай! Одному -- омаров, другому -- кальмаров, третьему -- сардин, а
			добытчик один! Как-то раз дают ему приказ: чуть свет поутру явиться ко
			двору. Царь на вид сморчок, башка с кулачок, а злобности в ем -- агромадный
			объем. Смотрит на Федьку, как язвенник на редьку. На Федьке от страха
			намокла рубаха, в висках застучало, в пузе заурчало, тут, как говорится, и
			сказке начало...
			</pre>
		</div>

		-->

	<script>
		let obj = {
			author: {
				name: "",
				surname: "",
				patronymic: ""
			},
			date: "",
			characters: [],
			text: ""
		};

		let authorBlock = document.getElementById("author");
		obj.author.name = authorBlock.children[0].innerText;
		obj.author.patronymic = authorBlock.children[1].innerText;
		obj.author.surname = authorBlock.children[2].innerText;

		let comment;
		for (let i = 0; i < document.body.childNodes.length; i++) {
			if (document.body.childNodes[i].nodeType === 8) {
				comment = document.body.childNodes[i];
				break;
			}
		}

		let tmp = document.createElement("div");
		tmp.innerHTML = comment.data;

		obj.date = tmp.querySelector("#date").innerText;

		let chars = tmp.querySelector("#characters").children;
		for (let i = 0; i < chars.length; i++) {
			obj.characters.push(chars[i].innerText);
		}

		obj.text = tmp.querySelector("#text pre").innerText;

		console.log(obj);
	</script>

</body>
</html>
