<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		table {
			margin: 0 auto;
			margin-top: 15px;
		}
		table * {
			padding: 5px;
		}
	</style>
</head>

<body>
	<header>
		<h1 align = "center">Выбор элементов DOM</h1>
	</header>
	
	<!-- блок для вставки контента -->
	<div class="flights"></div>

	<!-- блок для вставки контента -->
	<div class="passengers"></div>

	<footer>
		<h3 align = "center">Добро пожаловать на pechora_PROger</h3>
	</footer>

	<script>
		// инициализация JS объекта
		obj = {
			    "data": {
			        "items": [
			            {
			                "code": "MGERS",
			                "cost": 40000,
			                "flights": [
			                    {
			                        "flight_id": 1,
			                        "flight_code": "FP2100",
			                        "from": {
			                            "city": "Moscow",
			                            "airport": "Sheremetyevo",
			                            "iata": "SVO",
			                            "date": "2020-10-01",
			                            "time": "08:35"
			                        },
			                        "to": {
			                            "city": "Kazan",
			                            "airport": "Kazan",
			                            "iata": "KZN",
			                            "date": "2020-10-01",
			                            "time": "10:05"
			                        },
			                        "cost": 10500,
			                        "availability": 58
			                    },
			                    {
			                        "flight_id": 2,
			                        "flight_code": "FP1200",
			                        "from": {
			                            "city": "Kazan",
			                            "airport": "Kazan",
			                            "iata": "KZN",
			                            "date": "2020-10-12",
			                            "time": "12:00"
			                        },
			                        "to": {
			                            "city": "Moscow",
			                            "airport": "Sheremetyevo",
			                            "iata": "SVO",
			                            "date": "2020-10-12",
			                            "time": "13:35"
			                        },
			                        "cost": 9500,
			                        "availability": 58
			                    }
			                ],
			                "passengers": [
			                    {
			                        "id": 1,
			                        "first_name": "Ivan",
			                        "last_name": "Ivanov",
			                        "birth_date": "1990-02-20",
			                        "document_number": "1234567890",
			                        "place_from": null,
			                        "place_back": null
			                    },
			                    {
			                        "id": 2,
			                        "first_name": "Ivan",
			                        "last_name": "Sergeev",
			                        "birth_date": "1990-03-20",
			                        "document_number": "1224567890",
			                        "place_from": null,
			                        "place_back": null
			                    }
			                ]
			            }
			        ]
			    }
			}

		let item = obj.data.items[0];
		let flights = item.flights;
		let passengers = item.passengers;

		let flightsHtml = "<h2>Рейсы</h2><table border='1'><tr><th>ID</th><th>Код</th><th>Откуда</th><th>Куда</th><th>Цена</th><th>Мест</th></tr>";
		for (let i = 0; i < flights.length; i++) {
			let f = flights[i];
			flightsHtml += "<tr>"
				+ "<td>" + f.flight_id + "</td>"
				+ "<td>" + f.flight_code + "</td>"
				+ "<td>" + f.from.city + " (" + f.from.iata + ") " + f.from.date + " " + f.from.time + "</td>"
				+ "<td>" + f.to.city + " (" + f.to.iata + ") " + f.to.date + " " + f.to.time + "</td>"
				+ "<td>" + f.cost + "</td>"
				+ "<td>" + f.availability + "</td>"
				+ "</tr>";
		}
		flightsHtml += "</table>";
		document.querySelector(".flights").innerHTML = flightsHtml;

		let passHtml = "<h2>Пассажиры</h2><table border='1'><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Дата рождения</th><th>Документ</th></tr>";
		for (let i = 0; i < passengers.length; i++) {
			let p = passengers[i];
			passHtml += "<tr>"
				+ "<td>" + p.id + "</td>"
				+ "<td>" + p.first_name + "</td>"
				+ "<td>" + p.last_name + "</td>"
				+ "<td>" + p.birth_date + "</td>"
				+ "<td>" + p.document_number + "</td>"
				+ "</tr>";
		}
		passHtml += "</table>";
		document.querySelector(".passengers").innerHTML = passHtml;
	</script>
	
</body>
</html>
