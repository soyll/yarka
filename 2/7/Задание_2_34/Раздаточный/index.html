<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<header>
		<h1 align = "center">Добавление и удаление узлов</h1>
	</header>

	<div class="row">
		<!-- место для вставки контента -->
	</div>

	<footer>
		<h3 align = "center">pechora_PROger</h3>
	</footer>	

	<script>
		let city = {
			title : "<h3>Барселона</h3>",
			
			pict : "barcelona.jpg",
			
			description : "Барселона — прекрасная, чарующая, эффектная и очень необычная столица Каталонии, главной автономной области Испанского королевства. Второй по величине город Пиренейского полуострова, один из крупнейших портов Средиземноморья и мира, любимая точка притяжения для путешественников всех мастей. Барселона настолько многоликая и яркая, что ее по праву можно назвать одним из самых красивых городов земли!"			
		};

		let col = document.createElement("div");
		col.setAttribute("class", "col");

		let img = document.createElement("img");
		img.setAttribute("src", city.pict);
		img.setAttribute("alt", "Барселона");

		let titleBox = document.createElement("div");
		titleBox.innerHTML = city.title;

		let p = document.createElement("p");
		p.append(city.description);

		col.append(img, titleBox, p);
		document.querySelector(".row").append(col);
	</script>

</body>
</html>
