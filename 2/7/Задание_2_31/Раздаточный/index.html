 <!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Программирование в среде JavaScript</title>  
</head>

<body>
    <header>
        <h1 align = "center">Добавление и удаление узлов</h1>
    </header>

    <div class="image-box">
        <!-- место для вставки контента -->
    </div>
    
    <script>
        let title = "<h2>Сальвадор Дали</h2>";
        
        let description = `
            <p>Карьера - <b>режиссер, художник, живописец, скульптор, график</b><br />
            Дата рождения - <b>11 мая 1904 г.</b><br />
            Место рождения - <b>Фигерас, Испания</b></p>
        `;

        let box = document.querySelector(".image-box");

        let img = document.createElement("img");
        img.setAttribute("src", "image/dali.jpg");
        img.setAttribute("alt", "Фото:Сальвадор Дали");
        img.setAttribute("title", "Сальвадор Дали");
        img.setAttribute("width", "350px");

        box.append(img);
        box.insertAdjacentHTML("beforeend", title);
        box.insertAdjacentHTML("beforeend", description);
    </script>

</body>
</html>
