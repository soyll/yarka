<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
	<title>Красивые города мира</title>
	<link rel="stylesheet" href="style.css">
	<script src="data.js"></script>
</head>
<body>

	<header>
		<div class="top">
			<h1>Самые красивые города мира</h1>
		</div>
	</header>

	<main>
		<div class="content">
			<div class="row">
				<!-- место для вставки созданного контента -->
			</div>
		</div>
	</main>

	<script>
		let first = document.createElement("div");
		first.setAttribute("class", "col");

		let img = document.createElement("img");
		let nameP = document.createElement("p");
		let textP = document.createElement("p");

		first.append(img, nameP, textP);

		let blocks = [first];
		for (let i = 1; i < obj.length; i++) {
			blocks.push(first.cloneNode(true));
		}

		for (let i = 0; i < obj.length; i++) {
			blocks[i].children[0].setAttribute("src", obj[i].img);
			blocks[i].children[0].setAttribute("alt", obj[i].name);
			blocks[i].children[1].innerText = obj[i].name;
			blocks[i].children[2].innerText = obj[i].text;
		}

		let row = document.querySelector(".row");
		for (let i = 0; i < blocks.length; i++) {
			row.append(blocks[i]);
		}
	</script>
	
</body>
</html>
