 <!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Программирование в среде JavaScript</title>
	<style>
		.go {
			font-family: Arial;
			font-size: 14pt;
		}
	</style>
</head>

<body>
	<header>
		<h1 align = "center">Атрибуты и стили, часть 2</h1>
	</header>

	<div id="citate" class="go" title="Цитата из наставления отца Чичикова" style="width: 60%; margin: 0 auto; padding: 20px; margin-top: 20px; background: #eee; border-radius:10px; box-shadow: 0px 0px 15px #595959;" data-book="Мертвые души" data-character-book="Отец Чичикова" data-author-book="Н.В. Гоголь">"... больше всего береги и копи <b>копейку</b>: эта вещь надежнее всего на свете. Товарищ или приятель тебя надует и в беде первый тебя выдаст, а <b>копейка</b> не выдаст, в какой бы беде ты ни был. Все сделаешь и все прошибешь на свете <b>копейкой</b>..."</div>	
	
	<script>
		let div = document.body.firstElementChild.nextElementSibling;

		let obj = {
			content: div.innerHTML,
			id: div.id,
			style: {},
			strStyle: div.getAttribute("style"),
			class: div.className,
			title: div.title,
			data: []
		};

		for (let i = 0; i < div.style.length; i++) {
			let prop = div.style[i];
			obj.style[prop] = div.style.getPropertyValue(prop);
		}

		for (let key in div.dataset) {
			obj.data.push(div.dataset[key]);
		}

		console.log(obj);
	</script>
	
</body>
</html>
