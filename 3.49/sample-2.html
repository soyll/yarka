<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Image Placeholder</title>
	<style>
		h1 {
			text-align: center;
			padding: 2%;
		}

		div.row {
			display: flex;
			justify-content: space-between;
			width: 90%;
			margin: 0 auto;
			margin-bottom: 3%;
			background-color: #ebd6d6;
			padding: 1%;
			color: #333333;
			font-size: 22pt;
			line-height: 1.5;
		}

		div.foto {
			text-align: center;
			min-width: 45%;
			height: 100%;
		}

		div.text {
			width: 55%;
		}

		div.text>ul {
			list-style: none;
		}
	</style>
</head>

<body>
	<main>
		<h1>Placeholder: Изображение кошечек (в прямом смысле;)</h1>

		<div class="row">
			<div class="foto">
				<img src="http://placekitten.com/g/250/200" alt="placeholder">
			</div>
			<div class="text">
				<ul>
					<li>src="http://placekitten.com/g/250/200"</li>
					<li>размер: 250x200px</li>
					<li>цветность: серая (gray)</li>
				</ul>
			</div>
		</div>

		<div class="row">
			<div class="foto">
				<img src="http://placekitten.com/300" alt="placeholder">
			</div>
			<div class="text">
				<ul>
					<li>src="http://placekitten.com/300"</li>
					<li>размер: 300x300px</li>
					<li>цветность: цветная</li>
				</ul>
			</div>
		</div>

	</main>
</body>

</html>
